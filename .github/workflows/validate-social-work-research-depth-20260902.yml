name: Validate Social Work Research Depth (Manual Deep Check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify research-depth content contract
        run: node scripts/social-work-research-depth-contract.mjs
      - name: Typecheck
        run: npm run typecheck
