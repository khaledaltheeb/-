name: Staging Cognitive Live Smoke

on:
  push:
    branches: [agent/staging-cognitive-live-smoke]
    paths:
      - '.github/workflows/staging-cognitive-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed cognitive program comprehensively
        shell: bash
        run: |
          set -euo pipefail
          base='https://rawafid-platform-staging.khaledaltheeb.workers.dev'
          tmp=/tmp/rawafid-cognitive-live
          rm -rf "$tmp" && mkdir -p "$tmp"

          fetch() {
            local path="$1" out="$2"
            local code
            code=$(curl --connect-timeout 10 --max-time 45 -L -sS -o "$out" -w '%{http_code}' "${base}${path}")
            echo "${path} => HTTP ${code} bytes=$(wc -c < "$out")"
            test "$code" = '200'
          }

          fetch '/sections/cognitive-processes' "$tmp/root.html"
          fetch '/sections/cognitive-processes?page=2' "$tmp/page2.html"

          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/rawafid-cognitive-live/root.html').read_text(encoding='utf-8')
          nums=re.findall(r'([0-9٠-٩٬,]+)\s*صفحة',html)
          trans=str.maketrans('٠١٢٣٤٥٦٧٨٩٬','0123456789,')
          values=[]
          for raw in nums:
              try: values.append(int(raw.translate(trans).replace(',','')))
              except ValueError: pass
          if not values:
              raise SystemExit('Could not extract live cognitive page count')
          live=max(values)
          print(f'LIVE_COGNITIVE_PAGE_COUNT={live}')
          if live < 1000:
              raise SystemExit(f'Live cognitive page count below target: {live}')
          PY

          clusters=(
            attention-focus
            working-memory-control
            long-term-memory
            memory-learning-processes
            perception-integration
            language-processing
            communication-executive
            self-regulation-metacognition
            reasoning-problem-solving
            applied-cognition
          )
          for slug in "${clusters[@]}"; do
            grep -q "/sections/${slug}" "$tmp/root.html"
            fetch "/sections/${slug}" "$tmp/cluster-${slug}.html"
          done

          samples=(
            visuospatial-working-memory-work-study
            sustained-attention-classroom-learning
            memory-consolidation-mechanisms
            interoception-assessment
            deductive-reasoning-interpreting-results
          )
          for slug in "${samples[@]}"; do
            fetch "/content/${slug}" "$tmp/content-${slug}.html"
            grep -q 'المصادر والمراجع' "$tmp/content-${slug}.html"
            grep -q 'FAQPage' "$tmp/content-${slug}.html"
          done

          fetch '/search?q=%D8%A7%D9%84%D8%A7%D9%86%D8%AA%D8%A8%D8%A7%D9%87%20%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%85%D8%B1' "$tmp/search.html"
          grep -q '/content/sustained-attention-' "$tmp/search.html"

          # Staging is intentionally non-indexable. Sitemaps must return valid empty XML,
          # while robots.txt must disallow crawling. Production builds with indexing=true
          # are separately covered by the repository quality gate.
          fetch '/sitemaps/content.xml' "$tmp/content-sitemap.xml"
          grep -q '<urlset' "$tmp/content-sitemap.xml"
          ! grep -q '<url>' "$tmp/content-sitemap.xml"
          fetch '/sitemaps/taxonomy.xml' "$tmp/taxonomy-sitemap.xml"
          grep -q '<urlset' "$tmp/taxonomy-sitemap.xml"
          ! grep -q '<url>' "$tmp/taxonomy-sitemap.xml"
          fetch '/robots.txt' "$tmp/robots.txt"
          grep -qi 'Disallow: /' "$tmp/robots.txt"

          grep -Eq 'page=2|الصفحة التالية' "$tmp/root.html"
          echo 'LIVE_COGNITIVE_COMPREHENSIVE_SMOKE=PASS'
          echo "LIVE_BASE=${base}"
          echo "CLUSTERS_TESTED=${#clusters[@]}"
          echo "CONTENT_SAMPLES_TESTED=${#samples[@]}"
          echo 'FAQ_SCHEMA_SAMPLES=PASS'
          echo 'STAGING_NOINDEX_GUARD=PASS'
          echo "TOTAL_RESPONSE_BYTES=$(du -cb "$tmp"/* | tail -1 | cut -f1)"
