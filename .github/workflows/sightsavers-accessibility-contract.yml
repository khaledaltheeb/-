name: Sightsavers Accessibility Contract

on:
  pull_request:
    paths:
      - 'app/accessibility/sightsavers/**'
      - 'app/sitemaps/sightsavers-accessibility.xml/**'
      - 'app/sitemap.xml/route.ts'
      - 'scripts/sightsavers-accessibility-contract.mjs'
  push:
    branches: [main]
    paths:
      - 'app/accessibility/sightsavers/**'
      - 'app/sitemaps/sightsavers-accessibility.xml/**'
      - 'app/sitemap.xml/route.ts'
      - 'scripts/sightsavers-accessibility-contract.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sightsavers-accessibility-contract.mjs
