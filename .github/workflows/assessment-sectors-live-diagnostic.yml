name: Assessment Sectors Live Diagnostic

on:
  push:
    branches:
      - assessment-sectors-audit-20260906
    paths:
      - 'scripts/assessment-sectors-live-diagnostic.mjs'
      - '.github/workflows/assessment-sectors-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe representative live routes sequentially
        run: node scripts/assessment-sectors-live-diagnostic.mjs
