name: Basira RC10 Enterprise Navigation CI

on:
  push:
    branches:
      - agent/basira-rc10-enterprise-navigation-20260910
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore verified RC9 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10169800967/zip" \
            -o /tmp/basira-rc9-artifact.zip
          rm -rf /tmp/basira-rc9-artifact basira-rc10
          mkdir -p /tmp/basira-rc9-artifact basira-rc10
          unzip -q /tmp/basira-rc9-artifact.zip -d /tmp/basira-rc9-artifact
          test -f /tmp/basira-rc9-artifact/Basira-v1.0.0-rc9-source.zip
          echo "b8606d8ebd7b4a60b8a7d07764482921148f10d8c43c9a19e60d5e48c78eab4a  /tmp/basira-rc9-artifact/Basira-v1.0.0-rc9-source.zip" | sha256sum -c -
          unzip -q /tmp/basira-rc9-artifact/Basira-v1.0.0-rc9-source.zip -d basira-rc10
          rm -rf basira-rc10/.gradle basira-rc10/app/build
          test -f basira-rc10/app/build.gradle.kts
          grep -F 'versionName = "1.0.0-rc9"' basira-rc10/app/build.gradle.kts
          echo "0720bf247bd76e6594ea28fa9c6f7c5242be774818997dbbeffc4da460c723bb  basira-rc10/app/src/main/assets/efficientdet_lite0.tflite" | sha256sum -c -

      - name: Apply verified RC10 enterprise overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < basira_rc10_overlay/part00.b64)" -eq 12000
          test "$(wc -c < basira_rc10_overlay/part01.b64)" -eq 12000
          test "$(wc -c < basira_rc10_overlay/part02.b64)" -eq 12000
          test "$(wc -c < basira_rc10_overlay/part03.b64)" -eq 12000
          test "$(wc -c < basira_rc10_overlay/part04.b64)" -eq 12000
          test "$(wc -c < basira_rc10_overlay/part05.b64)" -eq 6716
          cat \
            basira_rc10_overlay/part00.b64 \
            basira_rc10_overlay/part01.b64 \
            basira_rc10_overlay/part02.b64 \
            basira_rc10_overlay/part03.b64 \
            basira_rc10_overlay/part04.b64 \
            basira_rc10_overlay/part05.b64 \
            | tr -d '\n\r' | base64 --decode > /tmp/basira-rc10-overlay.tar.gz
          echo "bc16c8c62d04bef03ef5ad80166e81df7387767eefdc073c43eb122d42815bd7  /tmp/basira-rc10-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/basira-rc10-overlay.tar.gz -C basira-rc10
          grep -F 'versionCode = 10009' basira-rc10/app/build.gradle.kts
          grep -F 'versionName = "1.0.0-rc10"' basira-rc10/app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".debug"' basira-rc10/app/build.gradle.kts
          test -f basira-rc10/ci/basira-ci-debug.keystore
          test -f basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/RuntimeSafetyEnvelope.kt
          test -f basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/NavigationPreflight.kt
          test -f basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/ThermalHealth.kt
          test -f basira-rc10/app/src/main/java/org/healthrenewal/basira/audio/HapticPatternPlanner.kt
          test -f basira-rc10/app/src/main/java/org/healthrenewal/basira/ar/DetectorLetterboxTransform.kt
          test -f basira-rc10/docs/FIELD_ACCEPTANCE_RC10.md
          test -f basira-rc10/docs/INSTITUTIONAL_READINESS_RC10.md

      - name: Enterprise safety invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F 'android.permission.INTERNET' basira-rc10/app/src/main/AndroidManifest.xml
          ! grep -R -E 'TODO|FIXME' \
            basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics \
            basira-rc10/app/src/main/java/org/healthrenewal/basira/audio \
            basira-rc10/app/src/main/java/org/healthrenewal/basira/ar \
            basira-rc10/app/src/main/java/org/healthrenewal/basira/nav \
            basira-rc10/app/src/main/java/org/healthrenewal/basira/ui
          grep -F 'SafetyEnvelopeLevel.STOP' basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/RuntimeSafetyEnvelope.kt
          grep -F 'frame_stale' basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/RuntimeSafetyEnvelope.kt
          grep -F 'thermal_guard' basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/RuntimeSafetyEnvelope.kt
          grep -F 'audio_unavailable' basira-rc10/app/src/main/java/org/healthrenewal/basira/diagnostics/RuntimeSafetyEnvelope.kt

      - name: Core smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd basira-rc10
          bash tools/run-core-smoke.sh

      - name: Android unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc10 :app:testDebugUnitTest --stacktrace 2>&1 | tee basira-rc10/unit-test.log

      - name: Summarize and gate unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tests = failures = errors = skipped = suites = 0
          for p in Path('basira-rc10/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(p).getroot()
              suites += 1
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          summary = f"suites={suites} tests={tests} failures={failures} errors={errors} skipped={skipped}"
          print(summary)
          Path('basira-rc10/unit-test-summary.txt').write_text(summary + '\n')
          if suites == 0 or tests < 90 or failures or errors:
              raise SystemExit(1)
          PY

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc10 :app:lintDebug :app:lintRelease --stacktrace 2>&1 | tee basira-rc10/lint.log

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc10 :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee basira-rc10/build.log

      - name: Verify APKs and signing boundary
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find basira-rc10/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          RELEASE_APK="$(find basira-rc10/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK" | tee basira-rc10/debug-signature.txt
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' basira-rc10/debug-signature.txt | head -n1)"
          test "$SIGNER" = "dbea0b677be58fcee5413736ade1d766da9197420ba42bf90870e989ade950b6"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RELEASE_APK" >/dev/null 2>&1; then
            echo "Release APK unexpectedly signed" >&2
            exit 1
          else
            echo "Release APK remains unsigned as intended" | tee basira-rc10/release-signing-status.txt
          fi
          sha256sum "$DEBUG_APK" | tee basira-rc10/debug-apk.sha256
          sha256sum "$RELEASE_APK" | tee basira-rc10/release-apk.sha256

      - name: Package exact RC10 source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/basira-rc10-source
          cp -a basira-rc10 /tmp/basira-rc10-source
          rm -rf /tmp/basira-rc10-source/.gradle /tmp/basira-rc10-source/app/build
          (cd /tmp/basira-rc10-source && zip -qr "$GITHUB_WORKSPACE/Basira-v1.0.0-rc10-source.zip" .)
          sha256sum Basira-v1.0.0-rc10-source.zip > Basira-v1.0.0-rc10-source.zip.sha256

      - name: Upload Basira RC10 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: basira-rc10-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            basira-rc10/app/build/outputs/apk/**/*.apk
            basira-rc10/app/build/reports/**
            basira-rc10/app/build/test-results/**
            basira-rc10/unit-test.log
            basira-rc10/unit-test-summary.txt
            basira-rc10/lint.log
            basira-rc10/build.log
            basira-rc10/debug-signature.txt
            basira-rc10/debug-apk.sha256
            basira-rc10/release-apk.sha256
            basira-rc10/release-signing-status.txt
            Basira-v1.0.0-rc10-source.zip
            Basira-v1.0.0-rc10-source.zip.sha256
