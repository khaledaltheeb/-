name: Diagnose Production HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-html.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live homepage HTML
        shell: bash
        run: |
          set -euo pipefail
          base="https://healthrenewal.org"
          url="$base/?htmldiag=${GITHUB_RUN_ID}"
          curl -fsS --compressed --retry 4 --retry-delay 1 "$url" -o /tmp/home.html
          sprite_status="$(curl -sS -o /tmp/rawafid-icons.svg -w '%{http_code}' --retry 4 --retry-delay 1 "$base/rawafid-icons.svg")"
          echo "SPRITE_HTTP_STATUS=$sprite_status"
          test "$sprite_status" = "200"
          printf 'SPRITE_RAW_BYTES='; wc -c < /tmp/rawafid-icons.svg
          grep -q 'id="platform-knowledge"' /tmp/rawafid-icons.svg
          grep -q 'id="nav-home"' /tmp/rawafid-icons.svg
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          text=Path('/tmp/home.html').read_text('utf-8', errors='ignore')
          raw=text.encode('utf-8')
          print(f'HTML_RAW_BYTES={len(raw)}')
          print(f'HTML_CHARS={len(text)}')
          print(f'STYLE_LINKS={len(re.findall(r"<link[^>]+rel=[\"\']stylesheet[\"\']", text, re.I))}')
          print(f'ICON_SPRITE_REFS={text.count("/rawafid-icons.svg#")}')

          sector_links=re.findall(r'href=[\"\'](/sectors/[^\"\']+)', text)
          print(f'SECTOR_LINK_INSTANCES={len(sector_links)}')
          print(f'UNIQUE_SECTOR_LINKS={len(set(sector_links))}')
          print(f'ALL_SECTORS_LINKS={len(re.findall(r"href=[\"\']/sectors[\"\']", text))}')

          next_scripts=re.findall(r'<script[^>]*>(.*?)</script>', text, re.I|re.S)
          payloads=[s for s in next_scripts if '__next_f.push' in s]
          print(f'RSC_SCRIPT_COUNT={len(payloads)}')
          print(f'RSC_SCRIPT_BYTES={sum(len(s.encode("utf-8")) for s in payloads)}')

          matches=[m.start() for m in re.finditer(r'<script[^>]*>[^<]*(?:self\.)?__next_f\.push', text, re.I|re.S)]
          first_rsc=min(matches) if matches else len(text)
          print(f'HTML_BEFORE_FIRST_RSC_BYTES={len(text[:first_rsc].encode("utf-8"))}')

          hrefs=re.findall(r'href=[\"\']([^\"\']+)', text)
          print('TOP_REPEATED_HREFS:')
          for href,count in Counter(hrefs).most_common(25):
              print(f'{count}\t{href[:180]}')

          print('LARGEST_INLINE_SCRIPTS:')
          sizes=sorted(
              [(len(s.encode('utf-8')), i, 'RSC' if '__next_f.push' in s else 'INLINE') for i,s in enumerate(next_scripts)],
              reverse=True,
          )
          for size,i,kind in sizes[:15]:
              print(f'{size}\t{kind}\tindex={i}')
          PY
      - name: Upload captured HTML
        uses: actions/upload-artifact@v4
        with:
          name: production-home-html
          path: /tmp/home.html
          retention-days: 1
