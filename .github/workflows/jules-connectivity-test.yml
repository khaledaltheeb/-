name: Jules connectivity test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/jules-connectivity-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-jules:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Test Jules and create a planning-only session
        id: jules
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -u
          REPORT=/tmp/jules-report.md
          : > "$REPORT"
          echo "# Jules connectivity test" >> "$REPORT"
          echo >> "$REPORT"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$REPORT"
          echo "- Run: \`${GITHUB_RUN_ID}\`" >> "$REPORT"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$REPORT"
          echo >> "$REPORT"

          if [ -z "${JULES_API_KEY:-}" ]; then
            echo "## Result" >> "$REPORT"
            echo "JULES_API_KEY is not available in the production GitHub Environment." >> "$REPORT"
            echo "status=secret_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "- Secret visibility: OK" >> "$REPORT"

          sources_code=$(curl --silent --show-error \
            --output /tmp/jules-sources.json \
            --write-out "%{http_code}" \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sources?pageSize=100" || true)

          echo "- Sources endpoint HTTP: ${sources_code}" >> "$REPORT"
          if [ "$sources_code" != "200" ]; then
            echo >> "$REPORT"
            echo "## Result" >> "$REPORT"
            echo "Jules API authentication or Sources access failed." >> "$REPORT"
            error_message=$(jq -r '.error.message // empty' /tmp/jules-sources.json 2>/dev/null || true)
            if [ -n "$error_message" ]; then
              echo "- API message: ${error_message}" >> "$REPORT"
            fi
            echo "status=sources_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_count=$(jq '.sources | length' /tmp/jules-sources.json)
          echo "- Connected Jules sources: ${source_count}" >> "$REPORT"

          source_name=$(jq -r '.sources[]? | select(.githubRepo.owner == "khaledaltheeb" and .githubRepo.repo == "-") | .name' /tmp/jules-sources.json | head -n 1)
          if [ -z "$source_name" ]; then
            echo >> "$REPORT"
            echo "## Result" >> "$REPORT"
            echo "Jules API is reachable, but \`khaledaltheeb/-\` is not enrolled as a Jules Source." >> "$REPORT"
            echo "The repository must be granted to the Google Labs Jules GitHub App once from Jules/GitHub." >> "$REPORT"
            echo "status=source_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "- Target source: \`${source_name}\`" >> "$REPORT"

          sessions_code=$(curl --silent --show-error \
            --output /tmp/jules-sessions.json \
            --write-out "%{http_code}" \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sessions?pageSize=1" || true)

          echo "- Sessions endpoint HTTP: ${sessions_code}" >> "$REPORT"
          if [ "$sessions_code" != "200" ]; then
            echo >> "$REPORT"
            echo "## Result" >> "$REPORT"
            echo "The source is visible, but the Sessions endpoint test failed." >> "$REPORT"
            error_message=$(jq -r '.error.message // empty' /tmp/jules-sessions.json 2>/dev/null || true)
            if [ -n "$error_message" ]; then
              echo "- API message: ${error_message}" >> "$REPORT"
            fi
            echo "status=sessions_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n \
            --arg source "$source_name" \
            '{
              prompt: "Read AGENTS.md first. Inspect this repository and prepare a concise technical audit and a three-item low-risk improvement plan. This is a connectivity test only. Do not modify files, do not create commits, branches, pull requests, deployments, or configuration changes. Stop when the plan is ready and wait for explicit approval.",
              title: "Health Renewal safe Jules connectivity audit",
              sourceContext: {
                source: $source,
                githubRepoContext: { startingBranch: "main" }
              },
              requirePlanApproval: true
            }' > /tmp/jules-session-request.json

          create_code=$(curl --silent --show-error \
            --output /tmp/jules-session.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            --data-binary @/tmp/jules-session-request.json \
            "https://jules.googleapis.com/v1alpha/sessions" || true)

          echo "- Create session HTTP: ${create_code}" >> "$REPORT"
          if [ "$create_code" != "200" ] && [ "$create_code" != "201" ]; then
            echo >> "$REPORT"
            echo "## Result" >> "$REPORT"
            echo "Connectivity passed, but creating the safe planning session failed." >> "$REPORT"
            error_message=$(jq -r '.error.message // empty' /tmp/jules-session.json 2>/dev/null || true)
            if [ -n "$error_message" ]; then
              echo "- API message: ${error_message}" >> "$REPORT"
            fi
            echo "status=create_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          session_name=$(jq -r '.name // empty' /tmp/jules-session.json)
          session_state=$(jq -r '.state // "unknown"' /tmp/jules-session.json)
          session_url=$(jq -r '.url // empty' /tmp/jules-session.json)

          echo >> "$REPORT"
          echo "## Result" >> "$REPORT"
          echo "Jules API connectivity succeeded and a planning-only session was created." >> "$REPORT"
          echo "- Session: \`${session_name}\`" >> "$REPORT"
          echo "- State: \`${session_state}\`" >> "$REPORT"
          if [ -n "$session_url" ]; then
            echo "- Jules URL: ${session_url}" >> "$REPORT"
          fi
          echo "- Plan approval is required before Jules may execute changes." >> "$REPORT"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Publish test result as a GitHub issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/jules-report.md ]; then
            cat > /tmp/jules-report.md <<EOF
          # Jules connectivity test

          The test job ended before a report could be generated. Inspect the workflow logs.
          EOF
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jules connectivity test result - run ${GITHUB_RUN_ID}" \
            --body-file /tmp/jules-report.md
