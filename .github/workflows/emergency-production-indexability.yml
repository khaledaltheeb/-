name: Emergency Production Indexability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-production-indexability.yml'
      - 'lib/daily-tools-catalog.ts'
      - 'lib/public-taxonomy.ts'
      - 'lib/supabase/proxy.ts'
      - 'app/daily-tools/**'
      - 'app/sitemaps/daily-tools.xml/route.ts'
      - 'scripts/build-daily-tools-route-manifest.mjs'
      - 'scripts/materialize-legacy-static-assets.mjs'
      - 'generated/daily-tools-routes.json'
      - 'scripts/live-production-indexability-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: emergency-production-indexability
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
  NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
  NEXT_PUBLIC_ALLOW_INDEXING: 'true'
  NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
  CLOUDFLARE_ACCOUNT_ID: '1910e1ad3c793fd568ba1caafe34f964'
  CLOUDFLARE_ZONE_ID: 'f0024a96330e938e8ceb86ae75200008'
  PRODUCTION_WORKER: 'rawafid-platform-production'
  PRODUCTION_ORIGIN: 'https://healthrenewal.org'
  MIN_PUBLISHED_PAGES: '3806'
  MIN_INDEXABLE_PUBLISHED_PAGES: '3806'
  MIN_LIVE_INDEXABLE_URLS: '3806'

jobs:
  restore-indexability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'indexability/production' --arg description 'Deploying and verifying indexable Rawafid production' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Preserve all published pages and require all to be indexable
        shell: bash
        run: |
          set -euo pipefail
          output="$(npm run public-preservation:validate 2>&1)"
          printf '%s\n' "$output"
          published="$(printf '%s\n' "$output" | sed -n 's/.* \([0-9][0-9]*\) published pages, \([0-9][0-9]*\) indexable published pages.*/\1/p' | tail -n 1)"
          indexable="$(printf '%s\n' "$output" | sed -n 's/.* \([0-9][0-9]*\) published pages, \([0-9][0-9]*\) indexable published pages.*/\2/p' | tail -n 1)"
          test -n "$published"
          test -n "$indexable"
          test "$published" -ge "$MIN_PUBLISHED_PAGES"
          test "$indexable" -ge "$MIN_INDEXABLE_PUBLISHED_PAGES"
          test "$published" -eq "$indexable"
          npm run sitemap-preservation:validate
          npm run static-sitemap:validate

      - name: Generate lightweight Daily Tools route manifest
        run: node scripts/build-daily-tools-route-manifest.mjs

      - name: Type check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build OpenNext with production canonical and indexing enabled
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_psych_encyclopedia_assets.mjs
          node scripts/build_expanded_encyclopedia_assets.mjs
          node scripts/materialize-legacy-static-assets.mjs
          npx opennextjs-cloudflare build --env production

      - name: Deploy production Worker without changing routes yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cat > wrangler.indexability-hotfix.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "rawafid-platform-production",
            "account_id": "1910e1ad3c793fd568ba1caafe34f964",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-09",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": false,
            "preview_urls": false,
            "minify": true,
            "vars": {
              "NEXT_PUBLIC_SUPABASE_URL": "https://ghljwfwqsyfnthvlzxjy.supabase.co",
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY": "sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs",
              "NEXT_PUBLIC_SITE_URL": "https://healthrenewal.org",
              "NEXT_PUBLIC_ALLOW_INDEXING": "true",
              "NEXT_PUBLIC_ENABLE_ANALYTICS": "false"
            },
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          JSON
          npx wrangler deploy --config wrangler.indexability-hotfix.jsonc

      - name: Route healthrenewal.org to the production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"
          upsert_route() {
            pattern="$1"
            current="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
            route_id="$(printf '%s' "$current" | jq -r --arg pattern "$pattern" '.result[] | select(.pattern==$pattern) | .id' | head -n 1)"
            payload="$(jq -n --arg pattern "$pattern" --arg script "$PRODUCTION_WORKER" '{pattern:$pattern,script:$script}')"
            if [ -n "$route_id" ]; then
              response="$(curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api/$route_id" --data "$payload")"
            else
              response="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api" --data "$payload")"
            fi
            printf '%s' "$response" | jq -e '.success == true' >/dev/null
          }
          upsert_route 'healthrenewal.org/*'
          upsert_route 'www.healthrenewal.org/*'

          routes="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
          printf '%s' "$routes" | jq -e --arg script "$PRODUCTION_WORKER" '.result[] | select(.pattern=="healthrenewal.org/*" and .script==$script)' >/dev/null
          printf '%s' "$routes" | jq -e --arg script "$PRODUCTION_WORKER" '.result[] | select(.pattern=="www.healthrenewal.org/*" and .script==$script)' >/dev/null
          if printf '%s' "$routes" | jq -e '.result[] | select((.pattern=="healthrenewal.org/*" or .pattern=="www.healthrenewal.org/*") and .script=="rawafid-platform-staging")' >/dev/null; then
            echo 'A production hostname is still routed to staging.' >&2
            exit 1
          fi

      - name: Audit bare homepage, Googlebot metadata, robots and every sitemap URL
        env:
          INDEXABILITY_CONCURRENCY: '4'
          INDEXABILITY_TIMEOUT_MS: '30000'
          INDEXABILITY_PACING_MS: '100'
          INDEXABILITY_ATTEMPTS: '5'
        run: node scripts/live-production-indexability-contract.mjs

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Production is indexable and every sitemap URL passed'; else state=failure; description='Production indexability deployment or audit failed'; fi
          payload="$(jq -n --arg state "$state" --arg context 'indexability/production' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
