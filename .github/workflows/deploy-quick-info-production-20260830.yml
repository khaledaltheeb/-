name: Deploy Quick Info Production 20260830

# Exact Quick Info release deployment with long-Arabic-title regression verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-quick-info-production-20260830.yml'

permissions:
  contents: read

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

jobs:
  deploy-quick-info:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare token
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/checkout@v7
        with:
          ref: 22f37c79a642ec95896885584ef4b921ab18f2f7
      - name: Verify exact Quick Info release SHA
        run: test "$(git rev-parse HEAD)" = '22f37c79a642ec95896885584ef4b921ab18f2f7'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic Arabic image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          rsvg-convert --version
          fc-match 'Noto Sans Arabic'
      - name: Verify Quick Info release contracts
        run: |
          npm run typecheck
          npm run lint
          node scripts/quick-info-image-contract.mjs
          npm run live-preservation:validate
      - name: Verify Cloudflare access
        run: npx wrangler whoami
      - name: Build exact production Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy exact production Worker
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify Quick Info Arabic title spacing live production
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp='22f37c79a642ec95896885584ef4b921ab18f2f7'
          stress_slug='overthinking-check'
          get() { curl -fsSL --compressed --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "$1"; }
          hub="$(get "${base}/quick-info/?release=${stamp}")"
          sitemap="$(get "${base}/sitemaps/quick-info.xml?release=${stamp}")"
          [[ "$hub" == *'معلومات سريعة'* ]]
          [[ "$hub" == *'/assets/brand/logo-mark.svg'* ]]
          [[ "$sitemap" == *'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"'* ]]
          [[ "$sitemap" == *"/quick-info/discover/${stress_slug}.png"* ]]
          [[ "$sitemap" == *"/quick-info/og/${stress_slug}.png"* ]]
          page_url="${base}/quick-info/${stress_slug}/"
          page="$(get "${page_url}?release=${stamp}")"
          discover_url="${base}/quick-info/discover/${stress_slug}.png"
          card_url="${base}/quick-info/og/${stress_slug}.png"
          discover_headers="$(curl -fsSI --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${discover_url}?release=${stamp}")"
          card_headers="$(curl -fsSI --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${card_url}?release=${stamp}")"
          [[ "$page" == *'data-quick-info-indexable-image'* ]]
          [[ "$page" == *"/quick-info/og/${stress_slug}.png"* ]]
          [[ "$page" == *"/quick-info/discover/${stress_slug}.png"* ]]
          [[ "$page" == *'ImageObject'* ]]
          [[ "$page" == *'1280'* ]]
          [[ "$page" == *'720'* ]]
          [[ "$page" == *'/assets/brand/logo-mark.svg'* ]]
          grep -m 1 -Eq '^HTTP/[0-9.]+ 200( |$)' <<< "$discover_headers"
          grep -m 1 -Eqi '^content-type: image/png' <<< "$discover_headers"
          grep -m 1 -Eq '^HTTP/[0-9.]+ 200( |$)' <<< "$card_headers"
          grep -m 1 -Eqi '^content-type: image/png' <<< "$card_headers"
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${discover_url}?release=${stamp}" -o /tmp/quick-info-discover.png
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${card_url}?release=${stamp}" -o /tmp/quick-info-card.png
          test "$(identify -format '%wx%h' /tmp/quick-info-discover.png)" = '1280x720'
          test "$(identify -format '%wx%h' /tmp/quick-info-card.png)" = '1200x630'
          echo "Quick Info long-title release ${stamp} is live: ${page_url} | Discover ${discover_url} (1280x720) | Card ${card_url} (1200x630)"
