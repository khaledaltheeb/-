name: Build Rawafid Signed Play AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-play-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      RAWAFID_KEYSTORE_PASSWORD: ${{ secrets.RAWAFID_KEYSTORE_PASSWORD }}
      RAWAFID_KEY_ALIAS: ${{ secrets.RAWAFID_KEY_ALIAS }}
      RAWAFID_KEY_PASSWORD: ${{ secrets.RAWAFID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release signing secrets
        env:
          RAWAFID_KEYSTORE_BASE64: ${{ secrets.RAWAFID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$RAWAFID_KEYSTORE_BASE64"
          test -n "$RAWAFID_KEYSTORE_PASSWORD"
          test -n "$RAWAFID_KEY_ALIAS"
          test -n "$RAWAFID_KEY_PASSWORD"
      - name: Restore release keystore
        env:
          RAWAFID_KEYSTORE_BASE64: ${{ secrets.RAWAFID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$RAWAFID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rawafid-upload.keystore"
          chmod 600 "$RUNNER_TEMP/rawafid-upload.keystore"
          echo "RAWAFID_KEYSTORE_PATH=$RUNNER_TEMP/rawafid-upload.keystore" >> "$GITHUB_ENV"
      - name: Validate release manifest and security invariants
        run: |
          set -eu
          ! grep -R 'android:debuggable="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build signed Play release bundle
        run: gradle --no-daemon clean bundleRelease
      - name: Run release lint
        run: gradle --no-daemon lintRelease
      - name: Analyze release R8 configuration
        run: gradle --no-daemon :app:analyzeReleaseR8Config
      - name: Enforce AAB size budget
        run: |
          set -eu
          aab=$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$aab"
          bytes=$(wc -c < "$aab")
          max=$((20 * 1024 * 1024))
          echo "AAB bytes: $bytes / budget: $max"
          test "$bytes" -le "$max"
      - name: Verify AAB signature
        run: |
          set -eu
          aab=$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)
          jarsigner -verify -verbose -certs "$aab"
          ! jarsigner -verify "$aab" 2>&1 | grep -q 'jar is unsigned'
          sha256sum "$aab" | tee app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-play-release-aab-signed
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/bundle/release/*.sha256
          if-no-files-found: error
