name: Deploy Analytics Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-analytics-production.yml'
      - 'app/layout.tsx'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare-production-build.sh'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deploy/analytics-production\",\"description\":\"Deploying GTM and GA4 to healthrenewal.org\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler --version
          npx wrangler whoami

      - name: Verify analytics production contract
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" = 'https://healthrenewal.org'
          test "${NEXT_PUBLIC_ENABLE_ANALYTICS}" = 'true'
          test "${NEXT_PUBLIC_GTM_ID}" = 'GTM-WBLQVBG4'
          test "${NEXT_PUBLIC_GA_MEASUREMENT_ID}" = 'G-VLZMV8Y4JP'
          test "${NEXT_PUBLIC_ENABLE_DIRECT_GA}" = 'true'
          grep -q 'GTM-WBLQVBG4' app/layout.tsx
          grep -q 'NEXT_PUBLIC_GA_MEASUREMENT_ID' app/layout.tsx
          grep -q '"NEXT_PUBLIC_ENABLE_ANALYTICS": "true"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GTM_ID": "GTM-WBLQVBG4"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GA_MEASUREMENT_ID": "G-VLZMV8Y4JP"' wrangler.jsonc

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production Worker
        run: bash scripts/cloudflare-production-build.sh

      - name: Deploy production Worker
        run: npx opennextjs-cloudflare deploy --env production

      - name: Verify analytics on live production
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          for attempt in $(seq 1 24); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            home="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/?analytics-deploy=${stamp}" 2>/dev/null || true)"
            if printf '%s' "$home" | grep -q 'GTM-WBLQVBG4' \
              && printf '%s' "$home" | grep -q 'G-VLZMV8Y4JP' \
              && ! printf '%s' "$home" | grep -qi 'noindex'; then
              echo 'Production analytics deployment verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production analytics identifiers were not visible after deployment.' >&2
          exit 1

      - name: Mark deployment success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/analytics-production\",\"description\":\"GTM and GA4 deployed and verified on production\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - name: Mark deployment failure
        if: failure()
        shell: bash
        run: |
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/analytics-production\",\"description\":\"Production analytics deployment failed\",\"target_url\":\"${RUN_URL}\"}" >/dev/null || true
