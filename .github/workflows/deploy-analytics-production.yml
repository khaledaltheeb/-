name: Deploy Analytics Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-analytics-production.yml'
      - 'app/layout.tsx'
      - 'lib/seo.ts'
      - 'scripts/search-appearance-contract.mjs'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare-production-build.sh'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deploy/analytics-production\",\"description\":\"Deploying production metadata and analytics to healthrenewal.org\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          convert -version
          rsvg-convert --version
          fc-match 'Noto Sans Arabic'

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler --version
          npx wrangler whoami

      - name: Verify production contract
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" = 'https://healthrenewal.org'
          test "${NEXT_PUBLIC_ALLOW_INDEXING}" = 'true'
          test "${NEXT_PUBLIC_ENABLE_ANALYTICS}" = 'true'
          test "${NEXT_PUBLIC_GTM_ID}" = 'GTM-WBLQVBG4'
          test "${NEXT_PUBLIC_GA_MEASUREMENT_ID}" = 'G-VLZMV8Y4JP'
          test "${NEXT_PUBLIC_ENABLE_DIRECT_GA}" = 'true'
          grep -q 'NEXT_PUBLIC_GTM_ID' app/layout.tsx
          grep -q 'NEXT_PUBLIC_GA_MEASUREMENT_ID' app/layout.tsx
          grep -q 'NEXT_PUBLIC_ENABLE_ANALYTICS' app/layout.tsx
          grep -q 'NEXT_PUBLIC_ENABLE_DIRECT_GA' app/layout.tsx
          grep -q "const HOME_TITLE = 'منصة روافد" lib/seo.ts
          grep -q 'siteName: BRAND_NAME' app/layout.tsx
          grep -q 'siteName: BRAND_NAME' lib/seo.ts
          grep -q '"NEXT_PUBLIC_ENABLE_ANALYTICS": "true"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GTM_ID": "GTM-WBLQVBG4"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GA_MEASUREMENT_ID": "G-VLZMV8Y4JP"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_ENABLE_DIRECT_GA": "true"' wrangler.jsonc

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Search appearance contract
        run: npm run search-appearance:validate

      - name: Build production Worker
        run: bash scripts/cloudflare-production-build.sh

      - name: Upload and activate production Worker version without changing routes
        shell: bash
        run: |
          set -euo pipefail
          tag="metadata-${GITHUB_SHA}"
          upload_output="$(npx wrangler versions upload --env production --tag "${tag}" --message "Production metadata ${GITHUB_SHA}" 2>&1 | tee /tmp/wrangler-version-upload.log)"
          printf '%s\n' "${upload_output}"
          version_id="$(printf '%s\n' "${upload_output}" | sed -n 's/.*Worker Version ID: \([0-9A-Fa-f-][0-9A-Fa-f-]*\).*/\1/p' | tail -n 1)"
          if [ -z "${version_id}" ]; then
            echo 'Unable to parse Worker Version ID from Wrangler output.' >&2
            cat /tmp/wrangler-version-upload.log >&2 || true
            exit 1
          fi
          echo "Activating Worker version ${version_id} at 100%."
          npx wrangler versions deploy "${version_id}@100%" --env production -y --message "Activate production metadata ${GITHUB_SHA}"

      - name: Verify live production metadata, indexing and analytics
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          last_home=''
          last_robots=''
          for attempt in $(seq 1 24); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            home="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/?production-deploy=${stamp}" 2>/dev/null || true)"
            robots="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/robots.txt?production-deploy=${stamp}" 2>/dev/null || true)"
            last_home="${home}"
            last_robots="${robots}"
            lower_home="${home,,}"

            title_ok=false
            gtm_ok=false
            ga_ok=false
            canonical_ok=false
            brand_ok=false
            index_ok=true
            robots_ok=false

            [[ "${home}" == *'<title>منصة روافد'* ]] && title_ok=true
            [[ "${home}" == *'GTM-WBLQVBG4'* ]] && gtm_ok=true
            [[ "${home}" == *'G-VLZMV8Y4JP'* ]] && ga_ok=true
            [[ "${lower_home}" == *'rel="canonical"'* && "${home}" == *'https://healthrenewal.org/'* ]] && canonical_ok=true
            [[ "${home}" == *'منصة روافد'* ]] && brand_ok=true
            if [[ "${lower_home}" =~ \<meta[^\>]*name=[\"\']robots[\"\'][^\>]*content=[\"\'][^\"\']*noindex ]] \
              || [[ "${lower_home}" =~ \<meta[^\>]*content=[\"\'][^\"\']*noindex[^\"\']*[\"\'][^\>]*name=[\"\']robots[\"\'] ]]; then
              index_ok=false
            fi
            [[ "${robots}" == *'https://healthrenewal.org/sitemap.xml'* ]] && robots_ok=true

            echo "Live verification attempt ${attempt}: title=${title_ok} gtm=${gtm_ok} ga=${ga_ok} canonical=${canonical_ok} brand=${brand_ok} index=${index_ok} robots=${robots_ok}"
            if [[ "${title_ok}" == true && "${gtm_ok}" == true && "${ga_ok}" == true \
              && "${canonical_ok}" == true && "${brand_ok}" == true \
              && "${index_ok}" == true && "${robots_ok}" == true ]]; then
              echo 'Production deployment verified: site name, canonical, indexability, sitemap discovery and analytics are live.'
              exit 0
            fi
            sleep 5
          done

          echo 'Production metadata deployment was not fully visible after deployment.' >&2
          if [[ "${last_home}" =~ \<title\>([^\<]+)\<\/title\> ]]; then
            echo "Observed title: ${BASH_REMATCH[1]}" >&2
          fi
          echo "Observed homepage bytes: ${#last_home}; robots bytes: ${#last_robots}" >&2
          exit 1

      - name: Mark deployment success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/analytics-production\",\"description\":\"Production metadata and analytics deployed and verified\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - name: Mark deployment failure
        if: failure()
        shell: bash
        run: |
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/analytics-production\",\"description\":\"Production metadata deployment failed\",\"target_url\":\"${RUN_URL}\"}" >/dev/null || true
