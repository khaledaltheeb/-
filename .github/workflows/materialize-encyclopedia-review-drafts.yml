name: Materialize Encyclopedia Review Drafts

on:
  push:
    branches:
      - 'agent/encyclopedia-disability-inclusion-foundation'
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'scripts/materialize_encyclopedia_draft.py'
      - 'scripts/validate_encyclopedia_draft.py'
      - 'scripts/validate_encyclopedia_materialized_payload.py'
      - '.github/workflows/materialize-encyclopedia-review-drafts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/generated/review-drafts/**'
      - 'scripts/materialize_encyclopedia_draft.py'
      - 'scripts/validate_encyclopedia_draft.py'
      - 'scripts/validate_encyclopedia_materialized_payload.py'
      - '.github/workflows/materialize-encyclopedia-review-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile materialization gates
        run: |
          python -m py_compile \
            scripts/validate_encyclopedia_draft.py \
            scripts/materialize_encyclopedia_draft.py \
            scripts/validate_encyclopedia_materialized_payload.py

      - name: Validate and materialize every scientific-review draft
        run: |
          set -euo pipefail
          mkdir -p data/encyclopedia/generated/review-drafts
          count=0
          for draft in data/encyclopedia/drafts/*-v1.json; do
            test -f "$draft"
            base="$(basename "$draft")"
            output="data/encyclopedia/generated/review-drafts/$base"
            echo "Validating and materializing $draft -> $output"
            python scripts/validate_encyclopedia_draft.py \
              "$draft" \
              --plan data/encyclopedia/research/batch-01-source-plan.json
            python scripts/materialize_encyclopedia_draft.py \
              "$draft" \
              --output "$output"
            python scripts/validate_encyclopedia_materialized_payload.py "$output"
            count=$((count+1))
          done
          test "$count" -gt 0
          echo "Materialized $count encyclopedia review draft(s)."

      - name: Reject orphan generated review payloads
        run: |
          set -euo pipefail
          for payload in data/encyclopedia/generated/review-drafts/*-v1.json; do
            test -f "$payload"
            source="data/encyclopedia/drafts/$(basename "$payload")"
            test -f "$source" || { echo "Orphan generated payload: $payload"; exit 1; }
          done

      - name: Commit deterministic review payloads
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/encyclopedia/generated/review-drafts
          if git diff --cached --quiet; then
            echo "Review payloads already materialized."
            exit 0
          fi
          git commit -m "Materialize encyclopedia review payloads"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
