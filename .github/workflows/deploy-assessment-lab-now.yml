name: Publish Assessment Lab Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-assessment-lab-now.yml'

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release contracts
        run: |
          npm run typecheck
          npm run lint
          npm run assessment-lab:validate
          npm run daily-tools:validate
          npm run live-preservation:validate

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Build production application
        run: npm run build

      - name: Verify Assessment Lab production candidate
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-assessment-release.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/assessment-lab >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/rawafid-assessment-release.log >&2 || true; exit 1; fi
          for path in assessment-lab assessment-lab/anger-escalation assessment-lab/performance-anxiety assessment-lab/phq-9-plus; do
            html="$(curl -fsS "http://127.0.0.1:3000/${path}")"
            grep -qi '<html' <<< "$html"
            if grep -qi 'noindex' <<< "$html"; then echo "Unexpected noindex on /${path}" >&2; exit 1; fi
          done
          static_sitemap="$(curl -fsS http://127.0.0.1:3000/sitemaps/static.xml)"
          grep -q '/assessment-lab/anger-escalation' <<< "$static_sitemap"
          grep -q '/assessment-lab/performance-anxiety' <<< "$static_sitemap"

      - name: Build Cloudflare Worker
        env:
          NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
          NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
          NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
          NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
        run: npx opennextjs-cloudflare build --env production

      - name: Deploy Cloudflare Worker
        run: npx opennextjs-cloudflare deploy --env production

      - name: Verify live Assessment Lab release
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_SHA}"
          robots="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${base}/robots.txt?deploy=${stamp}")"
          grep -q "Sitemap: ${base}/sitemap.xml" <<< "$robots"
          for slug in anger-escalation performance-anxiety; do
            html="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${base}/assessment-lab/${slug}?deploy=${stamp}")"
            grep -q "rel=\"canonical\" href=\"${base}/assessment-lab/${slug}/\"" <<< "$html"
            if grep -qi 'noindex' <<< "$html"; then echo "Live /assessment-lab/${slug} is noindex" >&2; exit 1; fi
          done
          hub="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${base}/assessment-lab?deploy=${stamp}")"
          if grep -qi 'noindex' <<< "$hub"; then echo 'Live Assessment Lab hub is noindex' >&2; exit 1; fi
          static_sitemap="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${base}/sitemaps/static.xml?deploy=${stamp}")"
          grep -q '/assessment-lab/anger-escalation' <<< "$static_sitemap"
          grep -q '/assessment-lab/performance-anxiety' <<< "$static_sitemap"
