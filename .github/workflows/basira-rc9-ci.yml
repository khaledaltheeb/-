name: Basira RC9 Performance and Upgrade CI

on:
  push:
    branches:
      - agent/basira-rc9-performance-strengths-20260910
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore verified RC8 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10165943257/zip" \
            -o /tmp/basira-rc8-artifact.zip
          rm -rf /tmp/basira-rc8-artifact basira-rc9
          mkdir -p /tmp/basira-rc8-artifact basira-rc9
          unzip -q /tmp/basira-rc8-artifact.zip -d /tmp/basira-rc8-artifact
          test -f /tmp/basira-rc8-artifact/Basira-v1.0.0-rc8-source.zip
          echo "473289db5188770ccfbfa7738aed4824c81a8af5729adc8ee070f0ae65c72d6c  /tmp/basira-rc8-artifact/Basira-v1.0.0-rc8-source.zip" | sha256sum -c -
          unzip -q /tmp/basira-rc8-artifact/Basira-v1.0.0-rc8-source.zip -d basira-rc9
          rm -rf basira-rc9/.gradle basira-rc9/app/build
          test -f basira-rc9/app/build.gradle.kts
          grep -F 'versionName = "1.0.0-rc8"' basira-rc9/app/build.gradle.kts
          echo "0720bf247bd76e6594ea28fa9c6f7c5242be774818997dbbeffc4da460c723bb  basira-rc9/app/src/main/assets/efficientdet_lite0.tflite" | sha256sum -c -

      - name: Apply verified RC9 performance and upgrade overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < basira_rc9_overlay/part00.b64)" -eq 12000
          test "$(wc -c < basira_rc9_overlay/part01.b64)" -eq 12000
          test "$(wc -c < basira_rc9_overlay/part02.b64)" -eq 12000
          test "$(wc -c < basira_rc9_overlay/part03.b64)" -eq 12000
          test "$(wc -c < basira_rc9_overlay/part04.b64)" -eq 12000
          test "$(wc -c < basira_rc9_overlay/part05.b64)" -eq 4328
          cat \
            basira_rc9_overlay/part00.b64 \
            basira_rc9_overlay/part01.b64 \
            basira_rc9_overlay/part02.b64 \
            basira_rc9_overlay/part03.b64 \
            basira_rc9_overlay/part04.b64 \
            basira_rc9_overlay/part05.b64 \
            | tr -d '\n\r' | base64 --decode > /tmp/basira-rc9-overlay.tar.gz
          echo "8ee9c710704ecdca2f82629c26a5cd6798762770fcd83790931882d4e4f3d6e1  /tmp/basira-rc9-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/basira-rc9-overlay.tar.gz -C basira-rc9
          grep -F 'versionCode = 10008' basira-rc9/app/build.gradle.kts
          grep -F 'versionName = "1.0.0-rc9"' basira-rc9/app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".debug"' basira-rc9/app/build.gradle.kts
          test -f basira-rc9/ci/basira-ci-debug.keystore
          test -f basira-rc9/app/src/main/java/org/healthrenewal/basira/data/PortableBackupCodec.kt
          test -f basira-rc9/app/src/main/java/org/healthrenewal/basira/ar/VisionPerformancePolicy.kt

      - name: Core smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd basira-rc9
          bash tools/run-core-smoke.sh

      - name: Android unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc9 :app:testDebugUnitTest --stacktrace 2>&1 | tee basira-rc9/unit-test.log

      - name: Summarize unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tests = failures = errors = skipped = suites = 0
          for p in Path('basira-rc9/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(p).getroot()
              suites += 1
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          summary = f"suites={suites} tests={tests} failures={failures} errors={errors} skipped={skipped}"
          print(summary)
          Path('basira-rc9/unit-test-summary.txt').write_text(summary + '\n')
          if suites == 0 or failures or errors:
              raise SystemExit(1)
          PY

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc9 :app:lintDebug :app:lintRelease --stacktrace 2>&1 | tee basira-rc9/lint.log

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc9 :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee basira-rc9/build.log

      - name: Verify APKs and stable test signature
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find basira-rc9/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          RELEASE_APK="$(find basira-rc9/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK" | tee basira-rc9/debug-signature.txt
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' basira-rc9/debug-signature.txt | head -n1)"
          test "$SIGNER" = "dbea0b677be58fcee5413736ade1d766da9197420ba42bf90870e989ade950b6"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RELEASE_APK" >/dev/null 2>&1; then
            echo "Release APK unexpectedly signed" >&2
            exit 1
          else
            echo "Release APK remains unsigned as intended" | tee basira-rc9/release-signing-status.txt
          fi
          sha256sum "$DEBUG_APK" | tee basira-rc9/debug-apk.sha256
          sha256sum "$RELEASE_APK" | tee basira-rc9/release-apk.sha256

      - name: Package exact RC9 source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/basira-rc9-source
          cp -a basira-rc9 /tmp/basira-rc9-source
          rm -rf /tmp/basira-rc9-source/.gradle /tmp/basira-rc9-source/app/build
          (cd /tmp/basira-rc9-source && zip -qr "$GITHUB_WORKSPACE/Basira-v1.0.0-rc9-source.zip" .)
          sha256sum Basira-v1.0.0-rc9-source.zip > Basira-v1.0.0-rc9-source.zip.sha256

      - name: Upload Basira RC9 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basira-rc9-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            basira-rc9/app/build/outputs/apk/**/*.apk
            basira-rc9/app/build/reports/**
            basira-rc9/app/build/test-results/**
            basira-rc9/unit-test.log
            basira-rc9/unit-test-summary.txt
            basira-rc9/lint.log
            basira-rc9/build.log
            basira-rc9/debug-signature.txt
            basira-rc9/debug-apk.sha256
            basira-rc9/release-apk.sha256
            basira-rc9/release-signing-status.txt
            Basira-v1.0.0-rc9-source.zip
            Basira-v1.0.0-rc9-source.zip.sha256
