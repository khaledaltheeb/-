name: Legacy Content Migration Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/legacy_content_extract.py'
      - 'scripts/legacy_destination_coverage.py'
      - 'scripts/apply_legacy_content_adoptions.py'
      - 'scripts/quick_info_legacy_audit.py'
      - 'scripts/merge_legacy_inventories.py'
      - 'scripts/library_migration_audit.py'
      - 'scripts/library_legacy_map_validate.py'
      - 'scripts/library_editorial_batch_validate.py'
      - 'data/migration-batches/legacy-content-adoptions-v1.json'
      - 'data/migration-batches/library-legacy-canonical-map-v1.json'
      - 'data/migration-batches/library-research-foundations-v1.json'
      - 'docs/LIBRARY-MIGRATION-PLAN.md'
      - '.github/workflows/legacy-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Rawafid V3
        uses: actions/checkout@v7
        with:
          path: rawafid-v3

      - name: Checkout legacy source read-only
        uses: actions/checkout@v7
        with:
          repository: khaledaltheeb/healthrenewal.org
          ref: main
          path: legacy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Materialize generated legacy library in an ephemeral build
        run: |
          cp -a legacy legacy-library-source
          cp -a legacy legacy-library-build
          python legacy-library-source/scripts/publish_evidence_literacy_library_v322.py legacy-library-build

      - name: Extract published legacy content contract
        working-directory: rawafid-v3
        run: python scripts/legacy_content_extract.py ../legacy-library-build

      - name: Reconcile complete legacy quick-info inventory
        working-directory: rawafid-v3
        run: python scripts/quick_info_legacy_audit.py ../legacy --expected 395

      - name: Build complete legacy inventory
        working-directory: rawafid-v3
        run: >-
          python scripts/merge_legacy_inventories.py
          artifacts/legacy-content-inventory.json
          artifacts/quick-info-legacy-inventory.json
          --output artifacts/legacy-content-inventory-complete.json

      - name: Audit legacy library migration scope
        working-directory: rawafid-v3
        run: >-
          python scripts/library_migration_audit.py
          artifacts/legacy-content-inventory.json
          --quality-min-words 1500

      - name: Validate foundational library canonical map
        working-directory: rawafid-v3
        run: >-
          python scripts/library_legacy_map_validate.py
          artifacts/legacy-content-inventory.json
          data/migration-batches/library-legacy-canonical-map-v1.json

      - name: Validate first library editorial recovery batch
        working-directory: rawafid-v3
        run: >-
          python scripts/library_editorial_batch_validate.py
          data/migration-batches/library-legacy-canonical-map-v1.json
          data/migration-batches/library-research-foundations-v1.json

      - name: Compare complete legacy routes with Rawafid V3
        working-directory: rawafid-v3
        env:
          RAWAFID_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
          RAWAFID_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
        run: >-
          python scripts/legacy_destination_coverage.py
          artifacts/legacy-content-inventory-complete.json

      - name: Apply verified content adoptions
        working-directory: rawafid-v3
        env:
          RAWAFID_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
          RAWAFID_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
        run: >-
          python scripts/apply_legacy_content_adoptions.py
          artifacts/legacy-destination-coverage.json
          data/migration-batches/legacy-content-adoptions-v1.json

      - name: Upload migration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-content-migration-inventory
          path: |
            rawafid-v3/artifacts/legacy-content-summary.json
            rawafid-v3/artifacts/legacy-content-inventory.json
            rawafid-v3/artifacts/quick-info-legacy-inventory.json
            rawafid-v3/artifacts/legacy-content-inventory-complete.json
            rawafid-v3/artifacts/legacy-destination-coverage.json
            rawafid-v3/artifacts/library-migration-plan.json
            rawafid-v3/artifacts/library-migration-report.md
            rawafid-v3/artifacts/library-legacy-canonical-map-validation.json
            rawafid-v3/artifacts/library-legacy-canonical-map-validation.md
          if-no-files-found: error
          retention-days: 14
