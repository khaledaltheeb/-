name: SEO Gate Full Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
      SEO_GATE_PAGE_CONCURRENCY: '8'
      SEO_GATE_LINK_CONCURRENCY: '4'
      SEO_GATE_VERIFICATION_CONCURRENCY: '1'
      SEO_GATE_VERIFICATION_DELAY_MS: '1000'
      SEO_GATE_LINK_ATTEMPTS: '3'
      SEO_GATE_LINK_RETRY_DELAY_MS: '150'
      SEO_RICH_CONCURRENCY: '4'
      SEO_SHARED_HTML_CACHE_DIR: /tmp/rawafid-seo-html-cache
      SEO_GATE_TIMEOUT_MS: '20000'
      SEO_GATE_PAGE_ATTEMPTS: '3'
      SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
      SEO_RICH_MIN_WORDS: '100'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production candidate
        run: npm run build
      - name: Start production candidate
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-seo-integration-server.log 2>&1 &
          echo $! > /tmp/rawafid-seo-integration-server.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Full sitemap SEO crawl
        run: node scripts/seo-gate.mjs
      - name: Rich discovery audit
        continue-on-error: true
        run: node scripts/rich-discovery-gate.mjs
      - name: Content richness audit
        run: node scripts/content-richness-gate.mjs
      - name: Stop candidate
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rawafid-seo-integration-server.pid ]; then kill "$(cat /tmp/rawafid-seo-integration-server.pid)" 2>/dev/null || true; fi
