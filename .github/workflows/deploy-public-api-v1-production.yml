name: Deploy Public API V1 Production

on:
  push:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.xml/**'
      - 'app/feed.json/**'
      - 'app/magazine/feed.xml/**'
      - 'app/developers/**'
      - 'app/layout.tsx'
      - 'app/sitemaps/static.xml/route.ts'
      - 'components/site-footer.tsx'
      - 'components/trust-page.tsx'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/feed-http.ts'
      - 'lib/research-integrations/**'
      - 'scripts/public-api-v1-contract.mjs'
      - 'scripts/source-registry-v1-contract.mjs'
      - 'scripts/research-integrations-contract.mjs'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'supabase/migrations/20260901212203_source_connection_metadata_v1.sql'
      - 'supabase/migrations/20260901215918_source_governance_provenance_v1.sql'
      - 'supabase/migrations/20260901221854_source_governance_provenance_indexes_v1.sql'
      - 'supabase/migrations/20260901223500_datacite_content_relations_v1.sql'
      - '.github/workflows/deploy-public-api-v1-production.yml'

concurrency:
  group: rawafid-public-api-v1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
      - name: Verify API architecture contracts
        run: |
          node scripts/public-api-v1-contract.mjs
          node scripts/source-registry-v1-contract.mjs
          node scripts/research-integrations-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Build Cloudflare production Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy Cloudflare production Worker
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify live Public API and feeds repeatedly
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_SHA}"
          for attempt in $(seq 1 12); do
            if curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/?deploy=${stamp}" -o /tmp/home.html \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/v1?deploy=${stamp}" -o /tmp/api-v1.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/openapi.json?deploy=${stamp}" -o /tmp/openapi.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/v1/content?limit=2&deploy=${stamp}" -D /tmp/content.headers -o /tmp/content.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/v1/pages?limit=2&deploy=${stamp}" -o /tmp/pages.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/v1/stats?deploy=${stamp}" -o /tmp/stats.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/api/v1/changes?since=2026-01-01T00%3A00%3A00Z&limit=2&deploy=${stamp}" -o /tmp/changes.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/feed.xml?deploy=${stamp}" -D /tmp/rss.headers -o /tmp/feed.xml \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/feed.json?deploy=${stamp}" -D /tmp/json-feed.headers -o /tmp/feed.json \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/magazine/feed.xml?deploy=${stamp}" -D /tmp/magazine-rss.headers -o /tmp/magazine-feed.xml \
              && curl -fsS --retry 2 --retry-delay 2 --retry-all-errors "${base}/developers?deploy=${stamp}" -o /tmp/developers.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done
          invalid_code="$(curl -sS -o /tmp/invalid-key.json -w '%{http_code}' -H 'X-API-Key: definitely-invalid' "${base}/api/v1/content?limit=1&deploy=${stamp}")"
          test "$invalid_code" = 401
          node - <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync('/tmp/home.html','utf8');
          const discovery=JSON.parse(fs.readFileSync('/tmp/api-v1.json','utf8'));
          const openapi=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          const content=JSON.parse(fs.readFileSync('/tmp/content.json','utf8'));
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const stats=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          const changes=JSON.parse(fs.readFileSync('/tmp/changes.json','utf8'));
          const invalid=JSON.parse(fs.readFileSync('/tmp/invalid-key.json','utf8'));
          const jsonFeed=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          const rss=fs.readFileSync('/tmp/feed.xml','utf8');
          const magazine=fs.readFileSync('/tmp/magazine-feed.xml','utf8');
          const docs=fs.readFileSync('/tmp/developers.html','utf8');
          const contentHeaders=fs.readFileSync('/tmp/content.headers','utf8').toLowerCase();
          const rssHeaders=fs.readFileSync('/tmp/rss.headers','utf8').toLowerCase();
          const jsonFeedHeaders=fs.readFileSync('/tmp/json-feed.headers','utf8').toLowerCase();
          if(!home.includes('href="/developers"') || !home.includes('واجهة المطورين وAPI')) throw new Error('Developer API footer link is missing from live home page');
          if(discovery.version!=='1.2.0' || discovery.status!=='stable') throw new Error('Public API discovery is invalid');
          for (const provider of ['europe_pmc','crossref','datacite','lens']) if(!discovery.evidence_discovery?.providers?.includes(provider)) throw new Error(`${provider} provider is missing`);
          if(openapi.openapi!=='3.1.0' || openapi.info?.version!=='1.2.0') throw new Error('OpenAPI contract is invalid');
          if(!openapi.components?.securitySchemes?.PartnerApiKey || !openapi.paths?.['/sources/{id}']) throw new Error('Partner/source contract is missing');
          const evidenceParams=openapi.paths?.['/evidence-discovery']?.get?.parameters||[];
          if(!evidenceParams.some((p)=>p.name==='datacite_cursor')) throw new Error('DataCite OpenAPI cursor is missing');
          if(!Array.isArray(content.data) || !Array.isArray(pages.data)) throw new Error('Public content/pages endpoint is invalid');
          if(!stats.data || typeof stats.data.total!=='number') throw new Error('Stats endpoint is invalid');
          if(!Array.isArray(changes.data)) throw new Error('Delta endpoint is invalid');
          if(invalid.error?.code!=='invalid_api_key') throw new Error('Invalid-key behavior is incorrect');
          if(jsonFeed.version!=='https://jsonfeed.org/version/1.1') throw new Error('JSON Feed is invalid');
          if(!rss.includes('<rss version="2.0"') || !rss.includes('atom:link')) throw new Error('RSS is invalid');
          if(!magazine.includes('<rss version="2.0"') || !magazine.includes('atom:link')) throw new Error('Magazine RSS is invalid');
          if(!docs.includes('v1.2') || !docs.includes('Crossref') || !docs.includes('DataCite') || !docs.includes('Partner')) throw new Error('Developer portal is invalid');
          if(!contentHeaders.includes('etag:') || !contentHeaders.includes('x-request-id:')) throw new Error('HTTP API validators are missing');
          if(!rssHeaders.includes('etag:') || !rssHeaders.includes('last-modified:')) throw new Error('RSS validators are missing');
          if(!jsonFeedHeaders.includes('etag:')) throw new Error('JSON Feed validator is missing');
          NODE
      - name: Verify live conditional GET
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_SHA}"
          verify_304() {
            local label="$1"; local url="$2"; local headers="/tmp/${label}.headers"; local body="/tmp/${label}.body"; local etag=''; local code=''
            for attempt in $(seq 1 6); do
              curl -fsS --retry 2 --retry-delay 1 --retry-all-errors -H 'Cache-Control: no-cache' "$url" -D "$headers" -o "$body"
              etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub(/\r/,""); sub(/^etag:[[:space:]]*/,""); print; exit}' "$headers")"
              if [ -z "$etag" ]; then sleep 2; continue; fi
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' -H "If-None-Match: $etag" "$url")"
              if [ "$code" = 304 ]; then return 0; fi
              sleep 2
            done
            echo "${label}: conditional GET never produced 304; last status=${code}, etag=${etag}" >&2
            return 1
          }
          verify_304 openapi "${base}/api/openapi.json?conditional=${stamp}"
          verify_304 content "${base}/api/v1/content?limit=2&conditional=${stamp}"
          verify_304 rss "${base}/feed.xml?conditional=${stamp}"
          verify_304 jsonfeed "${base}/feed.json?conditional=${stamp}"
