name: Deploy Public API V1 Production

on:
  push:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.json/**'
      - 'app/feed.xml/**'
      - 'app/magazine/feed.xml/**'
      - 'app/developers/**'
      - 'app/layout.tsx'
      - 'app/sitemaps/static.xml/route.ts'
      - 'components/trust-page.tsx'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/research-integrations/**'
      - 'scripts/public-api-v1-contract.mjs'
      - 'scripts/public-api-v1-http-contract.mjs'
      - 'scripts/public-api-feed-contract.mjs'
      - 'scripts/research-integrations-contract.mjs'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'supabase/migrations/20260901203000_public_api_change_log_semantics_v2.sql'
      - 'supabase/migrations/20260901204500_partner_api_admin_acl_hardening_v2.sql'
      - '.github/workflows/deploy-public-api-v1-production.yml'

concurrency:
  group: rawafid-public-api-v1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      PUBLIC_API_TEST_BASE_URL: https://healthrenewal.org
    steps:
      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
      - name: Verify API architecture contract
        run: node scripts/public-api-v1-contract.mjs
      - name: Verify research integration contract
        run: node scripts/research-integrations-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Build Cloudflare production Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy Cloudflare production Worker
        run: npx opennextjs-cloudflare deploy --env production
      - name: Wait for production edge convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            version="$(curl -fsS --retry 2 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' "https://healthrenewal.org/api/v1?deploy=${GITHUB_SHA}" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
            if [ "$version" = '1.2.0' ]; then exit 0; fi
            echo "edge convergence attempt ${attempt}: version=${version:-missing}"
            sleep 5
          done
          echo 'Production edge did not converge to API v1.2.0 in time.' >&2
          exit 1
      - name: Full live HTTP, privacy, synchronization and evidence contract
        run: node scripts/public-api-v1-http-contract.mjs
      - name: Full live feed observability contract
        run: node scripts/public-api-feed-contract.mjs
