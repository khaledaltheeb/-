name: Deploy Google Site Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-google-site-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1910e1ad3c793fd568ba1caafe34f964'
    steps:
      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Write isolated verification Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > google-site-verification-worker.mjs <<'EOF'
          export default {
            async fetch() {
              return new Response('google-site-verification: google644f1f7a8b7aaa2b.html\n', {
                status: 200,
                headers: {
                  'content-type': 'text/html; charset=utf-8',
                  'cache-control': 'public, max-age=300'
                }
              });
            }
          };
          EOF
          cat > wrangler.google-verification.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "rawafid-google-site-verification",
            "account_id": "1910e1ad3c793fd568ba1caafe34f964",
            "main": "google-site-verification-worker.mjs",
            "compatibility_date": "2026-08-27",
            "workers_dev": false,
            "preview_urls": false,
            "routes": [
              {
                "pattern": "healthrenewal.org/google644f1f7a8b7aaa2b.html",
                "zone_name": "healthrenewal.org"
              }
            ]
          }
          EOF

      - name: Deploy isolated verification route
        shell: bash
        run: npx --yes wrangler@4.115.0 deploy --config wrangler.google-verification.jsonc

      - name: Verify public Google file exactly
        shell: bash
        run: |
          set -euo pipefail
          expected='google-site-verification: google644f1f7a8b7aaa2b.html'
          for attempt in $(seq 1 12); do
            actual="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://healthrenewal.org/google644f1f7a8b7aaa2b.html?verify=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              printf '%s\n' "$actual"
              exit 0
            fi
            sleep 5
          done
          echo 'Google verification file did not return the expected content.' >&2
          exit 1
