name: Cognitive Lab Sitemap Parity

on:
  push:
    branches: [agent/production-domain-smoke]
    paths:
      - '.github/workflows/cognitive-lab-sitemap-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare legacy production sitemap routes with staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urljoin, urlparse

          old_origin='https://healthrenewal.org'
          new_index='https://rawafid-platform-staging.khaledaltheeb.workers.dev/cognitive-lab'
          aliases={
              'associative-context-binding':'associative-binding',
              'prospective-memory-cues':'prospective-memory',
          }

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Rawafid-Parity-Audit/1.2','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.read().decode('utf-8','replace'),r.geturl()

          status,new_html,_=fetch(new_index)
          assert status==200
          new_slugs=set()
          for href in re.findall(r'href=["\']([^"\']+)["\']',new_html,re.I):
              p=urlparse(urljoin(new_index,html.unescape(href))).path.rstrip('/')
              m=re.fullmatch(r'/cognitive-lab/([^/]+)',p)
              if m:new_slugs.add(m.group(1))

          starts=[]
          _,robots,_=fetch(old_origin+'/robots.txt')
          starts += re.findall(r'(?im)^\s*Sitemap:\s*(\S+)\s*$',robots)
          starts += [old_origin+'/sitemap.xml',old_origin+'/sitemap-index.xml']
          seen=set(); queue=list(dict.fromkeys(starts)); legacy_urls=set()
          while queue and len(seen)<200:
              url=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try: status,body,_=fetch(url)
              except Exception: continue
              if status!=200 or '<' not in body: continue
              try: root=ET.fromstring(body)
              except ET.ParseError: continue
              tag=root.tag.rsplit('}',1)[-1]
              if tag=='sitemapindex':
                  for loc in root.findall('.//{*}sitemap/{*}loc'):
                      if loc.text: queue.append(loc.text.strip())
              elif tag=='urlset':
                  for loc in root.findall('.//{*}url/{*}loc'):
                      if loc.text: legacy_urls.add(loc.text.strip())

          old_slugs=set()
          for u in legacy_urls:
              p=urlparse(u).path.rstrip('/')
              m=re.fullmatch(r'/cognitive-lab/([^/]+)',p)
              if m: old_slugs.add(m.group(1))

          mapped={slug:aliases.get(slug,slug) for slug in old_slugs}
          missing=sorted(slug for slug,target in mapped.items() if target not in new_slugs)
          common=sorted(slug for slug,target in mapped.items() if target in new_slugs)
          print(f'SITEMAPS_SCANNED={len(seen)}')
          print(f'LEGACY_COGNITIVE_ROUTES={len(old_slugs)}')
          print(f'STAGING_COGNITIVE_ROUTES={len(new_slugs)}')
          print(f'LEGACY_ROUTES_COVERED={len(common)}')
          print('RENAMED_ROUTE_MAP=' + repr(aliases))
          print('MISSING_AFTER_MAPPING=' + ','.join(missing))

          failures=[]
          for old_slug,target in sorted(mapped.items()):
              try:
                  status,body,effective=fetch(new_index+'/'+target)
                  if status!=200 or 'تعليمي غير تشخيصي' not in body:
                      failures.append((old_slug,target,status,effective))
              except Exception as exc:
                  failures.append((old_slug,target,type(exc).__name__))
          print('LEGACY_ROUTES_FAILING_AFTER_MAPPING=' + repr(failures))
          assert len(old_slugs)==53, len(old_slugs)
          assert len(new_slugs)==53, len(new_slugs)
          assert not missing, missing
          assert not failures, failures
          print('COGNITIVE_LAB_SITEMAP_PARITY=PASS')
          PY
