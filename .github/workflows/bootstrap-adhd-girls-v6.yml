name: Bootstrap ADHD Girls V6

on:
  push:
    branches:
      - agent/special-needs-batch-001-adhd-girls
    paths:
      - '.github/workflows/bootstrap-adhd-girls-v6.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-adhd-girls-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIVE_BLOB_SHA: c4c4d0e807c1226dc5042b8591fbb03b4338fda7
      ARCHIVE_SHA256: 7f8f3b00a8f5a1d90610a76dd89e400dcb1bf0754e03d3e6117095cd9508c059
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reconstruct verified page bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          blob_sha = os.environ['ARCHIVE_BLOB_SHA']
          expected_archive_sha = os.environ['ARCHIVE_SHA256']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{blob_sha}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Rawafid-ADHD-Girls-Bootstrap/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get('sha') != blob_sha or payload.get('encoding') != 'base64':
              raise RuntimeError('Unexpected Git blob response')
          blob_content = base64.b64decode(payload['content'])
          git_object = b'blob ' + str(len(blob_content)).encode() + b'\0' + blob_content
          actual_blob_sha = hashlib.sha1(git_object).hexdigest()
          if actual_blob_sha != blob_sha:
              raise RuntimeError(f'Git blob digest mismatch: {actual_blob_sha}')
          archive = base64.b64decode(blob_content, validate=True)
          actual_archive_sha = hashlib.sha256(archive).hexdigest()
          if actual_archive_sha != expected_archive_sha:
              raise RuntimeError(
                  f'Archive SHA-256 mismatch: expected {expected_archive_sha}, got {actual_archive_sha}'
              )
          archive_path = pathlib.Path('/tmp/adhd-girls-batch-files.tar.xz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, mode='r:xz') as package:
              package.extractall(path='.', filter='data')
          print(json.dumps({
              'blob_sha': actual_blob_sha,
              'archive_sha256': actual_archive_sha,
              'archive_bytes': len(archive),
          }, ensure_ascii=False))
          PY
      - name: Run V6 and synchronize generated quality snapshots
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/materialize_search_demand_page.py scripts/validate_search_demand_batch.py
          rm -rf artifacts/special-needs-v6-first
          python scripts/validate_search_demand_batch.py \
            data/search-demand-batches/special-needs-batch-001 \
            --output-dir artifacts/special-needs-v6-first
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          batch = Path('data/search-demand-batches/special-needs-batch-001')
          pages_dir = batch / 'pages'
          output = Path('artifacts/special-needs-v6-first')
          progress_pages = []
          for meta_path in sorted(pages_dir.glob('*.meta.json')):
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              slug = str(meta['slug'])
              materialized_path = output / f'{slug}.json'
              if not materialized_path.is_file():
                  raise RuntimeError(f'Missing materialized record for {slug}')
              record = json.loads(materialized_path.read_text(encoding='utf-8'))
              meta['quality_snapshot'] = record['quality_snapshot']
              meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              progress_pages.append({
                  'slug': slug,
                  'canonical_url': meta['canonical_url'],
                  'title': meta['title'],
                  'status': meta['status'],
                  'canonical_audit': (meta.get('schema_json') or {}).get('canonical_audit', {}).get('decision'),
                  'v6_contract': 'passed',
                  'quality': record['quality_snapshot'],
                  'remaining_human_gates': [
                      'scientific-review',
                      'editorial-review',
                      'seo-review',
                      'accessibility-review',
                      'final-canonical-review-after-parent-prs-merge',
                  ],
              })
          progress = {
              'version': 2,
              'batch_id': 'special-needs-inclusive-demand-001',
              'updated_at': '2026-08-10',
              'state': 'draft-validation-passed',
              'records': len(progress_pages),
              'release_ready_under_v6': len(progress_pages),
              'published_to_supabase': 0,
              'published_to_cloudflare_production': 0,
              'pages': progress_pages,
              'safety': {
                  'supabase_content_dml_allowed': False,
                  'cloudflare_production_publish_allowed': False,
                  'human_review_required': True,
                  'stacked_after_pr_185': True,
              },
          }
          (batch / 'progress.v2.json').write_text(
              json.dumps(progress, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          rm -rf artifacts/special-needs-v6-final
          python scripts/validate_search_demand_batch.py \
            data/search-demand-batches/special-needs-batch-001 \
            --output-dir artifacts/special-needs-v6-final
      - name: Commit only validated editorial data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/special-needs-v6-first artifacts/special-needs-v6-final scripts/__pycache__
          git checkout -- .github/workflows/special-needs-search-demand-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/search-demand-batches/special-needs-batch-001/content/adhd-girls-late-diagnosis.md \
            data/search-demand-batches/special-needs-batch-001/research/adhd-girls-late-diagnosis.sources.json \
            data/search-demand-batches/special-needs-batch-001/pages/adhd-girls-late-diagnosis.meta.json \
            data/search-demand-batches/special-needs-batch-001/progress.v2.json
          git diff --cached --check
          git commit -m 'Add V6 ADHD girls late-diagnosis guide'
          git push origin "HEAD:${GITHUB_REF_NAME}"
