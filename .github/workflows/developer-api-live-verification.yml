name: Verify Developer API Live

on:
  workflow_run:
    workflows: ["Deploy Production Fast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-api-live-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify developer portal and Public API on production
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          verify_page() {
            local url="$1"
            local out="$2"
            local needle="$3"
            local canonical="$4"
            local headers="${out}.headers"
            local status

            status="$(curl -sS -L -D "$headers" \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 \
              -o "$out" -w '%{http_code}' "${url}?verify=${TARGET_SHA}")"
            echo "LIVE_HTTP ${url} ${status}"

            if ! [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Page HTTP failure: url=${url} status=${status}" >&2
              head -c 1800 "$out" 2>/dev/null || true
              exit 1
            fi

            test -s "$out"
            grep -Fq "$needle" "$out"
            grep -Fq "$canonical" "$out"

            # Human documentation must be indexable. Check the actual robots
            # metadata/header only; the page legitimately documents that JSON
            # API responses themselves use X-Robots-Tag: noindex, nofollow.
            if grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex|<meta[^>]+content="[^"]*noindex[^>]+name="robots"' "$out"; then
              echo "Human documentation has a robots noindex directive: ${url}" >&2
              exit 1
            fi
            if grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
              echo "Human documentation has X-Robots-Tag noindex: ${url}" >&2
              exit 1
            fi

            if grep -qiE 'internal server error|application error|500 internal' "$out"; then
              echo "Application error body detected: ${url}" >&2
              exit 1
            fi
          }

          fetch_json() {
            local url="$1"
            local out="$2"
            local status
            status="$(curl -sS -L \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              --retry 8 --retry-delay 2 --retry-all-errors --max-time 60 \
              -o "$out" -w '%{http_code}' "$url")"
            echo "LIVE_HTTP ${url} ${status}"
            if ! [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "API HTTP failure: url=${url} status=${status}" >&2
              cat "$out" 2>/dev/null || true
              exit 1
            fi
            jq -e . "$out" >/dev/null
          }

          echo "VERIFY_DEPLOYED_SHA ${TARGET_SHA}"

          verify_page \
            'https://healthrenewal.org/developers' \
            '/tmp/developers-ar.html' \
            'منصة روافد للمطورين' \
            'https://healthrenewal.org/developers'
          grep -Fq 'Rawafid Public &amp; Partner API v1.2.0' /tmp/developers-ar.html
          grep -Fq '/api/openapi.json' /tmp/developers-ar.html
          grep -Fq 'next_cursor' /tmp/developers-ar.html

          verify_page \
            'https://healthrenewal.org/en/developers' \
            '/tmp/developers-en.html' \
            'Rawafid Developer Platform' \
            'https://healthrenewal.org/en/developers'
          grep -Fq '120 requests/minute' /tmp/developers-en.html

          fetch_json 'https://healthrenewal.org/api/v1' '/tmp/api-root.json'
          jq -e '.version == "1.2.0" and .status == "stable" and .openapi and (.resources | index("search"))' /tmp/api-root.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/openapi.json' '/tmp/openapi.json'
          jq -e '.openapi == "3.1.0" and .info.version == "1.2.0" and .paths["/search"] and .paths["/changes"] and .components.schemas.PublicContent and .components.schemas.ChangeStreamResponse' /tmp/openapi.json >/dev/null
          jq -e '.paths["/changes"].get.parameters | any(.name == "cursor")' /tmp/openapi.json >/dev/null
          jq -e '.paths["/{resource}"].get.responses["200"].content["application/json"].schema.oneOf | length == 2' /tmp/openapi.json >/dev/null
          jq -e '.components.schemas.TaxonomyListResponse and .components.schemas.ContentBody and .components.responses.NotModified' /tmp/openapi.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/content?limit=1' '/tmp/content.json'
          jq -e '.data | type == "array"' /tmp/content.json >/dev/null
          jq -e '.pagination | has("next_cursor")' /tmp/content.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/search?q=autism&limit=2' '/tmp/search.json'
          jq -e '.data | type == "array"' /tmp/search.json >/dev/null
          jq -e '.meta.search_mode == "ranked_public_content"' /tmp/search.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/changes?since=2026-09-01T00:00:00Z&limit=2' '/tmp/changes.json'
          jq -e '.data | type == "array"' /tmp/changes.json >/dev/null
          jq -e '.pagination.cursor_recommended == true and (.pagination | has("next_cursor"))' /tmp/changes.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/sources?limit=1' '/tmp/sources.json'
          jq -e '.data | type == "array"' /tmp/sources.json >/dev/null
          jq -e '.pagination | has("next_offset")' /tmp/sources.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/sectors?limit=1&offset=0' '/tmp/sectors.json'
          jq -e '.data | type == "array"' /tmp/sectors.json >/dev/null
          jq -e '.pagination.offset == 0 and (.pagination | has("next_offset")) and (.pagination | has("has_more"))' /tmp/sectors.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/articles?limit=1' '/tmp/articles.json'
          jq -e '.data | type == "array"' /tmp/articles.json >/dev/null
          jq -e '.pagination | has("next_cursor")' /tmp/articles.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/stats' '/tmp/stats.json'
          jq -e '.meta.api_version == "1.2.0"' /tmp/stats.json >/dev/null

          fetch_json 'https://healthrenewal.org/api/v1/lens' '/tmp/lens.json'
          jq -e '.mode == "explicit_opt_in" and .attribution.label == "Data Sourced from The Lens" and .security.exposed_to_client == false' /tmp/lens.json >/dev/null

          # Browser CORS preflight must reach the API route without auth/session middleware side effects.
          options_status="$(curl -sS -o /tmp/options.body -D /tmp/options.headers -X OPTIONS \
            -H 'Origin: https://example.org' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: Authorization,X-API-Key' \
            -w '%{http_code}' \
            'https://healthrenewal.org/api/v1/content')"
          echo "LIVE_OPTIONS /api/v1/content ${options_status}"
          test "$options_status" = '204'
          grep -Eqi '^access-control-allow-origin: \*' /tmp/options.headers
          grep -Eqi '^access-control-allow-methods:.*GET.*HEAD.*OPTIONS' /tmp/options.headers
          grep -Eqi '^access-control-allow-headers:.*Authorization.*X-API-Key' /tmp/options.headers

          # ETag must produce a valid 304 conditional response.
          curl -sS -D /tmp/etag.headers -o /tmp/etag.body 'https://healthrenewal.org/api/v1/content?limit=1'
          etag="$(awk -F': ' 'tolower($1)=="etag" {gsub("\\r", "", $2); print $2}' /tmp/etag.headers | tail -n 1)"
          test -n "$etag"
          conditional_status="$(curl -sS -o /tmp/conditional.body -w '%{http_code}' -H "If-None-Match: ${etag}" 'https://healthrenewal.org/api/v1/content?limit=1')"
          echo "LIVE_CONDITIONAL /api/v1/content ${conditional_status}"
          test "$conditional_status" = '304'

          echo 'LIVE_OK developer portal, OpenAPI, public content, ranked search, lossless changes, taxonomy pagination, sources, stats, Lens, CORS and conditional caching verified'
