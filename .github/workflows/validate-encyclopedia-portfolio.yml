name: Validate Encyclopedia Draft Portfolio

on:
  push:
    branches:
      - 'agent/encyclopedia-disability-inclusion-foundation'
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/generated/review-drafts/**'
      - 'scripts/validate_encyclopedia_draft_portfolio.py'
      - '.github/workflows/validate-encyclopedia-portfolio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/generated/review-drafts/**'
      - 'scripts/validate_encyclopedia_draft_portfolio.py'
      - '.github/workflows/validate-encyclopedia-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portfolio-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile portfolio quality gate
        run: python -m py_compile scripts/validate_encyclopedia_draft_portfolio.py

      - name: Validate uniqueness evidence diversity and source parity
        run: |
          python scripts/validate_encyclopedia_draft_portfolio.py \
            --drafts-dir data/encyclopedia/drafts \
            --generated-dir data/encyclopedia/generated/review-drafts \
            --manifest data/encyclopedia/generated/review-drafts-index-v1.json

      - name: Commit deterministic portfolio manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/encyclopedia/generated/review-drafts-index-v1.json
          if git diff --cached --quiet; then
            echo "Portfolio manifest already current."
            exit 0
          fi
          git commit -m "Update encyclopedia review portfolio manifest"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
