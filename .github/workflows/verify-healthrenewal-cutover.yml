name: Verify healthrenewal.org Cutover

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-healthrenewal-cutover.yml
      - .deployment/healthrenewal-cloudflare-cutover.txt
      - scripts/seo-cutover-url-readiness.mjs

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOMAIN: healthrenewal.org
      EXPECTED_NS_1: aisha.ns.cloudflare.com
      EXPECTED_NS_2: kyle.ns.cloudflare.com
      EXPECTED_WORKER: rawafid-platform-production
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Ensure DNS tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y dnsutils
          fi
          command -v jq >/dev/null 2>&1

      - name: Verify authoritative delegation and DNSSEC resolution
        shell: bash
        run: |
          set -euo pipefail
          actual_ns="$(dig +short NS "${DOMAIN}" @1.1.1.1 | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' | sort)"
          expected_ns="$(printf '%s\n%s\n' "${EXPECTED_NS_1}" "${EXPECTED_NS_2}" | sort)"
          printf 'Authoritative NS:\n%s\n' "${actual_ns}"
          test "${actual_ns}" = "${expected_ns}"

          dns_answer="$(dig +dnssec A "${DOMAIN}" @1.1.1.1)"
          printf '%s\n' "${dns_answer}" | grep -q 'status: NOERROR'
          if printf '%s\n' "${dns_answer}" | grep -q 'status: SERVFAIL'; then
            echo 'DNSSEC validation is blocking resolution.' >&2
            exit 1
          fi
          printf 'DS records (empty is valid when DNSSEC is disabled):\n'
          dig +short DS "${DOMAIN}" @1.1.1.1 || true

      - name: Verify Cloudflare Worker custom-domain mapping
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          response="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")"
          printf '%s' "${response}" | jq -e '.success == true' >/dev/null
          printf '%s' "${response}" | jq -e \
            --arg host "${DOMAIN}" \
            --arg service "${EXPECTED_WORKER}" \
            '.result[] | select(.hostname == $host and .service == $service)' >/dev/null

      - name: Verify repository production contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "rawafid-platform-production"' wrangler.jsonc
          grep -q '"pattern": "healthrenewal.org"' wrangler.jsonc
          grep -q '"custom_domain": true' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_SITE_URL": "https://healthrenewal.org"' wrangler.jsonc
          grep -q 'authoritative source repository: khaledaltheeb/-' .deployment/healthrenewal-cloudflare-cutover.txt
          grep -q 'legacy repository CNAME detached: yes' .deployment/healthrenewal-cloudflare-cutover.txt

      - name: Verify live HTTPS, Cloudflare edge, canonical, robots and sitemap
        shell: bash
        run: |
          set -euo pipefail
          base="https://${DOMAIN}"

          trace="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "${base}/cdn-cgi/trace")"
          printf '%s\n' "${trace}" | grep -q "^h=${DOMAIN}$"
          printf '%s\n' "${trace}" | grep -q '^visit_scheme=https$'

          home="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "${base}/?cutover=${GITHUB_SHA}")"
          printf '%s' "${home}" | grep -q 'rel="canonical" href="https://healthrenewal.org/"'
          printf '%s' "${home}" | grep -q 'منصة روافد'
          if printf '%s' "${home}" | grep -Eqi 'dns-parking|hostinger website builder'; then
            echo 'Legacy Hostinger markers are still present on the production homepage.' >&2
            exit 1
          fi

          robots="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "${base}/robots.txt?cutover=${GITHUB_SHA}")"
          printf '%s' "${robots}" | grep -q "Sitemap: ${base}/sitemap.xml"

          sitemap="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "${base}/sitemap.xml?cutover=${GITHUB_SHA}")"
          printf '%s' "${sitemap}" | grep -Eq '<sitemapindex|<urlset'
          if printf '%s' "${sitemap}" | grep -q 'workers.dev'; then
            echo 'Production sitemap leaked a temporary workers.dev URL.' >&2
            exit 1
          fi

          content_sitemap="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "${base}/sitemaps/content.xml?page=0&cutover=${GITHUB_SHA}")"
          printf '%s' "${content_sitemap}" | grep -q '<url>'
          if printf '%s' "${content_sitemap}" | grep -q 'workers.dev'; then
            echo 'Content sitemap leaked a temporary workers.dev URL.' >&2
            exit 1
          fi

      - name: Require at least 10,000 unique canonical sitemap URLs
        env:
          SEO_CUTOVER_BASE_URL: https://healthrenewal.org
          SEO_TARGET_URLS: '10000'
          SEO_ENFORCE_TARGET: 'true'
        run: node scripts/seo-cutover-url-readiness.mjs

      - name: Publish cutover verification status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = 'success' ]; then
            state='success'
            description='Cloudflare cutover and 10k SEO target verified'
          else
            state='failure'
            description='Cloudflare/SEO cutover verification failed'
          fi
          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'cutover/healthrenewal' \
            --arg description "${description}" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" >/dev/null
