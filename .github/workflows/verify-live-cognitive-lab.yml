name: Verify Live Cognitive Lab

on:
  push:
    branches: [cloudflare-workers-deploy]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-live-cognitive-lab
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Verify deployed Cognitive Lab 100
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE='https://rawafid-platform-staging.khaledaltheeb.workers.dev'
          STATUS_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            local payload
            payload="$(printf '{\"state\":\"%s\",\"context\":\"%s\",\"description\":\"%s\",\"target_url\":\"%s\"}' "$state" "$context" "$description" "$RUN_URL")"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${STATUS_API}" \
              -d "$payload" \
              >/dev/null
          }

          fetch() {
            local path="$1"
            local stamp="$2"
            curl --fail --silent --show-error --location --compressed \
              --max-time 25 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${BASE}${path}?live_verify=${stamp}"
          }

          post_status pending 'live/cognitive-lab-100' 'Checking live Cognitive Lab deployment'
          post_status pending 'live/cognitive/page' 'Waiting for the 100-tool Cognitive Lab page'
          post_status pending 'live/cognitive/sitemap' 'Checking the staging Cognitive Lab sitemap'
          post_status pending 'live/cognitive/samples' 'Waiting for verified extension sample routes'

          last_page_ok=false
          last_sitemap_ok=false
          last_samples_ok=false
          last_url_count=0
          last_sitemap_mode='unknown'

          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            page="$(fetch '/cognitive-lab' "$stamp" 2>/dev/null || true)"
            sitemap="$(fetch '/sitemaps/cognitive-lab.xml' "$stamp" 2>/dev/null || true)"
            simon="$(fetch '/cognitive-lab/simon-conflict' "$stamp" 2>/dev/null || true)"
            coding="$(fetch '/cognitive-lab/symbol-coding' "$stamp" 2>/dev/null || true)"
            ambiguity="$(fetch '/cognitive-lab/ambiguity-resolution' "$stamp" 2>/dev/null || true)"
            error_detection="$(fetch '/cognitive-lab/error-detection' "$stamp" 2>/dev/null || true)"

            url_count="$(printf '%s' "$sitemap" | grep -o '<loc>' | wc -l | tr -d ' ' || true)"
            url_count="${url_count:-0}"

            page_ok=false
            sitemap_ok=false
            samples_ok=false
            sitemap_mode='invalid'

            if grep -Fq '100 نشاط معرفي واضح' <<< "$page" \
              && grep -Fq '47' <<< "$page" \
              && grep -Fq '14' <<< "$page"; then
              page_ok=true
            fi

            # This workflow is intentionally scoped to the staging hostname above.
            # Staging may be noindex (valid empty urlset) or temporarily index-enabled (101 URLs).
            if [ "$url_count" = '101' ]; then
              sitemap_ok=true
              sitemap_mode='indexed'
            elif [ "$url_count" = '0' ] && grep -Fq '<urlset' <<< "$sitemap"; then
              sitemap_ok=true
              sitemap_mode='staging-noindex'
            fi

            if grep -Fq 'تعارض الموقع والاستجابة' <<< "$simon" \
              && grep -Fq 'توسعة بحثية 2026' <<< "$simon" \
              && grep -Fq 'ترميز الرمز والرقم' <<< "$coding" \
              && grep -Fq 'حل الغموض السياقي' <<< "$ambiguity" \
              && grep -Fq 'اكتشاف الخطأ في الإجراء' <<< "$error_detection"; then
              samples_ok=true
            fi

            last_page_ok="$page_ok"
            last_sitemap_ok="$sitemap_ok"
            last_samples_ok="$samples_ok"
            last_url_count="$url_count"
            last_sitemap_mode="$sitemap_mode"

            echo "Attempt ${attempt}: page_ok=${page_ok}; sitemap_ok=${sitemap_ok}; sitemap_mode=${sitemap_mode}; samples_ok=${samples_ok}; sitemap_urls=${url_count}; page_bytes=${#page}; sitemap_bytes=${#sitemap}."

            if [ "$attempt" = '1' ] || [ $((attempt % 6)) -eq 0 ]; then
              if $page_ok; then
                post_status success 'live/cognitive/page' 'Live Cognitive Lab page exposes 100 tools, 47 extensions and level 14'
              else
                post_status pending 'live/cognitive/page' 'Live Cognitive Lab page has not reached the verified snapshot'
              fi

              if $sitemap_ok; then
                if [ "$sitemap_mode" = 'indexed' ]; then
                  post_status success 'live/cognitive/sitemap' 'Staging sitemap currently exposes 101 Cognitive Lab URLs'
                else
                  post_status success 'live/cognitive/sitemap' 'Staging noindex policy exposes a valid empty Cognitive Lab sitemap'
                fi
              else
                post_status pending 'live/cognitive/sitemap' "Invalid staging sitemap: mode=${sitemap_mode}, URLs=${url_count}"
              fi

              if $samples_ok; then
                post_status success 'live/cognitive/samples' 'Verified extension sample routes are live'
              else
                post_status pending 'live/cognitive/samples' 'One or more verified extension sample routes are not live yet'
              fi
            fi

            if $page_ok && $sitemap_ok && $samples_ok; then
              echo "LIVE_COGNITIVE_LAB_STATUS=passed"
              echo "LIVE_COGNITIVE_LAB_URL_COUNT=${url_count}"
              echo "LIVE_COGNITIVE_LAB_SITEMAP_MODE=${sitemap_mode}"
              echo "LIVE_COGNITIVE_LAB_TOTAL_TOOLS=100"
              echo "LIVE_COGNITIVE_LAB_EXTENSION_TOOLS=47"
              echo "LIVE_COGNITIVE_LAB_VERIFIED_DIFFICULTY=14"
              echo "Verified sample routes: simon-conflict, symbol-coding, ambiguity-resolution, error-detection"
              post_status success 'live/cognitive/page' 'Live Cognitive Lab page exposes 100 tools, 47 extensions and level 14'
              if [ "$sitemap_mode" = 'indexed' ]; then
                post_status success 'live/cognitive/sitemap' 'Staging sitemap currently exposes 101 Cognitive Lab URLs'
              else
                post_status success 'live/cognitive/sitemap' 'Staging noindex policy exposes a valid empty Cognitive Lab sitemap'
              fi
              post_status success 'live/cognitive/samples' 'Verified extension sample routes are live'
              post_status success 'live/cognitive-lab-100' 'Live Cognitive Lab 100 verified on staging'
              exit 0
            fi

            sleep 10
          done

          if $last_page_ok; then
            post_status success 'live/cognitive/page' 'Live Cognitive Lab page matches the verified 100-tool snapshot'
          else
            post_status failure 'live/cognitive/page' 'Live Cognitive Lab page never reached the verified 100-tool snapshot'
          fi

          if $last_sitemap_ok; then
            if [ "$last_sitemap_mode" = 'indexed' ]; then
              post_status success 'live/cognitive/sitemap' 'Staging sitemap currently exposes 101 Cognitive Lab URLs'
            else
              post_status success 'live/cognitive/sitemap' 'Staging noindex policy exposes a valid empty Cognitive Lab sitemap'
            fi
          else
            post_status failure 'live/cognitive/sitemap' "Invalid staging sitemap ended at mode=${last_sitemap_mode}, URLs=${last_url_count}"
          fi

          if $last_samples_ok; then
            post_status success 'live/cognitive/samples' 'Verified extension sample routes are live'
          else
            post_status failure 'live/cognitive/samples' 'Verified extension sample routes never converged'
          fi

          post_status failure 'live/cognitive-lab-100' 'Live Cognitive Lab verification failed'
          echo 'Live Cognitive Lab did not converge to the verified staging deployment.' >&2
          exit 1
