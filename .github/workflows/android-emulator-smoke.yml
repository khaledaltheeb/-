name: Rawafid Android Emulator Smoke
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Run smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            ARTIFACT_DIR="$GITHUB_WORKSPACE/android-emulator-artifacts"
            APK=$(find "$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)
            test -f "$APK"
            mkdir -p "$ARTIFACT_DIR"
            adb logcat -c || true
            adb install -r "$APK"
            adb shell am force-stop org.healthrenewal.rawafid.debug
            adb shell am start -W -n org.healthrenewal.rawafid.debug/org.healthrenewal.rawafid.MainActivity
            sleep 3
            adb shell pidof org.healthrenewal.rawafid.debug
            adb exec-out screencap -p > "$ARTIFACT_DIR/home.png"
            adb shell am start -W -a android.intent.action.VIEW -d 'https://healthrenewal.org/sectors/mental-health' org.healthrenewal.rawafid.debug
            sleep 3
            adb shell pidof org.healthrenewal.rawafid.debug
            adb exec-out screencap -p > "$ARTIFACT_DIR/deep-link.png"
            adb shell pm revoke org.healthrenewal.rawafid.debug android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop org.healthrenewal.rawafid.debug
            adb shell am start -W -n org.healthrenewal.rawafid.debug/org.healthrenewal.rawafid.MainActivity
            sleep 2
            adb shell pidof org.healthrenewal.rawafid.debug
            adb shell dumpsys meminfo org.healthrenewal.rawafid.debug > "$ARTIFACT_DIR/meminfo.txt"
            adb shell dumpsys package org.healthrenewal.rawafid.debug > "$ARTIFACT_DIR/package.txt"
            adb shell dumpsys activity exit-info org.healthrenewal.rawafid.debug > "$ARTIFACT_DIR/exit-info.txt" || true
            adb logcat -d -t 800 > "$ARTIFACT_DIR/logcat.txt"
            if grep -E 'ANR in org.healthrenewal.rawafid.debug|Process: org.healthrenewal.rawafid.debug.*FATAL EXCEPTION' "$ARTIFACT_DIR/logcat.txt"; then exit 1; fi
      - name: Upload real emulator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawafid-emulator-evidence
          path: android-emulator-artifacts/
          if-no-files-found: error
