name: Fix Wave 8 unresolved-source trace

on:
  push:
    branches:
      - addiction-atlas-wave8-20260827
    paths:
      - '.github/workflows/fix-wave8-u-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: addiction-atlas-wave8-20260827
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Preserve U/null while recording reviewed sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'data/addiction-atlas/risk-evidence-v8.json';
          const data = JSON.parse(await readFile(file, 'utf8'));
          const record = data.records.find((item) => item.substance_slug === 'nitazenes');
          if (!record) throw new Error('nitazenes record missing');
          const cell = record.dimensions.withdrawal_medical_risk;
          if (cell.score !== null || cell.evidence_grade !== 'U') throw new Error('nitazenes withdrawal must remain U/null');
          cell.source_ids = ['who-cnd-nps-control-2026', 'euda-edr-2026-nps'];
          cell.context_ar = 'تمت مراجعة مصادر WHO وEUDA الحالية للفئة، لكنها لا توفر في الطبقة الحالية أساساً كافياً لتثبيت درجة ترتيبية مسؤولة لخطر الانسحاب الطبي على مستوى النيتازينات.';
          cell.rationale_ar = 'يبقى المحور غير محسوم U/null. إدراج المصدرين يثبت ما تمت مراجعته ولا يحول غياب تقدير الانسحاب فيهما إلى درجة مفترضة من كون المادة أفيونية فقط.';
          await writeFile(file, `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          NODE
          git config user.name 'rawafid-wave8-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/addiction-atlas/risk-evidence-v8.json
          git diff --cached --check
          git commit -m 'Trace unresolved nitazene withdrawal evidence'
          git push origin HEAD:addiction-atlas-wave8-20260827
