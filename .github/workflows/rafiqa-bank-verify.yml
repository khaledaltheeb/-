name: Rafiqa 12K Bank Verify (Final Stage)

# The 12K companion-bank expansion is intentionally deferred until the final
# product stage. Existing bundled assets remain untouched and may be used as
# available, but completeness of all 12,000 messages must not block feature
# development or Android builds.
#
# Run this workflow manually only when the final content-upload stage starts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical Rafiqa bank
        run: python3 android/verify_rafiqa_bank.py
