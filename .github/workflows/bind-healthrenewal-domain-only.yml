name: Bind healthrenewal.org to production Rawafid Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: bind-healthrenewal-domain-only
  cancel-in-progress: true

env:
  CLOUDFLARE_ZONE_ID: 'f0024a96330e938e8ceb86ae75200008'
  CLOUDFLARE_WORKER_SERVICE: 'rawafid-platform-production'
  PRODUCTION_ORIGIN: 'https://healthrenewal.org'

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'bind/healthrenewal-domain' --arg description 'Binding healthrenewal.org to production Rawafid Worker' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Verify Cloudflare token exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Bind apex and www through Worker Routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"

          upsert_route() {
            pattern="$1"
            current="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
            route_id="$(echo "$current" | jq -r --arg pattern "$pattern" '.result[] | select(.pattern==$pattern) | .id' | head -n 1)"
            payload="$(jq -n --arg pattern "$pattern" --arg script "${CLOUDFLARE_WORKER_SERVICE}" '{pattern:$pattern,script:$script}')"
            if [ -n "$route_id" ]; then
              response="$(curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api/$route_id" --data "$payload")"
            else
              response="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api" --data "$payload")"
            fi
            echo "$response" | jq '{success,result:{id:.result.id,pattern:.result.pattern,script:.result.script},errors}'
            test "$(echo "$response" | jq -r '.success')" = true
          }

          upsert_route 'healthrenewal.org/*'
          upsert_route 'www.healthrenewal.org/*'

      - name: Verify Worker Routes point only to production Rawafid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
          echo "$response" | jq '{success,routes:[.result[] | select(.pattern=="healthrenewal.org/*" or .pattern=="www.healthrenewal.org/*") | {pattern,script}]}'
          test "$(echo "$response" | jq -r --arg worker "$CLOUDFLARE_WORKER_SERVICE" '[.result[] | select(.pattern=="healthrenewal.org/*" and .script==$worker)] | length')" -eq 1
          test "$(echo "$response" | jq -r --arg worker "$CLOUDFLARE_WORKER_SERVICE" '[.result[] | select(.pattern=="www.healthrenewal.org/*" and .script==$worker)] | length')" -eq 1
          test "$(echo "$response" | jq -r '[.result[] | select((.pattern=="healthrenewal.org/*" or .pattern=="www.healthrenewal.org/*") and .script=="rawafid-platform-staging")] | length')" -eq 0

      - name: Verify Google-visible homepage is production and indexable
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -A 'Googlebot' -D /tmp/headers.txt "${PRODUCTION_ORIGIN}/?binding-check=${stamp}" -o /tmp/apex.html
          grep -qi '^HTTP/.* 200' /tmp/headers.txt
          if grep -Eqi '^x-robots-tag:.*noindex' /tmp/headers.txt; then
            echo 'Homepage X-Robots-Tag still contains noindex.' >&2
            exit 1
          fi
          grep -q 'rel="canonical" href="https://healthrenewal.org/"' /tmp/apex.html
          grep -q 'روافد: الصحة النفسية والتربية الخاصة وسرطان الأطفال' /tmp/apex.html
          if grep -Eqi '<meta[^>]+name="(robots|googlebot)"[^>]+content="[^"]*noindex' /tmp/apex.html; then
            echo 'Homepage meta robots/googlebot still contains noindex.' >&2
            exit 1
          fi
          if grep -Eqi 'workers\.dev|rawafid-platform-staging' /tmp/apex.html; then
            echo 'Staging hostname leaked into production homepage.' >&2
            exit 1
          fi

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='healthrenewal.org is routed to indexable production Rawafid'; else state=failure; description='healthrenewal.org production Worker binding/indexability failed'; fi
          payload="$(jq -n --arg state "$state" --arg context 'bind/healthrenewal-domain' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
