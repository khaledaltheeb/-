name: Bind healthrenewal.org to current Rawafid Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bind-healthrenewal-domain-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: bind-healthrenewal-domain-only
  cancel-in-progress: true

env:
  CLOUDFLARE_ZONE_ID: 'f0024a96330e938e8ceb86ae75200008'
  CLOUDFLARE_WORKER_SERVICE: 'rawafid-platform-staging'

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'bind/healthrenewal-domain' --arg description 'Binding healthrenewal.org through Worker Routes' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Verify Cloudflare token exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Bind apex and www through Worker Routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"
          routes="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
          echo "$routes" | jq '{success,routes:[.result[] | {id,pattern,script}]}'

          upsert_route() {
            pattern="$1"
            current="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
            route_id="$(echo "$current" | jq -r --arg pattern "$pattern" '.result[] | select(.pattern==$pattern) | .id' | head -n 1)"
            payload="$(jq -n --arg pattern "$pattern" --arg script "${CLOUDFLARE_WORKER_SERVICE}" '{pattern:$pattern,script:$script}')"
            if [ -n "$route_id" ]; then
              response="$(curl -sS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api/$route_id" --data "$payload")"
            else
              response="$(curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api" --data "$payload")"
            fi
            echo "$response" | jq '{success,result:{id:.result.id,pattern:.result.pattern,script:.result.script},errors}'
            test "$(echo "$response" | jq -r '.success')" = true
          }

          upsert_route 'healthrenewal.org/*'
          upsert_route 'www.healthrenewal.org/*'

      - name: Verify Worker Routes point to Rawafid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api")"
          echo "$response" | jq '{success,routes:[.result[] | select(.pattern=="healthrenewal.org/*" or .pattern=="www.healthrenewal.org/*") | {pattern,script}]}'
          test "$(echo "$response" | jq -r '[.result[] | select(.pattern=="healthrenewal.org/*" and .script=="rawafid-platform-staging")] | length')" -eq 1
          test "$(echo "$response" | jq -r '[.result[] | select(.pattern=="www.healthrenewal.org/*" and .script=="rawafid-platform-staging")] | length')" -eq 1

      - name: Verify HTTPS reaches the bound domain
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/apex.html -w '%{http_code}' --max-time 20 https://healthrenewal.org/ || true)"
            echo "attempt=$i http=$code"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 500 ] 2>/dev/null; then
              head -c 500 /tmp/apex.html || true
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='healthrenewal.org is routed to current Rawafid Worker'; else state=failure; description='healthrenewal.org Worker Route binding failed'; fi
          payload="$(jq -n --arg state "$state" --arg context 'bind/healthrenewal-domain' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
