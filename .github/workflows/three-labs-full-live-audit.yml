name: Three Labs Full Live Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-labs-full-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit every known Assessment Measures, Assessment Lab, and Cognitive Lab route
        run: node .github/scripts/three-labs-full-live-audit.mjs
