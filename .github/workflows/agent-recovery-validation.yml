name: Agent Recovery Validation
on:
  push:
    branches:
      - agent/complete-recovery-program-20260826
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-recovery-program-20260826
      - name: Correct verified rare-disease reference
        shell: python
        run: |
          from pathlib import Path
          path=Path('lib/editorial-evidence-guides.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace('https://www.who.int/health-topics/rare-diseases','https://www.who.int/standards/classifications/frequently-asked-questions/rare-diseases/')
          path.write_text(text,encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Commit verified reference correction
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/editorial-evidence-guides.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(evidence): use verified WHO rare-disease reference [skip ci]'
            git push origin HEAD:agent/complete-recovery-program-20260826
          fi
