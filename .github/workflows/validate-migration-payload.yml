name: Validate Legacy Migration Payload

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/migration-batches/**'
      - 'scripts/prepare_legacy_batch.py'
      - 'scripts/apply_v3_seo_contract.py'
      - 'scripts/validate_legacy_transfer_payload.py'
      - 'scripts/test_legacy_transfer_gate.py'
      - 'scripts/validate_migration_payload.py'
      - 'scripts/validate_v3_release_metadata.py'
      - '.github/workflows/validate-migration-payload.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate mandatory legacy transfer contract
        run: python scripts/validate_legacy_transfer_payload.py data/migration-batches/generated/adhd-v1.json

      - name: Prove thin legacy content is accepted for transfer
        run: python scripts/test_legacy_transfer_gate.py

      - name: Audit strict editorial migration quality without blocking preservation
        continue-on-error: true
        run: python scripts/validate_migration_payload.py data/migration-batches/generated/adhd-v1.json

      - name: Audit Supabase release metadata without blocking preservation
        continue-on-error: true
        run: python scripts/validate_v3_release_metadata.py data/migration-batches/generated/adhd-v1.json
