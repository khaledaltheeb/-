name: Materialize Legacy Media

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/full-legacy-migration'
    paths:
      - 'scripts/materialize_legacy_media.py'
      - '.github/workflows/materialize-legacy-media.yml'

permissions:
  contents: write
  actions: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Resolve latest validated production baseline
        id: baseline
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/khaledaltheeb/healthrenewal.org/actions/artifacts?name=validated-production-site&per_page=100' -o /tmp/artifacts.json
          python - <<'PY'
          import json, os
          items=[x for x in json.load(open('/tmp/artifacts.json',encoding='utf-8')).get('artifacts',[]) if not x.get('expired') and x.get('workflow_run',{}).get('head_branch')=='main']
          if not items: raise SystemExit('No validated production baseline')
          x=max(items,key=lambda r:r.get('created_at',''))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"artifact_id={x['id']}\n")
              out.write(f"source_sha={x['workflow_run']['head_sha']}\n")
              out.write(f"artifact_digest={x.get('digest','')}\n")
          print({'artifact_id':x['id'],'source_sha':x['workflow_run']['head_sha'],'digest':x.get('digest')})
          PY

      - name: Download production baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.baseline.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/khaledaltheeb/healthrenewal.org/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/legacy-production.zip
          rm -rf legacy-production && mkdir -p legacy-production
          unzip -q /tmp/legacy-production.zip -d legacy-production

      - name: Materialize referenced images at preserved paths
        run: >-
          python scripts/materialize_legacy_media.py legacy-production
          --public-root public
          --manifest artifacts/legacy-media-manifest.json

      - name: Verify media contract
        run: |
          python - <<'PY'
          import json
          m=json.load(open('artifacts/legacy-media-manifest.json',encoding='utf-8'))['summary']
          assert m['unique_image_references'] >= 390, m
          assert m['copied_images'] == m['unique_image_references'], m
          assert m['missing_images'] == 0, m
          assert m['total_bytes'] > 0, m
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY

      - name: Commit preserved media paths
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public artifacts/legacy-media-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize validated legacy media assets"
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/upload-artifact@v6
        with:
          name: legacy-media-manifest
          if-no-files-found: error
          retention-days: 30
          path: artifacts/legacy-media-manifest.json
