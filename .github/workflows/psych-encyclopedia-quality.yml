name: Psychological Encyclopedia Quality

on:
  pull_request:
    paths:
      - 'data/encyclopedia/**'
      - 'docs/PSYCHOLOGICAL-ENCYCLOPEDIA-STATUS.md'
      - 'scripts/validate_psych_encyclopedia.py'
      - 'scripts/audit_psych_encyclopedia_semantics.py'
      - 'scripts/encyclopedia_coverage_report.py'
      - 'app/encyclopedia/**'
      - 'lib/encyclopedia.ts'
      - 'lib/psych-encyclopedia-release.ts'
      - 'app/sitemaps/encyclopedia.xml/route.ts'
      - 'app/sitemap.xml/route.ts'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/encyclopedia/**'
      - 'docs/PSYCHOLOGICAL-ENCYCLOPEDIA-STATUS.md'
      - 'scripts/validate_psych_encyclopedia.py'
      - 'scripts/audit_psych_encyclopedia_semantics.py'
      - 'scripts/encyclopedia_coverage_report.py'
      - 'lib/psych-encyclopedia-release.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-content-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate psychological encyclopedia batches
        run: python scripts/validate_psych_encyclopedia.py
      - name: Audit semantic originality and clinical completeness
        run: python scripts/audit_psych_encyclopedia_semantics.py
      - name: Audit encyclopedia coverage
        run: python scripts/encyclopedia_coverage_report.py --json
