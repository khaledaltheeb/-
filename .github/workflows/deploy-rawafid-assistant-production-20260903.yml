name: Deploy Rawafid Assistant Production 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - 'deploy/rawafid-assistant-production-20260903.trigger'

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      ENABLE_RAWAFID_ASSISTANT: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin

      - name: Verify activation and preservation contracts
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" = "https://healthrenewal.org"
          test "${NEXT_PUBLIC_ALLOW_INDEXING}" = "true"
          test "${ENABLE_RAWAFID_ASSISTANT}" = "true"
          grep -q '"ENABLE_RAWAFID_ASSISTANT": "true"' wrangler.jsonc
          npm run typecheck
          npm run lint
          npm run architecture-check
          npm run live-preservation:validate

      - name: Verify Cloudflare account access
        run: npx wrangler whoami

      - name: Build exact production Worker
        run: npx opennextjs-cloudflare build --env production

      - name: Validate production package
        run: npx wrangler deploy --env production --dry-run

      - name: Deploy exact production Worker
        run: npx opennextjs-cloudflare deploy --env production

      - name: Verify Rawafid assistant on production
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_SHA}-$(date +%s)"

          echo 'SMOKE_STAGE homepage'
          home=''
          for attempt in $(seq 1 15); do
            home="$(curl -fsSL --compressed --max-time 30 -H 'Cache-Control: no-cache, no-store' "${base}/?rawafid-assistant-release=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -q 'فتح مساعد روافد' <<<"$home"; then
              break
            fi
            sleep 4
          done
          HOME_HTML="$home" node <<'NODE'
          const html = process.env.HOME_HTML || '';
          if (!html.includes('فتح مساعد روافد')) throw new Error('assistant launcher missing from production homepage');
          const linkTags = [...html.matchAll(/<link\b[^>]*>/gi)].map((m) => m[0]);
          const canonical = linkTags.find((tag) => /\brel=["']canonical["']/i.test(tag));
          if (!canonical) throw new Error('canonical link tag missing from production homepage');
          if (!/\bhref=["']https:\/\/healthrenewal\.org\/?["']/i.test(canonical)) {
            throw new Error(`canonical target is not production root: ${canonical}`);
          }
          const metaTags = [...html.matchAll(/<meta\b[^>]*>/gi)].map((m) => m[0]);
          const robots = metaTags.filter((tag) => /\bname=["'](?:robots|googlebot)["']/i.test(tag));
          if (robots.some((tag) => /\bcontent=["'][^"']*noindex/i.test(tag))) {
            throw new Error(`production homepage is noindex: ${robots.join(' ')}`);
          }
          console.log('SMOKE_OK homepage assistant canonical indexability');
          NODE

          echo 'SMOKE_STAGE reading'
          reading="$(curl -fsSL --compressed --max-time 30 --get "${base}/api/search/v3" --data-urlencode 'q=كيف اساعد طفلي على القراءة' --data-urlencode 'limit=6')"
          READING_JSON="$reading" node <<'NODE'
          const data = JSON.parse(process.env.READING_JSON || '{}');
          console.log('reading summary', {mode:data.mode,count:data.count,results:Array.isArray(data.results)?data.results.length:null,resolved_query:data.resolved_query});
          if (!String(data.mode || '').includes('zero-api')) throw new Error('reading search is not zero-api');
          if (!Array.isArray(data.results) || data.results.length < 1) throw new Error('reading search returned no results');
          console.log('SMOKE_OK reading');
          NODE

          echo 'SMOKE_STAGE dialect'
          dialect="$(curl -fsSL --compressed --max-time 30 --get "${base}/api/search/v3" --data-urlencode 'q=طفلي ما بحكي' --data-urlencode 'limit=6')"
          DIALECT_JSON="$dialect" node <<'NODE'
          const data = JSON.parse(process.env.DIALECT_JSON || '{}');
          const body = JSON.stringify(data).toLowerCase();
          console.log('dialect summary', {mode:data.mode,count:data.count,results:Array.isArray(data.results)?data.results.length:null,resolved_query:data.resolved_query});
          if (!String(data.mode || '').includes('zero-api')) throw new Error('dialect search is not zero-api');
          if (!/(speech|talk|كلام|نطق|يتكلم|يتحدث)/i.test(body)) throw new Error('dialect search did not preserve speech intent');
          console.log('SMOKE_OK dialect');
          NODE

          echo 'SMOKE_STAGE contextual'
          contextual="$(curl -fsSL --compressed --max-time 30 --get "${base}/api/search/v3" --data-urlencode 'q=وماذا عن العلاج' --data-urlencode 'context=علامات التوحد' --data-urlencode 'limit=6')"
          CONTEXTUAL_JSON="$contextual" node <<'NODE'
          const data = JSON.parse(process.env.CONTEXTUAL_JSON || '{}');
          console.log('contextual summary', {mode:data.mode,contextual:data.contextual,resolved_query:data.resolved_query,results:Array.isArray(data.results)?data.results.length:null});
          if (data.contextual !== true) throw new Error('contextual follow-up was not recognized');
          if (!/توحد/.test(String(data.resolved_query || ''))) throw new Error('contextual follow-up lost autism topic');
          console.log('SMOKE_OK contextual');
          NODE

          echo 'SMOKE_STAGE social-work'
          social="$(curl -fsSL --compressed --max-time 30 --get "${base}/api/search/v3" --data-urlencode 'q=أخلاقيات العمل الاجتماعي' --data-urlencode 'limit=6')"
          SOCIAL_JSON="$social" node <<'NODE'
          const data = JSON.parse(process.env.SOCIAL_JSON || '{}');
          const urls = Array.isArray(data.results) ? data.results.map((item) => item?.url).filter(Boolean) : [];
          console.log('social-work summary', {mode:data.mode,count:data.count,results:urls.length,urls:urls.slice(0,3)});
          if (!/social-work/.test(JSON.stringify(data))) throw new Error('social-work corpus result missing');
          console.log('SMOKE_OK social-work');
          NODE

          echo 'Rawafid assistant production smoke passed.'
