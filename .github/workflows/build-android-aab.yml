name: Build Rawafid Android AAB
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths: ["android-app/**", ".github/workflows/build-android-aab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Validate release manifest
        run: |
          ! grep -R 'android:debuggable="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Build release bundle
        run: gradle --no-daemon clean bundleRelease lintRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-release-aab
          path: android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
