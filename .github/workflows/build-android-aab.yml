name: Build Rawafid Android AAB
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths: ["android-app/**", ".github/workflows/build-android-aab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release manifest and security invariants
        run: |
          set -eu
          ! grep -R 'android:debuggable="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          ! grep -R -E '(AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|RAWAFID_KEYSTORE_PASSWORD *=)' app/src/main 2>/dev/null || exit 1
      - name: Show test tasks
        run: gradle --no-daemon tasks --all | grep -E 'test.*UnitTest|testDebug|testRelease' || true
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build release bundle
        run: gradle --no-daemon clean bundleRelease
      - name: Run release lint
        run: |
          set +e
          gradle --no-daemon lintRelease
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$report" ]; then
            echo "===== FULL LINT REPORT ====="
            cat "$report"
          fi
          exit $status
      - name: Analyze release R8 configuration
        run: gradle --no-daemon :app:analyzeReleaseR8Config
      - name: Enforce AAB size budget
        run: |
          set -eu
          aab=$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$aab"
          bytes=$(wc -c < "$aab")
          max=$((20 * 1024 * 1024))
          echo "AAB bytes: $bytes / budget: $max"
          test "$bytes" -le "$max"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-release-aab
          path: android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
