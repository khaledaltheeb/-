name: Pin Next Cloudflare Runtime Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'docs/next-cloudflare-runtime-pin.trigger'

permissions:
  contents: write

concurrency:
  group: pin-next-cloudflare-runtime
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Synchronize main
        shell: bash
        run: git pull --ff-only origin main

      - name: Pin compatible Next runtime and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts next@16.2.12
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts eslint-config-next@16.2.12
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.dependencies?.next !== '16.2.12') throw new Error('package.json Next pin failed');
          if (pkg.devDependencies?.['eslint-config-next'] !== '16.2.12') throw new Error('eslint-config-next pin failed');
          if (lock.packages?.['node_modules/next']?.version !== '16.2.12') throw new Error('lockfile Next version mismatch');
          if (lock.packages?.['node_modules/eslint-config-next']?.version !== '16.2.12') throw new Error('lockfile eslint-config-next version mismatch');
          NODE

      - name: Verify locked dependency graph
        run: npm ci --no-audit --no-fund

      - name: Verify lint
        run: npm run lint

      - name: Commit compatibility pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Next compatibility pin already applied.'
            exit 0
          fi
          git commit -m 'Pin Next 16.2.12 for Cloudflare runtime stability'
          git pull --rebase origin main
          git push origin HEAD:main
