name: Live No-Loss Discovery Smoke

on:
  workflow_run:
    workflows: ['Deploy Production Fast']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-heavy-live-verification
  cancel-in-progress: false

jobs:
  verify-live-discovery:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reorganized discovery routes are live and preserved
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/live-no-loss-discovery-smoke.mjs
