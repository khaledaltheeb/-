name: Verify Key Production Indexability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-key-production-indexability.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://healthrenewal.org
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'indexability/key-routes' --arg description 'Checking homepage, capability pages and Daily Tools as Googlebot' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Check key public routes as Googlebot
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            '/'
            '/capabilities/ideas/'
            '/capabilities/printables/'
            '/daily-tools/'
            '/daily-tools/sleep-wind-down-plan/'
          )
          for path in "${urls[@]}"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            url="${ORIGIN}${path}"
            echo "=== ${url} ==="
            code="$(curl -sS -L --retry 5 --retry-delay 2 --retry-all-errors --max-time 40 -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "HTTP ${code}"
            grep -iE '^(HTTP/|x-robots-tag:|content-type:|cache-control:|cf-cache-status:)' "$headers" || true
            test "$code" = '200'
            if grep -Eqi '^x-robots-tag:.*noindex' "$headers"; then
              echo "X-Robots-Tag noindex remains on ${url}" >&2
              exit 1
            fi
            if grep -Eqi '<meta[^>]+name="(robots|googlebot)"[^>]+content="[^"]*noindex' "$body"; then
              echo "HTML noindex remains on ${url}" >&2
              exit 1
            fi
            canonical="$(grep -oEi '<link[^>]+rel="canonical"[^>]*>' "$body" | head -n 1 || true)"
            echo "${canonical}"
            printf '%s' "$canonical" | grep -q 'healthrenewal.org'
            rm -f "$headers" "$body"
          done

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Key production routes are HTTP 200 and indexable'; else state=failure; description='A key production route failed Googlebot indexability smoke'; fi
          payload="$(jq -n --arg state "$state" --arg context 'indexability/key-routes' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
