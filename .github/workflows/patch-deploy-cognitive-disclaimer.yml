name: Patch Cognitive Deploy Disclaimer

on:
  push:
    branches: [agent/deploy-cognitive-processes-1000]
    paths:
      - '.github/workflows/patch-deploy-cognitive-disclaimer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/deploy-cognitive-processes-1000
          fetch-depth: 1
      - name: Restore central disclaimer contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/content/[slug]/page.tsx')
          s=p.read_text(encoding='utf-8')
          old="import ContentRenderer from '@/components/content-renderer';\n"
          new=old+"import ContentDisclaimerLink from '@/components/content-disclaimer-link';\n"
          if "ContentDisclaimerLink from '@/components/content-disclaimer-link'" not in s:
              if old not in s: raise SystemExit('ContentRenderer import anchor not found')
              s=s.replace(old,new,1)
          anchor="        {related.length > 0 && <section className=\"article-related\" aria-labelledby=\"related-title\">"
          if '<ContentDisclaimerLink />' not in s:
              if anchor not in s: raise SystemExit('Related section anchor not found')
              s=s.replace(anchor,"        <ContentDisclaimerLink />\n"+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/content/'[slug]'/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Restore central content disclaimer on cognitive deploy"
          git push origin HEAD:agent/deploy-cognitive-processes-1000
