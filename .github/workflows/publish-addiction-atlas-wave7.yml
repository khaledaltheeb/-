name: Diagnose Addiction Atlas Wave 7 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-addiction-atlas-wave7.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Diagnose every wave 7 production marker
        shell: bash
        run: |
          set -uo pipefail
          base='https://healthrenewal.org'
          cache_header='Cache-Control: no-cache, no-store, max-age=0'
          failed=0

          fetch_page() {
            local label="$1" url="$2" value
            if value="$(curl -fsSL --compressed --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 -H "$cache_header" "$url" 2>/dev/null)"; then
              echo "FETCH PASS ${label}: ${#value} bytes" >&2
              printf '%s' "$value"
            else
              echo "::error title=Wave7 fetch failed::${label} could not be fetched" >&2
              failed=1
              printf ''
            fi
          }

          check() {
            local label="$1" haystack="$2" needle="$3"
            if grep -Fq -- "$needle" <<< "$haystack"; then
              echo "PASS ${label} :: ${needle}"
            else
              echo "::error title=Wave7 marker failed::${label} missing literal marker: ${needle}"
              failed=1
            fi
          }

          probe() {
            local label="$1" haystack="$2" needle="$3"
            if grep -Fq -- "$needle" <<< "$haystack"; then echo "PROBE YES ${label} :: ${needle}"; else echo "PROBE NO ${label} :: ${needle}"; fi
          }

          stamp="${GITHUB_SHA}-$(date +%s)"
          atlas="$(fetch_page atlas "${base}/addiction/substances/?wave7-diagnostic=${stamp}")"
          interactions="$(fetch_page interactions "${base}/addiction/interactions/?wave7-diagnostic=${stamp}")"
          prevalence="$(fetch_page prevalence "${base}/addiction/prevalence/?wave7-diagnostic=${stamp}")"
          mortality="$(fetch_page mortality "${base}/addiction/mortality/?wave7-diagnostic=${stamp}")"
          methodology="$(fetch_page methodology "${base}/addiction/methodology/?wave7-diagnostic=${stamp}")"
          comparison="$(fetch_page comparison "${base}/addiction/compare/kratom-vs-7-oh/?wave7-diagnostic=${stamp}")"
          seven_oh="$(fetch_page seven-oh "${base}/addiction/substances/7-hydroxymitragynine/?wave7-diagnostic=${stamp}")"
          phenibut="$(fetch_page phenibut "${base}/addiction/substances/phenibut/?wave7-diagnostic=${stamp}")"
          hhc="$(fetch_page hhc "${base}/addiction/substances/hexahydrocannabinol-hhc/?wave7-diagnostic=${stamp}")"
          carisoprodol="$(fetch_page carisoprodol "${base}/addiction/substances/carisoprodol/?wave7-diagnostic=${stamp}")"
          cychlorphine="$(fetch_page cychlorphine "${base}/addiction/substances/cychlorphine/?wave7-diagnostic=${stamp}")"
          rootmap="$(fetch_page root-sitemap "${base}/sitemap.xml?wave7-diagnostic=${stamp}")"
          atlasmap="$(fetch_page atlas-sitemap "${base}/sitemaps/addiction-atlas.xml?wave7-diagnostic=${stamp}")"

          check 'atlas-count' "$atlas" '71'
          check 'atlas-phenibut' "$atlas" 'Phenibut'
          check 'atlas-hhc' "$atlas" 'Hexahydrocannabinol'
          check 'atlas-cychlorphine' "$atlas" 'Cychlorphine'
          check 'interactions-heading' "$interactions" 'افحص تفاعلاً تمت مراجعته'
          check 'interactions-absence-rule' "$interactions" 'غير مراجع بعد'
          check 'prevalence-ascii-1320' "$prevalence" '1320'
          check 'prevalence-phenibut-ar' "$prevalence" 'فينيبيوت'
          check 'mortality-ascii-238' "$mortality" '238'
          check 'mortality-carfentanil-ar' "$mortality" 'كارفنتانيل'
          check 'mortality-phenibut-ar' "$mortality" 'فينيبيوت'
          check 'methodology-evidence' "$methodology" 'قوة الدليل'
          check 'comparison-7oh' "$comparison" '7-Hydroxymitragynine'
          check 'comparison-kratom' "$comparison" 'Kratom'
          check 'comparison-schema' "$comparison" 'Article'

          for spec in \
            'seven-oh|7-Hydroxymitragynine' \
            'phenibut|Phenibut' \
            'hhc|Hexahydrocannabinol' \
            'carisoprodol|Carisoprodol' \
            'cychlorphine|Cychlorphine'; do
            label="${spec%%|*}"; marker="${spec#*|}"
            case "$label" in
              seven-oh) page="$seven_oh" ;;
              phenibut) page="$phenibut" ;;
              hhc) page="$hhc" ;;
              carisoprodol) page="$carisoprodol" ;;
              cychlorphine) page="$cychlorphine" ;;
            esac
            check "${label}-schema" "$page" 'MedicalWebPage'
            check "${label}-name" "$page" "$marker"
          done
          check 'cychlorphine-uncertainty' "$cychlorphine" 'غير محسوم'

          check 'root-sitemap-atlas' "$rootmap" '/sitemaps/addiction-atlas.xml'
          for route in \
            '/addiction/substances/7-hydroxymitragynine/' \
            '/addiction/substances/phenibut/' \
            '/addiction/substances/hexahydrocannabinol-hhc/' \
            '/addiction/substances/carisoprodol/' \
            '/addiction/substances/protonitazepyne/' \
            '/addiction/substances/metonitazepyne/' \
            '/addiction/substances/etonitazepipne/' \
            '/addiction/substances/n-desethyl-isotonitazene/' \
            '/addiction/substances/3-oh-pcp/' \
            '/addiction/substances/n-ethylheptedrone/' \
            '/addiction/substances/isotonitazepyne/' \
            '/addiction/substances/n-desethyl-etonitazene/' \
            '/addiction/substances/mdmb-fubinaca/' \
            '/addiction/substances/cychlorphine/' \
            '/addiction/compare/kratom-vs-7-oh/' \
            '/addiction/compare/cannabis-vs-hhc/' \
            '/addiction/compare/phenibut-vs-gabapentin/'; do
            check "sitemap:${route}" "$atlasmap" "$route"
          done

          if grep -Fq 'workers.dev' <<< "$atlasmap"; then
            echo '::error title=Wave7 sitemap failed::workers.dev leaked into addiction atlas sitemap'
            failed=1
          else
            echo 'PASS sitemap-no-workers-dev'
          fi

          idx=0
          for html in "$atlas" "$interactions" "$prevalence" "$mortality" "$methodology" "$comparison" "$seven_oh" "$phenibut" "$hhc" "$carisoprodol" "$cychlorphine"; do
            idx=$((idx+1)); lower="${html,,}"
            if [[ "$lower" =~ \<meta[^\>]*name=[\"\']robots[\"\'][^\>]*content=[\"\'][^\"\']*noindex ]] || [[ "$lower" =~ \<meta[^\>]*content=[\"\'][^\"\']*noindex[^\"\']*[\"\'][^\>]*name=[\"\']robots[\"\'] ]]; then
              echo "::error title=Wave7 indexability failed::surface ${idx} contains noindex"
              failed=1
            else
              echo "PASS indexability-surface-${idx}"
            fi
          done

          probe 'prevalence-arabic-formatted-1320' "$prevalence" '١٬٣٢٠'
          probe 'mortality-arabic-formatted-238' "$mortality" '٢٣٨'
          probe 'mortality-status-preliminary' "$mortality" 'preliminary-incomplete'
          probe 'phenibut-mortality-status' "$mortality" 'poison-center-surveillance-not-population-mortality'

          if [[ "$failed" -ne 0 ]]; then
            echo 'Wave 7 diagnostic found one or more failed live markers.' >&2
            exit 1
          fi
          echo 'Wave 7 diagnostic: all original live markers passed.'
