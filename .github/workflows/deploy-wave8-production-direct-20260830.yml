name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-wave8-production-direct-20260830.yml'

permissions:
  contents: read

jobs:
  deploy-wave8:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare token
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/checkout@v7
        with:
          ref: 233568f2f67d7aa6026290eee5c4c6c574d035e4
      - name: Verify exact release SHA
        run: test "$(git rev-parse HEAD)" = '233568f2f67d7aa6026290eee5c4c6c574d035e4'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Arabic image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
      - name: Verify release contracts
        run: |
          npm run typecheck
          npm run lint
          npm run architecture-check
          npm run live-preservation:validate
      - name: Verify Cloudflare access
        run: npx wrangler whoami
      - name: Build exact production Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy exact production Worker
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify Wave 8 on healthrenewal.org
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp='233568f2f67d7aa6026290eee5c4c6c574d035e4'
          get() { curl -fsSL --compressed --retry 12 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "$1"; }
          atlas="$(get "${base}/addiction/substances/?release=${stamp}")"
          fentanyl="$(get "${base}/addiction/substances/fentanyl/?release=${stamp}")"
          alcohol="$(get "${base}/addiction/substances/alcohol/?release=${stamp}")"
          methadone="$(get "${base}/addiction/substances/methadone/?release=${stamp}")"
          tramadol="$(get "${base}/addiction/substances/tramadol/?release=${stamp}")"
          buprenorphine="$(get "${base}/addiction/substances/buprenorphine/?release=${stamp}")"
          nitazenes="$(get "${base}/addiction/substances/nitazenes/?release=${stamp}")"
          sitemap="$(get "${base}/sitemaps/addiction-atlas.xml?release=${stamp}")"
          [[ "$atlas" == *'Fentanyl'* && "$atlas" == *'Heroin'* && "$atlas" == *'71'* ]]
          [[ "$fentanyl" == *'طبقة التتبع العلمي'* && "$fentanyl" == *'National Institute on Drug Abuse (NIDA)'* ]]
          [[ "$alcohol" == *'Management of alcohol withdrawal'* ]]
          [[ "$methadone" == *'Methadone Hydrochloride'* ]]
          [[ "$tramadol" == *'ULTRAM'* ]]
          [[ "$buprenorphine" == *'What is Buprenorphine?'* ]]
          [[ "$nitazenes" == *'طبقة التتبع العلمي'* && "$nitazenes" == *'غير محسوم'* ]]
          [[ "$sitemap" == *'/addiction/substances/fentanyl/'* && "$sitemap" == *'/addiction/methodology/'* && "$sitemap" != *'workers.dev'* ]]
          for page in "$atlas" "$fentanyl" "$alcohol" "$methadone" "$tramadol" "$buprenorphine" "$nitazenes"; do
            lower="${page,,}"
            if [[ "$lower" =~ \<meta[^\>]*name=[\"\']robots[\"\'][^\>]*content=[\"\'][^\"\']*noindex ]]; then exit 1; fi
          done
          echo 'Wave 8 is live and verified on production.'
