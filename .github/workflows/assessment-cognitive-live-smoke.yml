name: Assessment and Cognitive Labs Live Smoke

on:
  push:
    branches: ['main']
    paths:
      - '.github/scripts/assessment-cognitive-live-smoke.mjs'
      - '.github/workflows/assessment-cognitive-live-smoke.yml'
      - 'data/assessment-lab/**'
      - 'lib/assessment-lab/**'
      - 'app/assessment-lab/**'
      - 'components/assessment-monitor-runner.tsx'
  workflow_run:
    workflows: ['Deploy Production Fast']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-cognitive-labs-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe all Assessment Lab production routes plus Cognitive Lab sentinels
        run: node .github/scripts/assessment-cognitive-live-smoke.mjs
