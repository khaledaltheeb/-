name: Assessment and Cognitive Labs Live Smoke

on:
  push:
    branches: ['ops/assessment-cognitive-live-smoke-20260906']
    paths:
      - '.github/scripts/assessment-cognitive-live-smoke.mjs'
      - '.github/workflows/assessment-cognitive-live-smoke.yml'
  workflow_run:
    workflows: ['Deploy Production Fast']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-cognitive-labs-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe Assessment Lab and Cognitive Lab production sequentially
        run: node .github/scripts/assessment-cognitive-live-smoke.mjs
