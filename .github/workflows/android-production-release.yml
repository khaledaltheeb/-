name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Optional human-readable release label'
        required: false
        type: string

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required production signing secrets
        env:
          RAWAFID_RELEASE_KEYSTORE_BASE64: ${{ secrets.RAWAFID_RELEASE_KEYSTORE_BASE64 }}
          RAWAFID_RELEASE_STORE_PASSWORD: ${{ secrets.RAWAFID_RELEASE_STORE_PASSWORD }}
          RAWAFID_RELEASE_KEY_ALIAS: ${{ secrets.RAWAFID_RELEASE_KEY_ALIAS }}
          RAWAFID_RELEASE_KEY_PASSWORD: ${{ secrets.RAWAFID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RAWAFID_RELEASE_KEYSTORE_BASE64"
          test -n "$RAWAFID_RELEASE_STORE_PASSWORD"
          test -n "$RAWAFID_RELEASE_KEY_ALIAS"
          test -n "$RAWAFID_RELEASE_KEY_PASSWORD"

      - name: Materialize production keystore
        env:
          RAWAFID_RELEASE_KEYSTORE_BASE64: ${{ secrets.RAWAFID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RAWAFID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rawafid-production-release.jks"
          chmod 600 "$RUNNER_TEMP/rawafid-production-release.jks"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build signed production AAB and APK
        env:
          RAWAFID_RELEASE_STORE_FILE: ${{ runner.temp }}/rawafid-production-release.jks
          RAWAFID_RELEASE_STORE_PASSWORD: ${{ secrets.RAWAFID_RELEASE_STORE_PASSWORD }}
          RAWAFID_RELEASE_KEY_ALIAS: ${{ secrets.RAWAFID_RELEASE_KEY_ALIAS }}
          RAWAFID_RELEASE_KEY_PASSWORD: ${{ secrets.RAWAFID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p android :app:clean :app:bundleRelease :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          test -f android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/release-sha256.txt

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v7
        with:
          name: rawafid-life-os-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed production APK and checksums
        uses: actions/upload-artifact@v7
        with:
          name: rawafid-life-os-production-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/release-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove materialized keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rawafid-production-release.jks"
