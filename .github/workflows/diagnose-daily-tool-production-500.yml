name: Diagnose Daily Tool Production 500

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-daily-tool-production-500.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1910e1ad3c793fd568ba1caafe34f964'
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'diagnose/daily-tools-500' --arg description 'Capturing production Worker exception for Daily Tools' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Capture Worker exception while reproducing the 500
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          : > /tmp/tail.log
          npx wrangler tail rawafid-platform-production --format json > /tmp/tail.log 2>&1 &
          tail_pid=$!
          cleanup() { kill "$tail_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 5
          curl -sS -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP %{http_code}\n' 'https://healthrenewal.org/daily-tools/sleep-wind-down-plan/' || true
          sleep 8
          cleanup
          echo '--- RESPONSE HEADERS ---'
          cat /tmp/headers.txt || true
          echo '--- RESPONSE BODY ---'
          head -c 2000 /tmp/body.txt || true
          echo
          echo '--- WORKER TAIL ---'
          cat /tmp/tail.log || true
          grep -Eqi 'exception|error|daily-tools|sleep-wind-down-plan' /tmp/tail.log

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Daily Tools production diagnostic captured'; else state=failure; description='Daily Tools production diagnostic failed'; fi
          payload="$(jq -n --arg state "$state" --arg context 'diagnose/daily-tools-500' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
