name: OpenNext Cache Capability Probe

on:
  pull_request:
    paths:
      - '.github/workflows/opennext-cache-capability-probe.yml'
      - '.github/open-next-production-cache.config.ts'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify deploy token is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Probe R2 read capability without mutations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.115.0 r2 bucket list 2>&1 | tee /tmp/r2-buckets.txt
          grep -Eqi 'bucket|name|created|no r2 buckets|no buckets' /tmp/r2-buckets.txt || {
            echo 'R2 list completed but output format was not recognized.' >&2
            cat /tmp/r2-buckets.txt >&2
            exit 1
          }
          if grep -Eqi 'rawafid|next[-_ ]?cache|cache[-_ ]?next' /tmp/r2-buckets.txt; then
            echo 'RAWAFID_CACHE_BUCKET_PRESENT=true'
          else
            echo 'RAWAFID_CACHE_BUCKET_PRESENT=false'
          fi
          echo 'R2_READ_CAPABILITY_OK=true'
