name: Materialize Addiction Atlas Wave 8

on:
  push:
    branches:
      - addiction-atlas-wave8-20260827
    paths:
      - '.github/workflows/materialize-addiction-wave8.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: addiction-atlas-wave8-20260827
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate audited Wave 8 evidence JSON
        run: node scripts/materialize-addiction-wave8.mjs
      - name: Verify generated shape
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const wave = JSON.parse(await readFile('data/addiction-atlas/risk-evidence-v8.json', 'utf8'));
          const manifest = JSON.parse(await readFile('data/addiction-atlas/risk-evidence-manifest.json', 'utf8'));
          if (wave.records.length !== 20) throw new Error(`expected 20 Wave 8 records, got ${wave.records.length}`);
          const cells = wave.records.reduce((sum, record) => sum + Object.keys(record.dimensions).length, 0);
          if (cells !== 160) throw new Error(`expected 160 Wave 8 cells, got ${cells}`);
          if (!manifest.waves.includes('/data/addiction-atlas/risk-evidence-v8.json')) throw new Error('risk evidence manifest missing v8');
          console.log(`Wave 8 shape verified: ${wave.records.length} records / ${cells} cells.`);
          NODE
      - name: Commit generated evidence
        shell: bash
        run: |
          git config user.name 'rawafid-wave8-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/addiction-atlas/risk-evidence-v8.json data/addiction-atlas/risk-evidence-manifest.json
          git diff --cached --check
          git commit -m 'Materialize Wave 8 axis evidence'
          git push origin HEAD:addiction-atlas-wave8-20260827
