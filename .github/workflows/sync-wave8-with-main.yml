name: Sync Wave 8 with current main

on:
  push:
    branches:
      - addiction-atlas-wave8-20260827
    paths:
      - '.github/workflows/sync-wave8-with-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: addiction-atlas-wave8-20260827
          fetch-depth: 0
      - name: Merge current main into Wave 8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawafid-wave8-sync'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:addiction-atlas-wave8-20260827
