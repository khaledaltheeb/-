name: Full Production Parity Audit

on:
  push:
    branches:
      - agent/full-production-parity-audit

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare live legacy route families with Cloudflare main
        shell: python
        run: |
          import collections
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          LEGACY = 'https://healthrenewal.org'
          TARGET = 'https://main-rawafid-platform-staging.khaledaltheeb.workers.dev'
          UA = {'User-Agent': 'Rawafid-Migration-Audit/1.0'}

          def get_bytes(url, retries=4):
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (i + 1))
              raise last

          def status(url):
              last = None
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, r.geturl()
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 502, 503, 504) and i < 2:
                          time.sleep(2 * (i + 1))
                          continue
                      return e.code, e.geturl()
                  except Exception as e:
                      last = e
                      time.sleep(2 * (i + 1))
              return 0, repr(last)

          seeds = {LEGACY + '/sitemap.xml'}
          try:
              robots = get_bytes(LEGACY + '/robots.txt').decode('utf-8', 'ignore')
              for line in robots.splitlines():
                  if line.lower().startswith('sitemap:'):
                      seeds.add(line.split(':', 1)[1].strip())
          except Exception as e:
              print('ROBOTS_ERROR', repr(e))

          queue = collections.deque(sorted(seeds))
          seen_sitemaps = set()
          urls = set()
          while queue and len(seen_sitemaps) < 500:
              sm = queue.popleft()
              if sm in seen_sitemaps:
                  continue
              seen_sitemaps.add(sm)
              try:
                  root = ET.fromstring(get_bytes(sm))
              except Exception as e:
                  print('SITEMAP_ERROR', sm, repr(e))
                  continue
              locs = [n.text.strip() for n in root.iter() if n.tag.endswith('loc') and n.text]
              if root.tag.endswith('sitemapindex'):
                  queue.extend(loc for loc in locs if loc.startswith(LEGACY))
              else:
                  urls.update(loc for loc in locs if loc.startswith(LEGACY))

          paths = sorted({urllib.parse.urlsplit(u).path or '/' for u in urls})
          grouped = collections.defaultdict(list)
          counts = collections.Counter()
          for p in paths:
              seg = [x for x in p.split('/') if x]
              fam = '/' if not seg else '/' + seg[0]
              counts[fam] += 1
              if len(grouped[fam]) < 3:
                  grouped[fam].append(p)

          results = []
          for fam in sorted(grouped):
              probes = []
              root_path = '/' if fam == '/' else fam + '/'
              for p in [root_path] + grouped[fam]:
                  if p not in probes:
                      probes.append(p)
              probe_results = []
              for p in probes[:3]:
                  code, final = status(TARGET + p)
                  probe_results.append((p, code, final))
                  time.sleep(0.15)
              ok = sum(1 for _, c, _ in probe_results if 200 <= c < 400)
              results.append((fam, counts[fam], ok, len(probe_results), probe_results))

          print(f'LEGACY_PUBLIC_URLS={len(paths)}')
          print(f'LEGACY_TOP_LEVEL_FAMILIES={len(results)}')
          print('=== FAMILY_PARITY ===')
          full = partial = missing = 0
          weighted_full = weighted_partial = weighted_missing = 0
          for fam, count, ok, total, probes in sorted(results, key=lambda x: (-x[1], x[0])):
              state = 'FULL' if ok == total else ('PARTIAL' if ok else 'MISSING')
              if state == 'FULL':
                  full += 1; weighted_full += count
              elif state == 'PARTIAL':
                  partial += 1; weighted_partial += count
              else:
                  missing += 1; weighted_missing += count
              details = ' | '.join(f'{p}={c}' for p, c, _ in probes)
              print(f'{state:7s} legacy={count:4d} probes={ok}/{total} family={fam} :: {details}')
          print('=== SUMMARY ===')
          print(f'FAMILIES_FULL={full}')
          print(f'FAMILIES_PARTIAL={partial}')
          print(f'FAMILIES_MISSING={missing}')
          print(f'LEGACY_URLS_IN_FULL_FAMILIES={weighted_full}')
          print(f'LEGACY_URLS_IN_PARTIAL_FAMILIES={weighted_partial}')
          print(f'LEGACY_URLS_IN_MISSING_FAMILIES={weighted_missing}')
          print('PRODUCTION_CUTOVER_READY=' + ('YES' if missing == 0 and partial == 0 else 'NO'))
