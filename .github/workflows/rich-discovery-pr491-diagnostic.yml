name: PR 491 Rich Discovery Diagnostic

on:
  push:
    branches: [oapen-doab-discovery-20260831]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
      SEO_GATE_CONCURRENCY: '8'
      SEO_GATE_TIMEOUT_MS: '20000'
      SEO_GATE_PAGE_ATTEMPTS: '3'
      SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
      SEO_RICH_MIN_WORDS: '100'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
      - name: Build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-server.log 2>&1 &
          echo $! > /tmp/rawafid-server.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-server.log >&2 || true
            exit 1
          fi
      - name: Full rich results and discovery gate with captured output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rich-discovery-gate.mjs 2>&1 | tee /tmp/rich-discovery.log
      - name: Upload rich discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr491-rich-discovery-${{ github.run_id }}
          path: |
            /tmp/rich-discovery.log
            /tmp/rawafid-server.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rawafid-server.pid ]; then
            kill "$(cat /tmp/rawafid-server.pid)" 2>/dev/null || true
          fi
