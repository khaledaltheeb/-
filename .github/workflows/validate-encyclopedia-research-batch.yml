name: Validate Encyclopedia Research Batch

on:
  push:
    branches:
      - 'agent/encyclopedia-disability-inclusion-foundation'
    paths:
      - 'data/encyclopedia/research/batch-01-source-plan.json'
      - 'data/encyclopedia/generated/legacy-candidates-v1.json'
      - 'scripts/validate_encyclopedia_research_batch.py'
      - '.github/workflows/validate-encyclopedia-research-batch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/encyclopedia/research/batch-01-source-plan.json'
      - 'data/encyclopedia/generated/legacy-candidates-v1.json'
      - 'scripts/validate_encyclopedia_research_batch.py'
      - '.github/workflows/validate-encyclopedia-research-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile research validator
        run: python -m py_compile scripts/validate_encyclopedia_research_batch.py
      - name: Validate first-wave research contract
        run: |
          python scripts/validate_encyclopedia_research_batch.py \
            data/encyclopedia/research/batch-01-source-plan.json \
            --registry data/encyclopedia/generated/legacy-candidates-v1.json
