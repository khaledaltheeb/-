name: Deploy Cognitive Lab Live

on:
  push:
    branches: [cloudflare-workers-deploy]
    paths:
      - 'app/cognitive-lab/**'
      - 'app/sitemaps/cognitive-lab.xml/**'
      - 'components/cognitive-lab-*.tsx'
      - 'data/cognitive-lab/**'
      - 'lib/cognitive-lab/**'
      - 'scripts/cognitive-lab-contract.mjs'
      - 'scripts/cognitive-lab-extension-audit-contract.mjs'
      - '.github/workflows/deploy-cognitive-lab-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deploy/cognitive-lab-live\",\"description\":\"Validating and deploying Cognitive Lab 100\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare credentials and account access
        run: npx wrangler whoami

      - name: Mark credentials verified
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/credentials","description":"Cloudflare credentials verified"}' >/dev/null

      - name: Validate Cognitive Lab 100
        run: |
          npm run cognitive-lab:validate
          node scripts/cognitive-lab-extension-audit-contract.mjs

      - name: Mark Cognitive Lab validation passed
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/validated","description":"Cognitive Lab contracts and semantic audit passed"}' >/dev/null

      - name: Type check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Mark code quality passed
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/code-quality","description":"TypeScript and ESLint passed"}' >/dev/null

      - name: Build Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare build

      - name: Mark Worker build passed
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/built","description":"OpenNext Cloudflare Worker build passed"}' >/dev/null

      - name: Deploy Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare deploy

      - name: Mark Worker published
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/published","description":"OpenNext deployment command succeeded"}' >/dev/null

      - name: Verify live Cognitive Lab 100
        shell: bash
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SITE_URL}"
          for attempt in $(seq 1 36); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            page="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/cognitive-lab?deploy=${stamp}" 2>/dev/null || true)"
            sitemap="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/sitemaps/cognitive-lab.xml?deploy=${stamp}" 2>/dev/null || true)"
            simon="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/cognitive-lab/simon-conflict?deploy=${stamp}" 2>/dev/null || true)"
            coding="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/cognitive-lab/symbol-coding?deploy=${stamp}" 2>/dev/null || true)"
            ambiguity="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/cognitive-lab/ambiguity-resolution?deploy=${stamp}" 2>/dev/null || true)"
            error_detection="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/cognitive-lab/error-detection?deploy=${stamp}" 2>/dev/null || true)"
            url_count="$(printf '%s' "$sitemap" | grep -o '<loc>' | wc -l | tr -d ' ' || true)"
            url_count="${url_count:-0}"
            if printf '%s' "$page" | grep -Fq '100 نشاط معرفي واضح' \
              && [ "$url_count" = '101' ] \
              && printf '%s' "$simon" | grep -Fq 'تعارض الموقع والاستجابة' \
              && printf '%s' "$simon" | grep -Fq 'توسعة بحثية 2026' \
              && printf '%s' "$coding" | grep -Fq 'ترميز الرمز والرقم' \
              && printf '%s' "$ambiguity" | grep -Fq 'حل الغموض السياقي' \
              && printf '%s' "$error_detection" | grep -Fq 'اكتشاف الخطأ في الإجراء'; then
              echo "Live Cognitive Lab verified: 100 tools, 101 sitemap URLs, extension routes reachable."
              exit 0
            fi
            echo "Live snapshot not complete on attempt ${attempt}; sitemap URLs=${url_count}."
            sleep 5
          done
          echo 'Live Cognitive Lab verification failed after direct deployment.' >&2
          exit 1

      - name: Mark live verification passed
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/cognitive/live","description":"Live Cognitive Lab 100 and 101 sitemap URLs verified"}' >/dev/null

      - name: Mark deployment success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/cognitive-lab-live\",\"description\":\"Cognitive Lab 100 deployed and verified live\",\"target_url\":\"${RUN_URL}\"}" >/dev/null

      - name: Mark deployment failure
        if: failure()
        shell: bash
        run: |
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/cognitive-lab-live\",\"description\":\"Cognitive Lab direct deploy or live verification failed\",\"target_url\":\"${RUN_URL}\"}" >/dev/null || true
