name: Deploy Daily Tools Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-daily-tools-production-20260830.yml'

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - uses: actions/checkout@v7
        with:
          ref: 437df67051e38d9be3e940ee782ef05d56d58f5a

      - name: Pin verified release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '437df67051e38d9be3e940ee782ef05d56d58f5a'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin

      - name: Revalidate release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run architecture-check
          npm run live-preservation:validate
          npm run daily-tools:contract

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build --env production

      - name: Deploy verified Daily Tools release
        run: npx opennextjs-cloudflare deploy --env production

      - name: Verify Daily Tools live production
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp='437df67051e38d9be3e940ee782ef05d56d58f5a'
          fetch_page() { curl -fsSL --compressed --retry 10 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "$1"; }

          hub="$(fetch_page "${base}/daily-tools/?release=${stamp}")"
          grounding="$(fetch_page "${base}/daily-tools/three-minute-grounding/?release=${stamp}")"
          caffeine="$(fetch_page "${base}/daily-tools/caffeine-cutoff-planner/?release=${stamp}")"
          sleep="$(fetch_page "${base}/daily-tools/sleep-wind-down-plan/?release=${stamp}")"

          [[ "$hub" == *'150 أداة عملية'* ]]
          [[ "$hub" == *'/daily-tools/three-minute-grounding/'* ]]
          [[ "$hub" == *'/daily-tools/sleep-wind-down-plan/'* ]]
          [[ "$grounding" == *'نفّذ الأداة خطوة بخطوة'* ]]
          [[ "$grounding" == *'أنجزت هذه الخطوة'* ]]
          [[ "$grounding" == *'حفظ محلي'* ]]
          [[ "$caffeine" == *'نفّذ الأداة خطوة بخطوة'* ]]
          [[ "$caffeine" == *'أُنجز'* ]]
          [[ "$sleep" == *'سجل'* ]]

          for page in "$hub" "$grounding" "$caffeine" "$sleep"; do
            if printf '%s' "$page" | grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex'; then
              echo 'Unexpected noindex detected on Daily Tools production surface.' >&2
              exit 1
            fi
            if printf '%s' "$page" | grep -q 'workers.dev'; then
              echo 'Temporary workers.dev origin leaked into Daily Tools production HTML.' >&2
              exit 1
            fi
          done

          echo 'Daily Tools production deployment verified live.'
