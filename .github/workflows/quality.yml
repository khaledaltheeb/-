name: Rawafid Quality Gate

on:
  pull_request:
    branches: [main, cloudflare-workers-deploy]
  push:
    branches: [main, foundation-v3, final-hardening]

concurrency:
  group: rawafid-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Architecture privacy PWA and theme contract
        run: npm run architecture-check
      - name: Final content-readiness hardening contract
        run: node scripts/final-hardening-check.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
          NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
        run: npm run build
      - name: Production HTTP smoke, full sitemap SEO gate, and Lighthouse lab audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
          NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SEO_GATE_BASE_URL: http://127.0.0.1:3000
          SEO_GATE_CONCURRENCY: '6'
          SEO_GATE_TIMEOUT_MS: '15000'
          SEO_GATE_PAGE_ATTEMPTS: '3'
          SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-server.log 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- Next server log after quality failure ---"; cat /tmp/rawafid-server.log || true; fi; kill $SERVER_PID 2>/dev/null || true; exit $status' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          node scripts/seo-gate.mjs
          for run in 1 2 3; do
            ok=0
            for attempt in 1 2 3; do
              if npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ \
                --quiet --chrome-flags="--headless --no-sandbox" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="/tmp/rawafid-lighthouse-${run}.json"; then
                ok=1
                break
              fi
              echo "Lighthouse run ${run} attempt ${attempt} failed; retrying after Chrome cleanup"
              pkill -f 'chrome|chromium' 2>/dev/null || true
              sleep 2
            done
            test "$ok" -eq 1
          done
          node - <<'NODE'
          const fs=require('fs');
          const metricIds=['server-response-time','first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'];
          const runs=[1,2,3].map((run)=>{
            const report=JSON.parse(fs.readFileSync(`/tmp/rawafid-lighthouse-${run}.json`,'utf8'));
            const scores=Object.fromEntries(Object.entries(report.categories).map(([key,value])=>[key,value.score]));
            const metrics=Object.fromEntries(metricIds.map((id)=>[id,report.audits[id]?.displayValue??report.audits[id]?.numericValue??null]));
            return {run,scores,metrics};
          });
          for(const result of runs){
            console.log(`Lighthouse lab run ${result.run}:`,result.scores,result.metrics);
            if((result.scores.accessibility??0)<0.90) throw new Error(`Accessibility Lighthouse score below 0.90 on run ${result.run}: ${result.scores.accessibility}`);
            if((result.scores['best-practices']??0)<0.90) throw new Error(`Best Practices Lighthouse score below 0.90 on run ${result.run}: ${result.scores['best-practices']}`);
            if((result.scores.seo??0)<0.95) throw new Error(`SEO Lighthouse score below 0.95 on run ${result.run}: ${result.scores.seo}`);
          }
          const performances=runs.map((result)=>result.scores.performance??0).sort((a,b)=>a-b);
          const median=performances[1];
          console.log('Lighthouse performance scores:',performances,'median:',median);
          if(median<0.70) throw new Error(`Median Lighthouse performance below 0.70: ${median}`);
          NODE
