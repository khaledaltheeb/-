name: Rawafid Quality Gate

on:
  pull_request:
    branches: [main, cloudflare-workers-deploy]
  push:
    branches: [main, foundation-v3, final-hardening]

concurrency:
  group: rawafid-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      VISUAL_BASE_URL: http://127.0.0.1:3000
      VISUAL_OUTPUT_DIR: visual-artifacts
      SMOKE_BASE_URL: http://127.0.0.1:3000
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
      SEO_GATE_CONCURRENCY: '8'
      SEO_GATE_TIMEOUT_MS: '20000'
      SEO_GATE_PAGE_ATTEMPTS: '3'
      SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
      SEO_RICH_MIN_WORDS: '100'
      SEO_TARGET_URLS: '10000'
      SEO_REQUIRE_TARGET: 'false'
      EDITORIAL_REQUIRE_READY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          convert -version
          rsvg-convert --version
          fc-match 'Noto Sans Arabic'
      - name: Architecture privacy PWA and theme contract
        run: npm run architecture-check
      - name: Public presentation preservation gate
        run: npm run public-preservation:validate
      - name: Sitemap partition preservation gate
        run: npm run sitemap-preservation:validate
      - name: Static sitemap coverage gate
        run: npm run static-sitemap:validate
      - name: Final content-readiness hardening contract
        run: node scripts/final-hardening-check.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install visual browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-server.log 2>&1 &
          echo $! > /tmp/rawafid-server.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-server.log >&2 || true
            exit 1
          fi
      - name: Visual layout regression
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'No Chrome/Chromium executable found for visual regression checks.' >&2
            exit 1
          fi
          VISUAL_CHROME_PATH="$CHROME_BIN" node scripts/visual-regression.mjs
      - name: Daily Tools visual and interaction regression
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'No Chrome/Chromium executable found for Daily Tools visual regression checks.' >&2
            exit 1
          fi
          VISUAL_CHROME_PATH="$CHROME_BIN" node scripts/daily-tools-visual-regression.mjs
      - name: Production HTTP smoke
        run: npm run smoke
      - name: Full sitemap SEO gate
        run: node scripts/seo-gate.mjs
      - name: Rich results and discovery gate
        run: node scripts/rich-discovery-gate.mjs
      - name: Content richness and duplicate-body gate
        run: node scripts/content-richness-gate.mjs
      - name: YMYL editorial SEO readiness report
        run: node scripts/editorial-seo-readiness.mjs
      - name: SEO readiness progress toward 10000 canonical URLs
        run: node scripts/seo-readiness-report.mjs
      - name: Lighthouse lab audit
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            ok=0
            for attempt in 1 2 3; do
              if npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ \
                --quiet --chrome-flags="--headless --no-sandbox" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="/tmp/rawafid-lighthouse-${run}.json"; then
                ok=1
                break
              fi
              echo "Lighthouse run ${run} attempt ${attempt} failed; retrying after Chrome cleanup"
              pkill -f 'chrome|chromium' 2>/dev/null || true
              sleep 2
            done
            test "$ok" -eq 1
          done
          node - <<'NODE'
          const fs=require('fs');
          const metricIds=['server-response-time','first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'];
          const runs=[1,2,3].map((run)=>{
            const report=JSON.parse(fs.readFileSync(`/tmp/rawafid-lighthouse-${run}.json`,'utf8'));
            const scores=Object.fromEntries(Object.entries(report.categories).map(([key,value])=>[key,value.score]));
            const metrics=Object.fromEntries(metricIds.map((id)=>[id,report.audits[id]?.displayValue??report.audits[id]?.numericValue??null]));
            return {run,scores,metrics};
          });
          for(const result of runs){
            console.log(`Lighthouse lab run ${result.run}:`,result.scores,result.metrics);
            if((result.scores.accessibility??0)<0.90) throw new Error(`Accessibility Lighthouse score below 0.90 on run ${result.run}: ${result.scores.accessibility}`);
            if((result.scores['best-practices']??0)<0.90) throw new Error(`Best Practices Lighthouse score below 0.90 on run ${result.run}: ${result.scores['best-practices']}`);
            if((result.scores.seo??0)<0.95) throw new Error(`SEO Lighthouse score below 0.95 on run ${result.run}: ${result.scores.seo}`);
          }
          const performances=runs.map((result)=>result.scores.performance??0).sort((a,b)=>a-b);
          const median=performances[1];
          console.log('Lighthouse performance scores:',performances,'median:',median);
          if(median<0.70) throw new Error(`Median Lighthouse performance below 0.70: ${median}`);
          NODE
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-visual-regression-${{ github.run_id }}
          path: visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-quality-diagnostics-${{ github.run_id }}
          path: |
            /tmp/rawafid-server.log
            /tmp/rawafid-lighthouse-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rawafid-server.pid ]; then
            kill "$(cat /tmp/rawafid-server.pid)" 2>/dev/null || true
          fi
