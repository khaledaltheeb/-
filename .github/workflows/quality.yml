name: Rawafid Fast Quality Gate

# Routine publishing must stay fast. Deep SEO crawls, Lighthouse, visual
# regression, migration audits, and architecture-wide contracts are intentionally
# excluded from this gate and are run only from dedicated manual workflows.
on:
  pull_request:
    branches: [main, cloudflare-workers-deploy]
  workflow_dispatch:

concurrency:
  group: rawafid-fast-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-quality-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-quality-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Compute Quick Info social image fingerprint
        id: quick-info-fingerprint
        run: node scripts/quick-info-social-cache-key.mjs

      - name: Restore Quick Info social images
        id: quick-info-cache
        uses: actions/cache@v4
        with:
          path: |
            public/quick-info/og
            public/quick-info/discover
            public/quick-info/social-images-manifest.json
          key: quick-info-social-${{ runner.os }}-${{ steps.quick-info-fingerprint.outputs.fingerprint }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install build image dependencies
        if: steps.quick-info-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core librsvg2-bin

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        shell: bash
        env:
          QUICK_INFO_SOCIAL_CACHE_HIT: ${{ steps.quick-info-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          node scripts/build_psych_encyclopedia_assets.mjs
          node scripts/build-quick-info-cards-cached.mjs
          node scripts/build-daily-tools-route-manifest.mjs
          node scripts/build_expanded_encyclopedia_assets.mjs
          node scripts/materialize-legacy-static-assets.mjs
          npx next build

      - name: Minimal runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-fast-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-fast-server.log >&2 || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null
