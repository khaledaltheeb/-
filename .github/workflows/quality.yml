name: Rawafid Fast Quality Gate

# Routine publishing must stay fast. Deep SEO crawls, Lighthouse, visual
# regression, migration audits, architecture-wide contracts, and generated
# Quick Info social-card assets are intentionally excluded from this gate.
# Those generated images are a publishing concern; the routine PR gate verifies
# that the application builds and serves correctly without regenerating them.
# Next build performs the project TypeScript validation, so a separate tsc pass
# is intentionally omitted here.
on:
  pull_request:
    branches: [main, cloudflare-workers-deploy]
  workflow_dispatch:

concurrency:
  group: rawafid-fast-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_psych_encyclopedia_assets.mjs
          node scripts/build-daily-tools-route-manifest.mjs
          node scripts/build_expanded_encyclopedia_assets.mjs
          node scripts/materialize-legacy-static-assets.mjs
          npx next build

      - name: Minimal runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-fast-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-fast-server.log >&2 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/ >/tmp/home.html
          for tool in searchRawafid searchRawafidHeader searchRawafidMobile searchRawafidFooter; do
            grep -q "toolname=\"${tool}\"" /tmp/home.html
          done
          test "$(grep -o 'toolname="' /tmp/home.html | wc -l | tr -d ' ')" -ge 4
          grep -q 'tooldescription="Search Rawafid' /tmp/home.html
          grep -q 'toolparamdescription="The user' /tmp/home.html
          grep -q 'id="rawafid-webmcp-imperative"' /tmp/home.html
          grep -q 'search_rawafid_evidence' /tmp/home.html
          grep -q 'document.modelContext' /tmp/home.html
          grep -q 'additionalProperties: false' /tmp/home.html
          curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null
