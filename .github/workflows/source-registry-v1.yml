name: Source Registry V1

on:
  pull_request:
    paths:
      - 'app/api/v1/sources/**'
      - 'app/api/v1/content/[slug]/sources/**'
      - 'app/api/openapi.json/**'
      - 'supabase/migrations/*global_source_registry*'
      - 'supabase/migrations/*ror_source_registry*'
      - 'supabase/migrations/*source_connection_metadata*'
      - 'supabase/migrations/*source_governance_provenance*'
      - 'supabase/migrations/*datacite_content_relations*'
      - 'scripts/source-registry-v1-contract.mjs'
      - '.github/workflows/source-registry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Source registry architecture contract
        run: node scripts/source-registry-v1-contract.mjs
      - name: Repository quality coverage
        run: echo 'TypeScript, lint, Next build, and runtime smoke are enforced once by Rawafid Fast Quality Gate for every pull request.'
