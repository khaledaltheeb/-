name: Android App Build

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/scripts/verify_android_catalogs.py'
      - '.github/workflows/android-app-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/scripts/verify_android_catalogs.py'
      - '.github/workflows/android-app-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android catalogs
        run: python3 .github/scripts/verify_android_catalogs.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and test Android app
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-life-os-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
