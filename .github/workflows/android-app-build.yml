name: Android App Build

on:
  pull_request:
    paths:
      - 'android/**'
      - 'supabase/config.toml'
      - 'supabase/functions/rawafid-circle-push/**'
      - 'supabase/migrations/*rawafid_circle*.sql'
      - '.gitignore'
      - '.github/scripts/verify_android_catalogs.py'
      - '.github/scripts/verify_android_motion.py'
      - '.github/scripts/verify_android_safety.py'
      - '.github/workflows/android-app-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'supabase/config.toml'
      - 'supabase/functions/rawafid-circle-push/**'
      - 'supabase/migrations/*rawafid_circle*.sql'
      - '.gitignore'
      - '.github/scripts/verify_android_catalogs.py'
      - '.github/scripts/verify_android_motion.py'
      - '.github/scripts/verify_android_safety.py'
      - '.github/workflows/android-app-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Android contracts
        run: |
          python3 .github/scripts/verify_android_catalogs.py
          python3 .github/scripts/verify_android_motion.py
          python3 .github/scripts/verify_android_safety.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile, lint, unit test and verify release shrinker
        run: gradle -p android :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rawafid-life-os-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: rawafid-life-os-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
