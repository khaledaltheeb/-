name: Basira RC6 CI

on:
  push:
    branches:
      - agent/basira-rc6-20260910
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Basira RC6 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p basira-rc6
          cat basira_rc6_ci/parts/part*.b64 | base64 -d > /tmp/basira-rc6-source.tar.gz
          echo "48757025fa6f0710c7257302287ce17e852b2539348462ead8498083cf0a0d64  /tmp/basira-rc6-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/basira-rc6-source.tar.gz -C basira-rc6

      - name: Fetch verified EfficientDet Lite0 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p basira-rc6/app/src/main/assets
          curl -fL --retry 3 --retry-all-errors \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite" \
            -o basira-rc6/app/src/main/assets/efficientdet_lite0.tflite
          echo "0720bf247bd76e6594ea28fa9c6f7c5242be774818997dbbeffc4da460c723bb  basira-rc6/app/src/main/assets/efficientdet_lite0.tflite" | sha256sum -c -

      - name: Core smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd basira-rc6
          bash tools/run-core-smoke.sh

      - name: Android unit tests
        run: gradle -p basira-rc6 :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle -p basira-rc6 :app:lintDebug :app:lintRelease --stacktrace

      - name: Build debug and release APKs
        run: gradle -p basira-rc6 :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find basira-rc6/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee basira-rc6/debug-apk.sha256

      - name: Upload Basira RC6 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basira-rc6-build
          if-no-files-found: warn
          path: |
            basira-rc6/app/build/outputs/apk/**/*.apk
            basira-rc6/app/build/reports/**
            basira-rc6/app/build/test-results/**
            basira-rc6/debug-apk.sha256
