name: Public API V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.json/**'
      - 'app/feed.xml/**'
      - 'app/magazine/feed.xml/**'
      - 'app/developers/**'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/research-integrations/**'
      - 'components/trust-page.tsx'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'supabase/migrations/20260901203000_public_api_change_log_semantics_v2.sql'
      - 'supabase/migrations/20260901204500_partner_api_admin_acl_hardening_v2.sql'
      - 'supabase/migrations/20260901205500_public_api_source_relation_index_v2.sql'
      - 'scripts/public-api-v1-contract.mjs'
      - 'scripts/public-api-v1-http-contract.mjs'
      - 'scripts/public-api-feed-contract.mjs'
      - '.github/workflows/public-api-v1.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.json/**'
      - 'app/feed.xml/**'
      - 'app/magazine/feed.xml/**'
      - 'app/developers/**'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/research-integrations/**'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'supabase/migrations/20260901203000_public_api_change_log_semantics_v2.sql'
      - 'supabase/migrations/20260901204500_partner_api_admin_acl_hardening_v2.sql'
      - 'supabase/migrations/20260901205500_public_api_source_relation_index_v2.sql'
      - 'scripts/public-api-v1-contract.mjs'
      - 'scripts/public-api-v1-http-contract.mjs'
      - 'scripts/public-api-feed-contract.mjs'

permissions:
  contents: read

concurrency:
  group: public-api-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      PUBLIC_API_TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          convert -version
          rsvg-convert --version
      - name: Public API architecture contract
        run: node scripts/public-api-v1-contract.mjs
      - name: Research integration contract
        run: node scripts/research-integrations-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production candidate
        run: npm run build
      - name: Start production candidate
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/public-api-v1.log 2>&1 &
          echo $! > /tmp/public-api-v1.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/public-api-v1.log >&2 || true
          exit 1
      - name: Full HTTP, privacy and synchronization contract
        run: node scripts/public-api-v1-http-contract.mjs
      - name: Feed observability contract
        run: node scripts/public-api-feed-contract.mjs
      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/public-api-v1.pid ]; then kill "$(cat /tmp/public-api-v1.pid)" 2>/dev/null || true; fi
          cat /tmp/public-api-v1.log 2>/dev/null || true
