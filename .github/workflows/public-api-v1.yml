name: Public API V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.json/**'
      - 'app/developers/**'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/crossref-metadata.ts'
      - 'components/trust-page.tsx'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'scripts/public-api-v1-contract.mjs'
      - '.github/workflows/public-api-v1.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/v1/**'
      - 'app/api/openapi.json/**'
      - 'app/feed.json/**'
      - 'app/developers/**'
      - 'lib/public-api-v1.ts'
      - 'lib/partner-api-v1.ts'
      - 'lib/crossref-metadata.ts'
      - 'supabase/migrations/20260901032000_public_api_v1_change_log.sql'
      - 'supabase/migrations/20260901035000_partner_api_core_v1.sql'
      - 'scripts/public-api-v1-contract.mjs'

permissions:
  contents: read

concurrency:
  group: public-api-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          convert -version
          rsvg-convert --version
      - name: Public API architecture contract
        run: node scripts/public-api-v1-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Build production candidate
        run: npm run build
      - name: Start production candidate
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/public-api-v1.log 2>&1 &
          echo $! > /tmp/public-api-v1.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/api/v1 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/public-api-v1.log >&2 || true
          exit 1
      - name: HTTP contract smoke
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          curl -fsS "$base/api/v1" -o /tmp/api-discovery.json
          curl -fsS "$base/api/openapi.json" -o /tmp/openapi.json
          curl -fsS "$base/api/v1/content?limit=2" -D /tmp/content.headers -o /tmp/content.json
          curl -fsS "$base/api/v1/research?limit=2" -o /tmp/research.json
          curl -fsS "$base/api/v1/courses?limit=2" -o /tmp/courses.json
          curl -fsS "$base/api/v1/pages?limit=2" -o /tmp/pages.json
          curl -fsS "$base/api/v1/stats" -o /tmp/stats.json
          curl -fsS "$base/api/v1/changes?since=2026-01-01T00%3A00%3A00Z&limit=2" -o /tmp/changes.json
          invalid_code="$(curl -sS -o /tmp/invalid-key.json -w '%{http_code}' -H 'X-API-Key: definitely-invalid' "$base/api/v1/content?limit=1")"
          test "$invalid_code" = 401
          curl -fsS "$base/feed.xml" -o /tmp/feed.xml
          curl -fsS "$base/feed.json" -o /tmp/feed.json
          curl -fsS "$base/developers" -o /tmp/developers.html
          node - <<'NODE'
          const fs=require('fs');
          const discovery=JSON.parse(fs.readFileSync('/tmp/api-discovery.json','utf8'));
          const openapi=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          const content=JSON.parse(fs.readFileSync('/tmp/content.json','utf8'));
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const stats=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          const changes=JSON.parse(fs.readFileSync('/tmp/changes.json','utf8'));
          const invalid=JSON.parse(fs.readFileSync('/tmp/invalid-key.json','utf8'));
          const jsonFeed=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          const headers=fs.readFileSync('/tmp/content.headers','utf8').toLowerCase();
          const xml=fs.readFileSync('/tmp/feed.xml','utf8');
          if(discovery.version!=='1.1.0') throw new Error('bad API discovery version');
          if(openapi.openapi!=='3.1.0' || openapi.info?.version!=='1.1.0') throw new Error('bad OpenAPI version');
          if(!openapi.components?.securitySchemes?.PartnerApiKey) throw new Error('PartnerApiKey security scheme missing');
          if(!Array.isArray(content.data) || !Array.isArray(pages.data)) throw new Error('content/pages data is not array');
          if(!stats.data || typeof stats.data.total!=='number') throw new Error('stats unavailable');
          if(!Array.isArray(changes.data)) throw new Error('change stream unavailable');
          if(invalid.error?.code!=='invalid_api_key') throw new Error('invalid API key contract failed');
          if(jsonFeed.version!=='https://jsonfeed.org/version/1.1') throw new Error('bad JSON Feed version');
          if(!headers.includes('etag:')) throw new Error('ETag missing');
          if(!headers.includes('x-request-id:')) throw new Error('request id missing');
          if(!xml.includes('<rss version="2.0"')) throw new Error('RSS 2.0 signature missing');
          NODE
      - name: Crossref metadata integration verification
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          endpoint="$base/api/v1/integrations/crossref/works?doi=10.1038%2Fs41586-020-2649-2"
          curl -fsS "$endpoint" -D /tmp/crossref.headers -o /tmp/crossref.json
          invalid_code="$(curl -sS -o /tmp/crossref-invalid.json -w '%{http_code}' "$base/api/v1/integrations/crossref/works?doi=not-a-doi")"
          test "$invalid_code" = 400
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/crossref.json','utf8'));
          const invalid=JSON.parse(fs.readFileSync('/tmp/crossref-invalid.json','utf8'));
          const data=payload.data;
          if(data?.doi!=='10.1038/s41586-020-2649-2') throw new Error('normalized DOI mismatch');
          if(!data.original_title || data.local_title_ar!==null) throw new Error('original/local title separation failed');
          if(!data.member_id || !data.prefix || !data.owner_note) throw new Error('record ownership missing');
          if(!data.stewardship?.includes('Crossref community of members')) throw new Error('Crossref stewardship attribution missing');
          if(!data.relations || !Array.isArray(data.updates)) throw new Error('relations/updates contract missing');
          if(payload.meta?.operational_policy?.contact_email!=='contact@healthrenewal.org') throw new Error('polite-pool contact missing');
          if(payload.meta?.operational_policy?.cache_ttl_seconds!==86400) throw new Error('cache policy mismatch');
          if(payload.meta?.operational_policy?.protected_full_text_retrieval!==false) throw new Error('full-text boundary missing');
          if(invalid.error?.code!=='invalid_parameter') throw new Error('invalid DOI error contract failed');
          NODE
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub(/\r/,""); sub(/^etag:[[:space:]]*/,""); print; exit}' /tmp/crossref.headers)"
          test -n "$etag"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$endpoint")"
          test "$code" = 304
      - name: Conditional request verification
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub(/\r/,""); sub(/^etag:[[:space:]]*/,""); print; exit}' /tmp/content.headers)"
          test -n "$etag"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$base/api/v1/content?limit=2")"
          test "$code" = 304
      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/public-api-v1.pid ]; then kill "$(cat /tmp/public-api-v1.pid)" 2>/dev/null || true; fi
