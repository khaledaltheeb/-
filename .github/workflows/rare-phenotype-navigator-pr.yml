name: Rare Phenotype Navigator PR

on:
  pull_request:
    paths:
      - 'app/tools/rare-phenotype-navigator/**'
      - 'app/api/rare-phenotype/**'
      - 'components/rare-phenotype-navigator.tsx'
      - 'scripts/rare-phenotype-navigator-contract.mjs'
      - '.github/workflows/rare-phenotype-navigator-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rare phenotype contract
        run: node scripts/rare-phenotype-navigator-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
