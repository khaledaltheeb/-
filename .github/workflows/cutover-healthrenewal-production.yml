name: Cut over healthrenewal.org to Production Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-healthrenewal-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rawafid-healthrenewal-cutover
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
  NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
  NEXT_PUBLIC_ALLOW_INDEXING: 'true'
  NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
  CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  EXPECTED_WORKER: rawafid-platform-production
  DOMAIN: healthrenewal.org
  WWW_DOMAIN: www.healthrenewal.org

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish pending cutover status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state pending \
            --arg context 'deploy/healthrenewal-production' \
            --arg description 'Deploying Rawafid production Worker and custom domains' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" >/dev/null

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require and verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami

      - name: Verify production configuration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "rawafid-platform-production"' wrangler.jsonc
          grep -q '"pattern": "healthrenewal.org"' wrangler.jsonc
          grep -q '"pattern": "www.healthrenewal.org"' wrangler.jsonc
          grep -q '"custom_domain": true' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_SITE_URL": "https://healthrenewal.org"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_ALLOW_INDEXING": "true"' wrangler.jsonc

      - name: Type check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build production Worker
        run: npx opennextjs-cloudflare build --env production

      - name: Deploy production Worker and Custom Domains
        run: npx opennextjs-cloudflare deploy --env production

      - name: Verify Cloudflare custom-domain mapping
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")"
            root_ok="$(printf '%s' "$response" | jq -r --arg host "$DOMAIN" --arg service "$EXPECTED_WORKER" '[.result[] | select(.hostname == $host and .service == $service)] | length')"
            www_ok="$(printf '%s' "$response" | jq -r --arg host "$WWW_DOMAIN" --arg service "$EXPECTED_WORKER" '[.result[] | select(.hostname == $host and .service == $service)] | length')"
            if [ "$root_ok" -ge 1 ] && [ "$www_ok" -ge 1 ]; then
              printf '%s' "$response" | jq -c --arg root "$DOMAIN" --arg www "$WWW_DOMAIN" '.result[] | select(.hostname == $root or .hostname == $www) | {hostname,service,environment,zone_name}'
              exit 0
            fi
            echo "Custom-domain mapping not converged yet: root=${root_ok}, www=${www_ok}, attempt=${attempt}."
            sleep 5
          done
          echo 'Cloudflare custom-domain mapping did not converge to the production Worker.' >&2
          exit 1

      - name: Verify live production hostname and SEO contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://${DOMAIN}"
          for attempt in $(seq 1 24); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            home="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/?cutover=${stamp}" 2>/dev/null || true)"
            robots="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/robots.txt?cutover=${stamp}" 2>/dev/null || true)"
            sitemap="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/sitemap.xml?cutover=${stamp}" 2>/dev/null || true)"

            canonical_ok=false
            robots_ok=false
            sitemap_ok=false
            noindex_ok=false
            staging_leak_ok=false

            if printf '%s' "$home" | grep -q 'rel="canonical" href="https://healthrenewal.org/"' && printf '%s' "$home" | grep -q 'منصة روافد'; then canonical_ok=true; fi
            if printf '%s' "$robots" | grep -q "Sitemap: ${base}/sitemap.xml"; then robots_ok=true; fi
            if printf '%s' "$sitemap" | grep -Eq '<sitemapindex|<urlset' && ! printf '%s' "$sitemap" | grep -q 'workers.dev'; then sitemap_ok=true; fi
            if ! printf '%s' "$home" | grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex|<meta[^>]+content="[^"]*noindex[^"]*"[^>]+name="robots"'; then noindex_ok=true; fi
            if ! printf '%s' "$home" | grep -q 'rawafid-platform-staging\.khaledaltheeb\.workers\.dev'; then staging_leak_ok=true; fi

            echo "Attempt ${attempt}: canonical=${canonical_ok}, robots=${robots_ok}, sitemap=${sitemap_ok}, indexable=${noindex_ok}, no_staging_leak=${staging_leak_ok}."
            if $canonical_ok && $robots_ok && $sitemap_ok && $noindex_ok && $staging_leak_ok; then
              exit 0
            fi
            sleep 5
          done
          echo 'Production hostname did not converge to the expected SEO contract.' >&2
          exit 1

      - name: Verify www redirects permanently to canonical host
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            headers="$(curl -sS -o /dev/null -D - --max-redirs 0 "https://${WWW_DOMAIN}/sections?cutover=1" || true)"
            if printf '%s' "$headers" | head -n 1 | grep -Eq ' 308( |$)' && printf '%s' "$headers" | grep -Eqi '^location: https://healthrenewal\.org/sections\?cutover=1\r?$'; then
              exit 0
            fi
            sleep 5
          done
          printf '%s\n' "$headers" >&2
          echo 'www redirect did not converge to the canonical host.' >&2
          exit 1

      - name: Publish cutover result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Rawafid production Worker is live on healthrenewal.org'
          else
            state=failure
            description='Rawafid production cutover failed; inspect workflow logs'
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context 'deploy/healthrenewal-production' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
