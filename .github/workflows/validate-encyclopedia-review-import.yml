name: Validate Encyclopedia Review Import

on:
  push:
    branches:
      - 'agent/encyclopedia-disability-inclusion-foundation'
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/generated/review-drafts/**'
      - 'data/encyclopedia/canonical-adoptions-v1.json'
      - 'scripts/import_disability_encyclopedia_review.mjs'
      - '.github/workflows/validate-encyclopedia-review-import.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/generated/review-drafts/**'
      - 'data/encyclopedia/canonical-adoptions-v1.json'
      - 'scripts/import_disability_encyclopedia_review.mjs'
      - '.github/workflows/validate-encyclopedia-review-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Validate importer syntax
        run: node --check scripts/import_disability_encyclopedia_review.mjs
      - name: Offline dry-run for all genuinely new review payloads
        env:
          SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          expected="$(find data/encyclopedia/drafts -maxdepth 1 -type f -name '*-v1.json' | wc -l | tr -d ' ')"
          test "$expected" -gt 0
          node scripts/import_disability_encyclopedia_review.mjs --expect-count "$expected"
      - name: Assert adopted canonicals remain enrichment-only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/encyclopedia/canonical-adoptions-v1.json','utf8'));
          const expected=new Set(['attention-deficit-hyperactivity-disorder','dyslexia','developmental-language-disorder']);
          for(const slug of expected){
            const row=p.adoptions.find((item)=>item.slug===slug);
            if(!row||row.import_as_new_record!==false||row.decision!=='merge-into-existing-canonical') throw new Error(`${slug}: canonical adoption contract failed`);
            if(!fs.existsSync(row.owner_source)||!fs.existsSync(row.specialty_enrichment_source)) throw new Error(`${slug}: canonical adoption source is missing`);
          }
          if(p.adoptions.length!==expected.size) throw new Error(`Unexpected canonical adoption count: ${p.adoptions.length}`);
          NODE
      - name: Assert apply mode requires credentials and cannot silently write
        env:
          SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          expected="$(find data/encyclopedia/drafts -maxdepth 1 -type f -name '*-v1.json' | wc -l | tr -d ' ')"
          set +e
          output="$(node scripts/import_disability_encyclopedia_review.mjs --apply --expect-count "$expected" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -ne 0
          printf '%s' "$output" | grep -q 'required for --apply'
