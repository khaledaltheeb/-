name: Vendor Addiction Atlas Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawafid-addiction-atlas-vendor
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vendor immutable reviewed atlas snapshot
        run: node scripts/vendor-addiction-atlas.mjs
      - name: Prepare review artifact
        id: review
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/addiction-atlas)" ]; then
            echo 'Verified addiction atlas snapshot is already current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/addiction-atlas-review
          git diff --binary -- data/addiction-atlas > /tmp/addiction-atlas-review/addiction-atlas-snapshot.patch
          git status --short -- data/addiction-atlas > /tmp/addiction-atlas-review/status.txt
          cp docs/.addiction-atlas-continuity.md /tmp/addiction-atlas-review/continuity.md 2>/dev/null || true
          echo 'Scientific snapshot changes prepared for review only; nothing was pushed to main.'
      - name: Upload snapshot review artifact
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: addiction-atlas-snapshot-review-${{ github.run_id }}
          path: /tmp/addiction-atlas-review/
          if-no-files-found: error
          retention-days: 14
