name: Fix Rawafid Symptom Prefs Once
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths:
      - ".github/workflows/android-fix-symptom-prefs-once.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/rawafid-app-v1
          fetch-depth: 0
      - name: Fix symptom journal getter syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/src/main/java/org/healthrenewal/rawafid/SecurePrefs.java')
          text=p.read_text(encoding='utf-8')
          bad='return SymptomJournal.decode(getString("symptom_journal","");'
          good='return SymptomJournal.decode(getString("symptom_journal",""));'
          if bad not in text:
              raise SystemExit('expected syntax pattern not found')
          p.write_text(text.replace(bad,good,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/org/healthrenewal/rawafid/SecurePrefs.java
          git commit -m "fix(android): correct symptom journal encrypted getter"
          git push origin HEAD:android/rawafid-app-v1
