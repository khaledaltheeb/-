name: Agent Final Hardening Diagnostic
on:
  push:
    branches:
      - agent/complete-recovery-program-20260826
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-recovery-program-20260826
      - name: Capture hardening output
        shell: bash
        run: |
          set +e
          node scripts/final-hardening-check.mjs > /tmp/final-hardening.log 2>&1
          status=$?
          mkdir -p docs
          {
            echo "exit_status=$status"
            cat /tmp/final-hardening.log
          } > docs/.agent-final-hardening.log
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.agent-final-hardening.log
          if ! git diff --cached --quiet; then
            git commit -m 'chore(agent): capture hardening diagnostic [skip ci]'
            git push origin HEAD:agent/complete-recovery-program-20260826
          fi
