name: Kids Lab Render QA

on:
  pull_request:
    paths:
      - 'lib/capabilities/**'
      - 'app/capabilities/kids-lab/**'
      - 'scripts/kids-lab-render-contract*.mjs'
      - '.github/workflows/kids-lab-render-qa.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Render and validate all 1000 Kids Lab items
        run: node scripts/kids-lab-render-contract-final.mjs

      - name: Upload QA report and SVG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-lab-render-qa
          path: artifacts/kids-lab-qa
          if-no-files-found: warn
          retention-days: 14
