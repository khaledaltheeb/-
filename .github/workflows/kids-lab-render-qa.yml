name: Kids Lab Render QA

on:
  pull_request:
    paths:
      - 'lib/capabilities/**'
      - 'app/capabilities/kids-lab/**'
      - 'scripts/kids-lab-*.mjs'
      - '.github/workflows/kids-lab-render-qa.yml'
      - 'eslint.config.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint Kids Lab live route checker
        run: npx eslint scripts/kids-lab-live-route-check.mjs --quiet

      - name: Require build-time static worksheet image routes
        run: node scripts/kids-lab-static-image-contract.mjs

      - name: Validate all Kids Lab routes, levels and tests
        run: node scripts/kids-lab-route-contract.mjs

      - name: Render and validate all 1000 Kids Lab items
        run: node scripts/kids-lab-render-contract-final.mjs

      - name: Upload Kids Lab QA reports and SVG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-lab-qa
          path: |
            artifacts/kids-lab-routes
            artifacts/kids-lab-qa
          if-no-files-found: warn
          retention-days: 14
