name: Kids Lab Render QA

on:
  pull_request:
    paths:
      - 'lib/capabilities/**'
      - 'app/capabilities/kids-lab/**'
      - 'scripts/kids-lab-*.mjs'
      - 'scripts/export-kids-lab-static-svg.mjs'
      - 'scripts/materialize-kids-lab-static-html.mjs'
      - 'scripts/cloudflare-production-build.sh'
      - 'custom-worker.js'
      - '.github/open-next-production-cache.config.ts'
      - '.github/workflows/kids-lab-render-qa.yml'
      - '.github/workflows/deploy-production.yml'
      - 'eslint.config.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install production image runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core librsvg2-bin

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint Kids Lab live route checker
        run: npx eslint scripts/kids-lab-live-route-check.mjs scripts/export-kids-lab-static-svg.mjs scripts/materialize-kids-lab-static-html.mjs --quiet

      - name: Require build-time static worksheet image routes
        run: node scripts/kids-lab-static-image-contract.mjs

      - name: Validate all Kids Lab routes, levels and tests
        run: node scripts/kids-lab-route-contract.mjs

      - name: Render and validate all 1000 Kids Lab items
        run: node scripts/kids-lab-render-contract-final.mjs

      - name: Build exact production Worker and materialize Kids Lab assets
        run: npx opennextjs-cloudflare build --env production --openNextConfigPath .github/open-next-production-cache.config.ts

      - name: Verify deployed production asset counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/kids-lab-assets -type f -name '*.svg' | wc -l)" -eq 1000
          test "$(find .open-next/assets/kids-lab-assets -type f -name '*.svg' | wc -l)" -eq 1000
          test "$(find .open-next/assets/capabilities/kids-lab -type f -name 'index.html' | wc -l)" -ge 1000
          test "$(find .open-next/assets/capabilities/kids-lab -type f -name 'index.rsc' | wc -l)" -ge 1000
          echo "Kids Lab exact production static asset fast path is materialized."
          echo "OpenNext asset files: $(find .open-next/assets -type f | wc -l)"

      - name: Upload Kids Lab QA reports and SVG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-lab-qa
          path: |
            artifacts/kids-lab-routes
            artifacts/kids-lab-qa
          if-no-files-found: warn
          retention-days: 14
