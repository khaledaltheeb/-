name: Research integrations

on:
  pull_request:
    paths:
      - 'lib/research-integrations/**'
      - 'app/api/v1/evidence-discovery/**'
      - 'app/api/openapi.json/**'
      - 'app/developers/**'
      - 'examples/lens-scholarly-demo/**'
      - 'docs/integrations/research-evidence.md'
      - 'docs/integrations/lens-labs.md'
      - 'scripts/research-integrations-contract.mjs'
      - 'scripts/lens-security-contract.mjs'
      - 'scripts/source-registry-v1-contract.mjs'
      - 'supabase/migrations/20260901190000_ror_source_registry_v1.sql'
      - 'supabase/migrations/20260901192000_ror_registry_explicit_deny.sql'
      - 'supabase/migrations/20260901212203_source_connection_metadata_v1.sql'
      - 'supabase/migrations/20260901215918_source_governance_provenance_v1.sql'
      - 'supabase/migrations/20260901221854_source_governance_provenance_indexes_v1.sql'
      - 'supabase/migrations/20260901223500_datacite_content_relations_v1.sql'
      - 'supabase/migrations/20260907114800_lens_scholarly_quota_guard.sql'
      - '.github/workflows/research-integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Research integration contract
        run: node scripts/research-integrations-contract.mjs
      - name: Lens database security contract
        run: node scripts/lens-security-contract.mjs
      - name: Source registry contract
        run: node scripts/source-registry-v1-contract.mjs
      - name: Repository quality coverage
        run: echo 'TypeScript, lint, Next build, and runtime smoke are enforced once by Rawafid Fast Quality Gate for every pull request.'
