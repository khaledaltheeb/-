name: Fix Daily Tools responsive overflow

on:
  push:
    branches:
      - fix/daily-tools-responsive-overflow-20260830
    paths:
      - '.github/workflows/fix-daily-tools-responsive-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/daily-tools-responsive-overflow-20260830
      - name: Constrain Daily Tools responsive surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/daily-tools-mobile-polish.css')
          text = path.read_text()
          if text.count('overflow: visible;') != 1:
              raise SystemExit(f'expected one Daily Tools visible-overflow declaration, found {text.count("overflow: visible;")}')
          text = text.replace('overflow: visible;', 'overflow: hidden;', 1)
          marker = '@media(max-width:760px) {'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one 760px media block, found {text.count(marker)}')
          responsive = '''@media(max-width:760px) {
  .daily-tools-hub > article,
  .daily-tool-page > article {
    width: 100%;
    min-width: 0;
    max-width: 100%;
  }
'''
          text = text.replace(marker, responsive, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- app/daily-tools-mobile-polish.css
          git config user.name 'rawafid-responsive-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add app/daily-tools-mobile-polish.css
          git commit -m 'Fix Daily Tools responsive overflow'
          git push origin HEAD:fix/daily-tools-responsive-overflow-20260830
