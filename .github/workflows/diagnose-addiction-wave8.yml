name: Diagnose Addiction Atlas Wave 8

on:
  push:
    branches:
      - addiction-atlas-wave8-20260827
    paths:
      - '.github/workflows/diagnose-addiction-wave8.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Print Wave 8 evidence gaps and source registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const root = 'data/addiction-atlas';
          const j = async (f) => JSON.parse(await readFile(`${root}/${f}`, 'utf8'));
          const manifest = await j('substance-waves.json');
          const waveFiles = manifest.waves.map((p) => p.split('/').pop());
          const waves = await Promise.all(waveFiles.map(j));
          const substances = waves.flatMap((w) => w.substances || []);
          const riskManifest = await j('risk-evidence-manifest.json');
          const riskFiles = riskManifest.waves.map((p) => p.split('/').pop());
          const riskWaves = await Promise.all(riskFiles.map(j));
          const covered = new Set(riskWaves.flatMap((w) => w.records || []).map((r) => r.substance_slug));
          const missing = substances.filter((s) => !covered.has(s.slug)).map((s) => ({
            slug: s.slug,
            ar: s.display_name_ar,
            en: s.display_name_en,
            class_en: s.class_en,
            evidence_grade: s.evidence_grade,
            risk: s.risk,
            sources: s.source_urls
          }));
          console.log(`TOTAL=${substances.length} COVERED=${covered.size} MISSING=${missing.length}`);
          for (const row of missing) console.log(`MISSING ${JSON.stringify(row)}`);

          const sourceFiles = ['source-registry-v1.json','source-registry-v2.json','source-registry-v3.json'];
          const sourceWaves = await Promise.all(sourceFiles.map(j));
          const sources = sourceWaves.flatMap((w) => w.sources || []);
          console.log(`SOURCES=${sources.length}`);
          for (const source of sources) console.log(`SOURCE ${JSON.stringify({id:source.id,organization:source.organization,title:source.title,url:source.url,verified_on:source.verified_on})}`);

          const interactionFiles = ['interactions-v1.json','interactions-v2.json','interactions-v3.json'];
          const interactionWaves = await Promise.all(interactionFiles.map(j));
          const interactions = interactionWaves.flatMap((w) => w.records || []);
          console.log(`INTERACTIONS=${interactions.length}`);
          for (const item of interactions) console.log(`INTERACTION ${item.id} ${item.a} ${item.b} ${item.evidence_scope} ${item.severity}`);
          NODE
