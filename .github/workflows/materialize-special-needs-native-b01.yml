name: Materialize Special Needs Native Batch 01

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/legacy_content_extract.py'
      - 'scripts/prepare_legacy_batch.py'
      - 'scripts/apply_v3_seo_contract.py'
      - 'scripts/validate_migration_payload.py'
      - 'scripts/validate_v3_release_metadata.py'
      - 'scripts/audit_special_needs_payload.py'
      - 'data/migration-batches/special-needs-native-b01.config.json'
      - '.github/workflows/materialize-special-needs-native-b01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Rawafid
        uses: actions/checkout@v7

      - name: Checkout legacy source read-only
        uses: actions/checkout@v7
        with:
          repository: khaledaltheeb/healthrenewal.org
          ref: main
          path: legacy-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Extract legacy source contract
        run: >-
          python scripts/legacy_content_extract.py legacy-source
          --output artifacts/legacy-content-inventory.json
          --summary artifacts/legacy-content-summary.json

      - name: Materialize native special-needs batch
        run: >-
          python scripts/prepare_legacy_batch.py
          artifacts/legacy-content-inventory.json
          data/migration-batches/special-needs-native-b01.config.json
          --legacy-root legacy-source
          --output artifacts/special-needs-native-b01.json

      - name: Apply V3 SEO release contract
        run: >-
          python scripts/apply_v3_seo_contract.py
          artifacts/special-needs-native-b01.json
          data/migration-batches/special-needs-native-b01.config.json

      - name: Validate migration payload
        run: python scripts/validate_migration_payload.py artifacts/special-needs-native-b01.json

      - name: Validate V3 release metadata
        run: python scripts/validate_v3_release_metadata.py artifacts/special-needs-native-b01.json

      - name: Audit native path, depth, references and redirect policy
        run: python scripts/audit_special_needs_payload.py artifacts/special-needs-native-b01.json --min-words 2400

      - name: Upload audited payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-needs-native-b01
          path: |
            artifacts/special-needs-native-b01.json
            artifacts/legacy-content-summary.json
          if-no-files-found: error
          retention-days: 14
