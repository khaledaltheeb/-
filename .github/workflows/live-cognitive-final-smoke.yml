name: Live Cognitive Final Smoke

on:
  push:
    branches:
      - agent/live-cognitive-final-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Probe transient cognitive routes in isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://main-rawafid-platform-staging.khaledaltheeb.workers.dev"
          for slug in word-categories working-memory-updating; do
            failures=0
            for i in $(seq 1 10); do
              code="$(curl -sS --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 45 -o /tmp/body -w '%{http_code}' "$BASE/cognitive-lab/$slug")"
              echo "$slug attempt=$i HTTP=$code"
              if [ "$code" != "200" ]; then failures=$((failures+1)); fi
              if [ "$code" = "200" ] && ! grep -q 'تعليمي غير تشخيصي' /tmp/body; then failures=$((failures+1)); fi
              sleep 1
            done
            test "$failures" -eq 0
            echo "ISOLATED_RELIABILITY_$slug=10/10_PASS"
          done
          echo "ISOLATED_TRANSIENT_PROBE=PASS"
