name: Capture production bundle hotspots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-production-bundle-hotspots.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: capture-production-bundle-hotspots
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
  NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
  NEXT_PUBLIC_ALLOW_INDEXING: 'true'
  NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'analyze/bundle-hotspots' --arg description 'Capturing largest production bundle chunks' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Collect hotspot files and signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle-hotspots/chunks bundle-hotspots/meta
          cp .open-next/server-functions/default/handler.mjs.meta.json bundle-hotspots/meta/
          find .open-next/server-functions/default/.next/server/chunks -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -n 12 > bundle-hotspots/largest-chunks.txt
          while read -r bytes path; do
            cp --parents "$path" bundle-hotspots/chunks/
          done < bundle-hotspots/largest-chunks.txt
          find .open-next/server-functions/default/.next/server -maxdepth 2 -type f \( -name '*manifest*.json' -o -name '*.nft.json' \) -print0 | xargs -0 -r cp --parents -t bundle-hotspots/meta/
          echo '--- likely source/module markers in top 3 chunks ---' | tee bundle-hotspots/signatures.txt
          head -n 3 bundle-hotspots/largest-chunks.txt | while read -r bytes path; do
            echo "### $bytes $path" | tee -a bundle-hotspots/signatures.txt
            grep -Eo '([A-Za-z0-9_.@-]+/){2,}[A-Za-z0-9_./@\[\]-]+\.(ts|tsx|js|jsx|json|mjs|cjs)' "$path" | sort | uniq -c | sort -nr | head -n 250 | tee -a bundle-hotspots/signatures.txt || true
            echo '-- frequent long quoted fragments --' | tee -a bundle-hotspots/signatures.txt
            grep -Eo '"[^"\\]{80,}"' "$path" | head -n 200 | tee -a bundle-hotspots/signatures.txt || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundle-hotspots
          path: bundle-hotspots
          if-no-files-found: error
          retention-days: 2
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Production bundle hotspots captured'; else state=failure; description='Production bundle hotspot capture failed'; fi
          payload="$(jq -n --arg state "$state" --arg context 'analyze/bundle-hotspots' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
