name: Verify Rawafid Assistant Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-rawafid-assistant-production.yml'
      - 'deploy/rawafid-assistant-verification.trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe production responses
        shell: bash
        run: |
          set -uo pipefail
          base='https://healthrenewal.org'
          dir='/tmp/rawafid-production-diagnostics'
          mkdir -p "$dir"
          : > "$dir/http-status.txt"

          fetch_page() {
            local label="$1"
            local output="$2"
            shift 2
            local code
            code="$(curl -sS --compressed --max-time 30 -w '%{http_code}' -o "$output" "$@")" || code="curl-error:${?}"
            printf '%s\t%s\n' "$label" "$code" >> "$dir/http-status.txt"
          }

          fetch_page homepage "$dir/home.html" -H 'Cache-Control: no-cache, no-store' "${base}/?rawafid-assistant-diagnostic=${GITHUB_SHA}-$(date +%s)"
          fetch_page reading "$dir/reading.json" --get "${base}/api/search/v3" --data-urlencode 'q=كيف اساعد طفلي على القراءة' --data-urlencode 'limit=6'
          fetch_page dialect "$dir/dialect.json" --get "${base}/api/search/v3" --data-urlencode 'q=طفلي ما بحكي' --data-urlencode 'limit=6'
          fetch_page composite "$dir/v2-composite.json" --get "${base}/api/search/v3" --data-urlencode 'q=طفلي عمره 4 سنوات يفهم الكلام لكنه لا يتكلم جيدا ماذا افعل' --data-urlencode 'limit=6'
          fetch_page comparison "$dir/v2-comparison.json" --get "${base}/api/search/v3" --data-urlencode 'q=الفرق بين التوحد وتأخر الكلام' --data-urlencode 'limit=6'
          fetch_page clarification "$dir/v2-clarification.json" --get "${base}/api/search/v3" --data-urlencode 'q=ماذا افعل' --data-urlencode 'limit=6'
          fetch_page contextual "$dir/contextual.json" --get "${base}/api/search/v3" --data-urlencode 'q=وماذا عن العلاج' --data-urlencode 'context=علامات التوحد || كيف اعرف التوحد' --data-urlencode 'limit=6'
          fetch_page social "$dir/social.json" --get "${base}/api/search/v3" --data-urlencode 'q=أخلاقيات العمل الاجتماعي' --data-urlencode 'limit=6'
          fetch_page emergency "$dir/emergency.json" --get "${base}/api/search/v3" --data-urlencode 'q=تناولت جرعة زائدة وفقدت الوعي ماذا افعل' --data-urlencode 'limit=6'

      - name: Evaluate strict production assertions
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '/tmp/rawafid-production-diagnostics';
          const failures = [];
          const summary = { checked_at: new Date().toISOString(), stages: {} };
          const fail = (stage, message, extra) => failures.push({ stage, message, ...(extra === undefined ? {} : { extra }) });
          const text = (name, stage) => { try { return fs.readFileSync(`${dir}/${name}`, 'utf8'); } catch (e) { fail(stage, `missing ${name}`, String(e)); return ''; } };
          const json = (name, stage) => { const raw = text(name, stage); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { fail(stage, `invalid JSON ${name}`, { error: String(e), prefix: raw.slice(0,300) }); return null; } };
          const summarize = (stage, d) => { if (!d) return; summary.stages[stage] = { mode:d.mode??null, intent:d.analysis?.intent??null, topics:d.analysis?.topics??[], topic_labels:d.analysis?.topic_labels??[], subject:d.analysis?.subject??null, age:d.analysis?.age??null, clarification:d.analysis?.clarifying_question??null, result_count:Array.isArray(d.results)?d.results.length:null, answer_points:Array.isArray(d.answer?.points)?d.answer.points.map((p)=>({title:p.title,destination:p.destination})):[] }; };

          const statuses = text('http-status.txt','http-status').trim().split('\n').filter(Boolean);
          summary.http_status = statuses;
          for (const line of statuses) {
            const [label, code] = line.split('\t');
            if (code !== '200') fail('http-status', `${label} returned ${code}`);
          }

          const home = text('home.html','homepage');
          if (!home.includes('فتح مساعد روافد')) fail('homepage','assistant launcher missing');
          const canonical = [...home.matchAll(/<link\b[^>]*>/gi)].map((m)=>m[0]).find((tag)=>/\brel=["']canonical["']/i.test(tag));
          if (!canonical || !/\bhref=["']https:\/\/healthrenewal\.org\/?["']/i.test(canonical)) fail('homepage','production canonical invalid',canonical);
          if ([...home.matchAll(/<meta\b[^>]*>/gi)].map((m)=>m[0]).filter((tag)=>/\bname=["'](?:robots|googlebot)["']/i.test(tag)).some((tag)=>/\bcontent=["'][^"']*noindex/i.test(tag))) fail('homepage','production homepage is noindex');

          const reading = json('reading.json','reading'); summarize('reading',reading);
          if (reading && (!String(reading.mode||'').includes('zero-api') || !Array.isArray(reading.results) || !reading.results.length)) fail('reading','zero-api retrieval failed');

          const dialect = json('dialect.json','dialect'); summarize('dialect',dialect);
          if (dialect) {
            if (!Array.isArray(dialect.analysis?.topics) || !dialect.analysis.topics.includes('speech-language')) fail('dialect','speech-language topic not structurally recognized',dialect.analysis);
            if (dialect.analysis?.subject !== 'child') fail('dialect','child subject not preserved',dialect.analysis?.subject);
            if (String(dialect.mode||'').includes('zero-api-clarification') && !/عمر/.test(String(dialect.analysis?.clarifying_question||''))) fail('dialect','generic clarification used instead of age-specific clarification',dialect.analysis?.clarifying_question);
          }

          const composite = json('v2-composite.json','v2-composite'); summarize('v2-composite',composite);
          if (composite) {
            if (composite.analysis?.age !== 4) fail('v2-composite','age understanding failed',composite.analysis?.age);
            if (!composite.analysis?.topics?.includes('speech-language')) fail('v2-composite','speech-language topic missing',composite.analysis?.topics);
            if (!Array.isArray(composite.results) || !composite.results.length || !composite.answer?.summary) fail('v2-composite','results or direct summary missing');
          }

          const comparison = json('v2-comparison.json','v2-comparison'); summarize('v2-comparison',comparison);
          if (comparison && (comparison.analysis?.intent !== 'comparison' || !comparison.analysis?.topics?.includes('autism') || !comparison.analysis?.topics?.includes('speech-language'))) fail('v2-comparison','comparison understanding failed',comparison.analysis);

          const clarification = json('v2-clarification.json','v2-clarification'); summarize('v2-clarification',clarification);
          if (clarification && (!String(clarification.mode||'').includes('zero-api-clarification') || !clarification.analysis?.clarifying_question)) fail('v2-clarification','vague-query clarification failed');

          const contextual = json('contextual.json','contextual'); summarize('contextual',contextual);
          if (contextual && (contextual.contextual !== true || !/توحد/.test(String(contextual.resolved_query||'')) || !contextual.analysis?.topics?.includes('autism'))) fail('contextual','contextual autism follow-up failed',{contextual:contextual.contextual,resolved_query:contextual.resolved_query,topics:contextual.analysis?.topics});

          const social = json('social.json','social-work'); summarize('social-work',social);
          if (social) {
            if (!social.analysis?.topics?.includes('social-work')) fail('social-work','social-work topic missing',social.analysis?.topics);
            const points = Array.isArray(social.answer?.points) ? social.answer.points : [];
            if (!points.length) fail('social-work','grounded answer points missing');
            const bad = points.filter((p)=>!String(p.destination||'').startsWith('/evidence-guides/social-work/'));
            if (bad.length) fail('social-work','answer contains off-topic evidence',bad);
          }

          const emergency = json('emergency.json','emergency'); summarize('emergency',emergency);
          if (emergency) {
            if (emergency.analysis?.intent !== 'safety') fail('emergency','intent must be safety exactly',emergency.analysis?.intent);
            if (emergency.analysis?.clarifying_question) fail('emergency','safety query must not be delayed by clarification',emergency.analysis.clarifying_question);
          }

          for (const [stage,value] of [['reading',reading],['dialect',dialect],['v2-composite',composite],['v2-comparison',comparison],['contextual',contextual],['social-work',social],['emergency',emergency]]) {
            if (value && /openai|anthropic|gemini/i.test(JSON.stringify(value))) fail(stage,'external AI provider marker present');
          }

          summary.failures = failures;
          fs.writeFileSync(`${dir}/summary.json`, JSON.stringify(summary,null,2));
          fs.writeFileSync(`${dir}/failures.txt`, failures.length ? failures.map((x)=>`${x.stage}: ${x.message}${x.extra===undefined?'':` | ${JSON.stringify(x.extra)}`}`).join('\n')+'\n' : 'PASS\n');
          console.log(JSON.stringify(summary,null,2));
          process.exit(failures.length ? 1 : 0);
          NODE
          exit $?

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawafid-assistant-production-diagnostics-${{ github.sha }}
          path: /tmp/rawafid-production-diagnostics
          if-no-files-found: error
          retention-days: 7
