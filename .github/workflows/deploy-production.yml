name: Deploy Production

# POST-CUTOVER PRODUCTION GUARD:
# healthrenewal.org is the canonical production origin. Routine deployment must
# preserve public URLs, editorial readiness, SEO/discovery quality, analytics,
# and Cloudflare routing. The 10,000-URL objective remains a measured growth
# target, not a prerequisite for deploying safe improvements to the live domain.
on:
  workflow_dispatch:

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      SEO_GATE_BASE_URL: http://127.0.0.1:3000
      SEO_GATE_CONCURRENCY: '12'
      SEO_GATE_TIMEOUT_MS: '20000'
      SEO_GATE_PAGE_ATTEMPTS: '3'
      SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
      SEO_TARGET_URLS: '10000'
      SEO_REQUIRE_TARGET: 'false'
      SEO_RICH_MIN_WORDS: '100'
      EDITORIAL_REQUIRE_READY: 'true'
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error title=Cloudflare authentication unavailable::Repository Actions secret CLOUDFLARE_API_TOKEN is not configured.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install deterministic Arabic image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fontconfig fonts-noto-core librsvg2-bin
          convert -version
          rsvg-convert --version
          fc-match 'Noto Sans Arabic'
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture contracts
        run: npm run architecture-check
      - name: Live public and sitemap preservation gate
        run: npm run live-preservation:validate
      - name: Verify production SEO and analytics origin contract
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" = "https://healthrenewal.org"
          test "${NEXT_PUBLIC_ALLOW_INDEXING}" = "true"
          test "${NEXT_PUBLIC_ENABLE_ANALYTICS}" = "true"
          test "${NEXT_PUBLIC_GTM_ID}" = "GTM-WBLQVBG4"
          test "${NEXT_PUBLIC_GA_MEASUREMENT_ID}" = "G-VLZMV8Y4JP"
          test "${NEXT_PUBLIC_ENABLE_DIRECT_GA}" = "true"
          grep -q "PRODUCTION_SITE_URL = 'https://healthrenewal.org'" lib/seo.ts
          grep -q '"production"' wrangler.jsonc
          grep -Fq '"pattern": "healthrenewal.org/*"' wrangler.jsonc
          grep -Fq '"pattern": "www.healthrenewal.org/*"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_ENABLE_ANALYTICS": "true"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GTM_ID": "GTM-WBLQVBG4"' wrangler.jsonc
          grep -q '"NEXT_PUBLIC_GA_MEASUREMENT_ID": "G-VLZMV8Y4JP"' wrangler.jsonc
      - name: Verify Cloudflare credentials and account access
        shell: bash
        run: |
          set -euo pipefail
          if ! auth_output="$(npx wrangler whoami 2>&1)"; then
            printf '%s\n' "$auth_output" >&2
            exit 1
          fi
          printf '%s\n' "$auth_output"
          if printf '%s' "$auth_output" | grep -Eqi 'not authenticated|wrangler login|not logged in'; then
            echo 'Wrangler did not authenticate with the configured API token.' >&2
            exit 1
          fi
      - name: Build local production candidate
        run: npm run build
      - name: Start local production candidate server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-production-candidate.log 2>&1 &
          echo "$!" > /tmp/rawafid-production-candidate.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-production-candidate.log >&2 || true
            exit 1
          fi
      - name: Production candidate smoke tests
        run: npm run smoke
      - name: Editorial SEO readiness gate
        run: node scripts/editorial-seo-readiness.mjs
      - name: Sitemap and canonical readiness report
        run: node scripts/seo-readiness-report.mjs
      - name: Full sitemap SEO gate
        run: node scripts/seo-gate.mjs
      - name: Rich discovery gate
        run: node scripts/rich-discovery-gate.mjs
      - name: Content richness gate
        run: node scripts/content-richness-gate.mjs
      - name: Stop local production candidate server
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/rawafid-production-candidate.pid ]; then
            kill "$(cat /tmp/rawafid-production-candidate.pid)" 2>/dev/null || true
          fi
      - name: Build Cloudflare Worker with OpenNext production environment
        env:
          NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
          NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
          NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
          NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy Cloudflare Worker with OpenNext production environment
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify production discovery analytics canonical host addiction atlas and www redirect
        shell: bash
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SITE_URL}"
          stamp="${GITHUB_SHA}"
          robots="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/robots.txt?deploy=${stamp}")"
          printf '%s' "${robots}" | grep -q "Sitemap: ${base}/sitemap.xml"
          root_sitemap="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/sitemap.xml?deploy=${stamp}")"
          printf '%s' "${root_sitemap}" | grep -q '/sitemaps/addiction-atlas.xml'
          sitemap="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/sitemaps/content.xml?page=0&deploy=${stamp}")"
          printf '%s' "${sitemap}" | grep -q '<url>'
          if printf '%s' "${sitemap}" | grep -q 'workers.dev'; then
            echo 'Production sitemap leaked a temporary workers.dev URL.' >&2
            exit 1
          fi
          atlas_sitemap="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/sitemaps/addiction-atlas.xml?deploy=${stamp}")"
          printf '%s' "${atlas_sitemap}" | grep -q '/addiction/substances/fentanyl/'
          printf '%s' "${atlas_sitemap}" | grep -q '/addiction/compare/fentanyl-vs-heroin/'
          printf '%s' "${atlas_sitemap}" | grep -q '/addiction/methodology/'
          if printf '%s' "${atlas_sitemap}" | grep -q 'workers.dev'; then
            echo 'Addiction atlas sitemap leaked a temporary workers.dev URL.' >&2
            exit 1
          fi
          home="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/?deploy=${stamp}")"
          printf '%s' "${home}" | grep -q "rel=\"canonical\" href=\"${base}/\""
          printf '%s' "${home}" | grep -q 'GTM-WBLQVBG4'
          printf '%s' "${home}" | grep -q 'G-VLZMV8Y4JP'
          if printf '%s' "${home}" | grep -qi 'noindex'; then
            echo 'Production homepage is unexpectedly noindex.' >&2
            exit 1
          fi
          atlas="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/addiction/substances/?deploy=${stamp}")"
          printf '%s' "${atlas}" | grep -q 'Fentanyl'
          printf '%s' "${atlas}" | grep -q 'Heroin'
          if printf '%s' "${atlas}" | grep -qi 'noindex'; then
            echo 'Production addiction atlas hub is unexpectedly noindex.' >&2
            exit 1
          fi
          fentanyl="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/addiction/substances/fentanyl/?deploy=${stamp}")"
          printf '%s' "${fentanyl}" | grep -q 'Fentanyl'
          printf '%s' "${fentanyl}" | grep -q 'MedicalWebPage'
          if printf '%s' "${fentanyl}" | grep -qi 'noindex'; then
            echo 'Production Fentanyl atlas page is unexpectedly noindex.' >&2
            exit 1
          fi
          comparison="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/addiction/compare/fentanyl-vs-heroin/?deploy=${stamp}")"
          printf '%s' "${comparison}" | grep -q 'Fentanyl'
          printf '%s' "${comparison}" | grep -q 'Heroin'
          printf '%s' "${comparison}" | grep -q 'Article'
          if printf '%s' "${comparison}" | grep -qi 'noindex'; then
            echo 'Production Fentanyl versus Heroin comparison is unexpectedly noindex.' >&2
            exit 1
          fi
          methodology="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/addiction/methodology/?deploy=${stamp}")"
          printf '%s' "${methodology}" | grep -q 'قوة الدليل'
          if printf '%s' "${methodology}" | grep -qi 'noindex'; then
            echo 'Production addiction atlas methodology is unexpectedly noindex.' >&2
            exit 1
          fi
          www_headers="$(curl -sS -o /dev/null -D - --retry 8 --retry-delay 3 --retry-all-errors 'https://www.healthrenewal.org/sections?production-check=1')"
          printf '%s' "${www_headers}" | head -n 1 | grep -Eq ' 308( |$)'
          printf '%s' "${www_headers}" | grep -Eqi '^location: https://healthrenewal\.org/sections\?production-check=1\r?$'
