name: Deploy Production

# CUTOVER GUARD: healthrenewal.org must not be switched to the new Rawafid build
# until this workflow proves >=10,000 unique canonical public URLs and every
# sitemap URL passes the production SEO and rich-discovery gates.
on:
  workflow_dispatch:

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error title=Cloudflare authentication unavailable::Repository Actions secret CLOUDFLARE_API_TOKEN is not configured.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture contracts
        run: npm run architecture-check
      - name: Verify production SEO origin contract
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" = "https://healthrenewal.org"
          test "${NEXT_PUBLIC_ALLOW_INDEXING}" = "true"
          grep -q "PRODUCTION_SITE_URL = 'https://healthrenewal.org'" lib/seo.ts
          grep -q '"production"' wrangler.jsonc
          grep -q '"pattern": "healthrenewal.org"' wrangler.jsonc
          grep -q '"pattern": "www.healthrenewal.org"' wrangler.jsonc
          grep -q '"custom_domain": true' wrangler.jsonc
      - name: Verify Cloudflare credentials and account access
        shell: bash
        run: |
          set -euo pipefail
          if ! auth_output="$(npx wrangler whoami 2>&1)"; then
            printf '%s\n' "$auth_output" >&2
            exit 1
          fi
          printf '%s\n' "$auth_output"
          if printf '%s' "$auth_output" | grep -Eqi 'not authenticated|wrangler login|not logged in'; then
            echo 'Wrangler did not authenticate with the configured API token.' >&2
            exit 1
          fi
      - name: Build local production candidate for cutover gate
        run: npm run build
      - name: Require 10000 fully-audited canonical URLs before cutover
        shell: bash
        env:
          CUTOVER_BASE_URL: http://127.0.0.1:3000
          CUTOVER_CANONICAL_ORIGIN: https://healthrenewal.org
          CUTOVER_MIN_INDEXABLE_URLS: '10000'
          SEO_GATE_BASE_URL: http://127.0.0.1:3000
          SEO_GATE_CONCURRENCY: '12'
          SEO_GATE_TIMEOUT_MS: '20000'
          SEO_GATE_PAGE_ATTEMPTS: '3'
          SEO_GATE_PAGE_RETRY_DELAY_MS: '300'
          SEO_TARGET_URLS: '10000'
          SEO_REQUIRE_TARGET: 'true'
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rawafid-cutover-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rawafid-cutover-server.log >&2 || true
            exit 1
          fi
          node scripts/healthrenewal-cutover-readiness.mjs
          node scripts/seo-readiness-report.mjs
          node scripts/seo-gate.mjs
          node scripts/rich-discovery-gate.mjs
      - name: Build Cloudflare Worker with OpenNext production environment
        env:
          NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy Cloudflare Worker with OpenNext production environment
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify production discovery canonical host and www redirect
        shell: bash
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SITE_URL}"
          stamp="${GITHUB_SHA}"
          robots="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/robots.txt?deploy=${stamp}")"
          printf '%s' "${robots}" | grep -q "Sitemap: ${base}/sitemap.xml"
          sitemap="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/sitemaps/content.xml?page=0&deploy=${stamp}")"
          printf '%s' "${sitemap}" | grep -q '<url>'
          if printf '%s' "${sitemap}" | grep -q 'workers.dev'; then
            echo 'Production sitemap leaked a temporary workers.dev URL.' >&2
            exit 1
          fi
          home="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/?deploy=${stamp}")"
          printf '%s' "${home}" | grep -q "rel=\"canonical\" href=\"${base}/\""
          if printf '%s' "${home}" | grep -qi 'noindex'; then
            echo 'Production homepage is unexpectedly noindex.' >&2
            exit 1
          fi
          www_headers="$(curl -sS -o /dev/null -D - --retry 8 --retry-delay 3 --retry-all-errors 'https://www.healthrenewal.org/sections?cutover-check=1')"
          printf '%s' "${www_headers}" | head -n 1 | grep -Eq ' 308( |$)'
          printf '%s' "${www_headers}" | grep -Eqi '^location: https://healthrenewal\.org/sections\?cutover-check=1\r?$'
