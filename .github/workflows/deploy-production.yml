name: Deploy Production

# Manual fallback only. The live Rawafid Worker is deployed from
# cloudflare-workers-deploy by Cloudflare Workers Builds Git integration.
on:
  workflow_dispatch:

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error title=Cloudflare authentication unavailable::Repository Actions secret CLOUDFLARE_API_TOKEN is not configured.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Architecture contracts
        run: npm run architecture-check
      - name: Verify Cloudflare credentials and account access
        shell: bash
        run: |
          set -euo pipefail
          if ! auth_output="$(npx wrangler whoami 2>&1)"; then
            printf '%s\n' "$auth_output" >&2
            exit 1
          fi
          printf '%s\n' "$auth_output"
          if printf '%s' "$auth_output" | grep -Eqi 'not authenticated|wrangler login|not logged in'; then
            echo 'Wrangler did not authenticate with the configured API token.' >&2
            exit 1
          fi
      - name: Build Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare build
      - name: Deploy Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare deploy
      - name: Verify deployed indexability and nested evidence route
        shell: bash
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SITE_URL}"
          stamp="${GITHUB_SHA}"
          sitemap="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/sitemaps/content.xml?page=0&deploy=${stamp}")"
          printf '%s' "${sitemap}" | grep -q '<url>'
          page="$(curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "${base}/magazine/pediatric-oncology/studies/pediatric-neuroblastoma-racotumomab-phase2-42136000/?deploy=${stamp}")"
          printf '%s' "${page}" | grep -q 'rel="canonical"'
          printf '%s' "${page}" | grep -q 'name="robots"'
          if printf '%s' "${page}" | grep -qi 'noindex'; then
            echo 'Deployed nested evidence route is unexpectedly noindex.' >&2
            exit 1
          fi
