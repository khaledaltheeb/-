name: Deploy Production Fast

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_ENABLE_GTM: 'false'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      ENABLE_RAWAFID_ASSISTANT: 'true'
      QUICK_INFO_SOCIAL_IMAGES_REQUIRED: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - name: Require Cloudflare API token
        shell: bash
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Compute Quick Info social image fingerprint
        id: quick-info-fingerprint
        run: node scripts/quick-info-social-cache-key.mjs

      - name: Restore exact Quick Info social image cache
        id: quick-info-cache
        uses: actions/cache@v4
        with:
          path: |
            public/quick-info/og
            public/quick-info/discover
            public/quick-info/social-images-manifest.json
          key: quick-info-social-${{ runner.os }}-${{ steps.quick-info-fingerprint.outputs.fingerprint }}

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Quick Info image runtime on cache miss
        if: steps.quick-info-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core librsvg2-bin

      - name: Lint
        run: npm run lint

      - name: PageSpeed performance contract
        run: npm run performance:validate

      - name: Public API architecture contracts
        run: |
          node scripts/public-api-v1-contract.mjs
          node scripts/source-registry-v1-contract.mjs
          node scripts/research-integrations-contract.mjs

      - name: Build Cloudflare production Worker
        env:
          CI: 'false'
          QUICK_INFO_SOCIAL_CACHE_HIT: ${{ steps.quick-info-cache.outputs.cache-hit }}
        run: npx opennextjs-cloudflare build --env production --openNextConfigPath .github/open-next-production-cache.config.ts

      - name: Deploy Cloudflare production Worker
        run: npx opennextjs-cloudflare deploy --env production

      - name: Minimal live verification
        shell: bash
        run: |
          set -euo pipefail
          base="https://healthrenewal.org"
          stamp="${GITHUB_SHA}"

          echo 'LIVE_CHECK homepage'
          curl -fsS \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            --retry 6 --retry-delay 2 --retry-all-errors \
            "${base}/?deploy=${stamp}" >/tmp/home.html
          grep -q 'healthrenewal.org' /tmp/home.html
          visible_tools="$(grep -o 'toolname="[^"]*"' /tmp/home.html | sort -u | tr '\n' ' ' || true)"
          echo "WEBMCP_LIVE_DIAGNOSTIC: ${visible_tools:-homepage-ISR-may-still-serve-the-previous-render}"
          echo 'LIVE_OK homepage; strict rendered WebMCP coverage is enforced by Rawafid Fast Quality Gate'

          echo 'LIVE_CHECK robots'
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/robots.txt?deploy=${stamp}" >/tmp/robots.txt
          grep -q 'Sitemap: https://healthrenewal.org/sitemap.xml' /tmp/robots.txt
          echo 'LIVE_OK robots'

          echo 'LIVE_CHECK sitemap'
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/sitemap.xml?deploy=${stamp}" >/tmp/sitemap.xml
          echo 'LIVE_OK sitemap'

          echo 'LIVE_CHECK public API'
          curl -fsS \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            --retry 6 --retry-delay 2 --retry-all-errors \
            "${base}/api/v1" >/tmp/api-v1.json
          curl -fsS \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            --retry 6 --retry-delay 2 --retry-all-errors \
            "${base}/api/openapi.json" >/tmp/openapi.json
          node - <<'NODE'
          const fs = require('node:fs');
          const discovery = JSON.parse(fs.readFileSync('/tmp/api-v1.json', 'utf8'));
          const openapi = JSON.parse(fs.readFileSync('/tmp/openapi.json', 'utf8'));
          if (discovery.version !== '1.2.0') throw new Error('live Public API discovery version mismatch');
          if (openapi.openapi !== '3.1.0' || openapi.info?.version !== '1.2.0') throw new Error('live OpenAPI version mismatch');
          NODE
          echo 'LIVE_OK public API'

          echo 'LIVE_CHECK Quick Info social images'
          quick_info_slug="$(node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('public/quick-info/social-images-manifest.json', 'utf8'));
          const slug = manifest?.items?.[0]?.slug;
          if (!slug) process.exit(1);
          process.stdout.write(String(slug));
          NODE
          )"
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/quick-info/og/${quick_info_slug}.png?deploy=${stamp}" >/tmp/quick-info-og.png
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/quick-info/discover/${quick_info_slug}.png?deploy=${stamp}" >/tmp/quick-info-discover.png
          test -s /tmp/quick-info-og.png
          test -s /tmp/quick-info-discover.png
          echo "LIVE_OK Quick Info social images: ${quick_info_slug}"

          echo 'LIVE_CHECK assessment-lab/avoidance-cycle'
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/assessment-lab/avoidance-cycle?deploy=${stamp}" >/tmp/assessment-avoidance.html
          grep -q 'دائرة التجنب' /tmp/assessment-avoidance.html
          echo 'LIVE_OK assessment-lab/avoidance-cycle'

          echo 'LIVE_CHECK assessment-lab/mood-daily'
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors "${base}/assessment-lab/mood-daily?deploy=${stamp}" >/tmp/assessment-mood.html
          grep -q 'متابعة المزاج اليومية' /tmp/assessment-mood.html
          echo 'LIVE_OK assessment-lab/mood-daily'

          echo 'LIVE_CHECK www redirect'
          curl -fsSI --retry 6 --retry-delay 2 --retry-all-errors "https://www.healthrenewal.org/?deploy=${stamp}" >/tmp/www-redirect.headers
          grep -qi '^location: https://healthrenewal.org/' /tmp/www-redirect.headers
          echo 'LIVE_OK www redirect'

          grep -q 'G-VLZMV8Y4JP' /tmp/home.html
          grep -q 'فتح مساعد روافد' /tmp/home.html
          if grep -q 'workers.dev' /tmp/home.html /tmp/sitemap.xml; then
            echo 'Production output unexpectedly leaked a workers.dev URL.' >&2
            exit 1
          fi
          if grep -q 'GTM-WBLQVBG4' /tmp/home.html; then
            echo 'Production homepage unexpectedly loaded the disabled CPU-heavy GTM container.' >&2
            exit 1
          fi
          if grep -qi 'noindex' /tmp/home.html; then
            echo 'Production homepage is unexpectedly noindex.' >&2
            exit 1
          fi
