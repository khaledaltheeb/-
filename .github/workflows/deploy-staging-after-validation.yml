name: Deploy Validated Staging

on:
  workflow_run:
    workflows: ['Cloudflare Workers Validate']
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: rawafid-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark staging deployment pending
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"state\":\"pending\",\"context\":\"deploy/staging\",\"description\":\"Deploying validated main commit to noindex staging\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "$payload" >/dev/null

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Confirm Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler whoami

      - name: Materialize release-pinned OSS Public Review Lab
        env:
          RAWAFID_OSS_REVIEW_SHA: d55426327df49f6c7753083e3692a343d7a4d75c
        run: bash scripts/materialize-oss-review-lab.sh

      - name: Materialize generated route assets
        run: node scripts/build-daily-tools-route-manifest.mjs

      - name: Build validated staging Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy staging Worker only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars

      - name: Verify live staging and full-content renderer
        shell: bash
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SITE_URL}"
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA}-${attempt}-$(date +%s)"
            home="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/?deploy=${stamp}" 2>/dev/null || true)"
            article="$(curl -fsSL --compressed --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/content/concept-1618?deploy=${stamp}" 2>/dev/null || true)"
            about_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/about/?deploy=${stamp}" || true)"

            home_has_noindex=false
            article_has_full_body=false
            search_code=skipped
            if [[ "$home" == *"noindex"* ]]; then home_has_noindex=true; fi
            if [[ "$article" == *"أفضل خطة قد تجمع أكثر من مستوى"* ]]; then article_has_full_body=true; fi

            if [ "$home_has_noindex" = 'true' ] && [ "$article_has_full_body" = 'true' ] && [ "$about_code" = '200' ]; then
              search_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/search?q=%D8%A7%D9%84%D8%B5%D8%AD%D8%A9%20%D8%A7%D9%84%D9%86%D9%81%D8%B3%D9%8A%D8%A9&deploy=${stamp}" || true)"
            fi

            if [ "$home_has_noindex" = 'true' ] && [ "$article_has_full_body" = 'true' ] && [ "$about_code" = '200' ] && [ "$search_code" = '200' ]; then
              echo 'Validated noindex staging is live; preserved route, search route, and full-body renderer smoke checks passed.'
              exit 0
            fi
            echo "Staging verification attempt ${attempt}: noindex=${home_has_noindex}, full_body=${article_has_full_body}, about=${about_code:-none}, search=${search_code:-none}."
            sleep 5
          done
          echo 'Post-deploy staging verification failed.' >&2
          exit 1

      - name: Verify live OSS review lab byte-for-byte
        env:
          REVIEW_BASE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev/opensource/rtl-lab/
          LOCAL_REVIEW_DIR: public/opensource/rtl-lab
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const path = require('node:path');
          const base = new URL(process.env.REVIEW_BASE_URL);
          const localDir = process.env.LOCAL_REVIEW_DIR;
          const manifestBytes = readFileSync(path.join(localDir, 'artifact-manifest.json'));
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');

          async function fetchBytes(relative) {
            const response = await fetch(new URL(relative, base), {
              redirect: 'error',
              cache: 'no-store',
              headers: { 'cache-control': 'no-cache, no-store, max-age=0', 'accept-encoding': 'identity' },
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) throw new Error(`${relative} returned HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }

          const remoteManifest = await fetchBytes('artifact-manifest.json');
          if (!remoteManifest.equals(manifestBytes)) throw new Error('Remote review-site manifest does not byte-match the validated local artifact.');

          let total = 0;
          for (const entry of manifest.files) {
            const bytes = await fetchBytes(entry.path);
            if (bytes.byteLength !== entry.bytes) throw new Error(`${entry.path}: byte length mismatch.`);
            if (sha256(bytes) !== entry.sha256) throw new Error(`${entry.path}: SHA-256 mismatch.`);
            total += bytes.byteLength;
          }

          const entrypoint = await fetchBytes(manifest.entrypoint);
          if (!entrypoint.toString('utf8').includes('Content-Security-Policy')) throw new Error('Published review lab entrypoint is missing the validated CSP metadata.');
          console.log(`Public OSS review lab verified: ${manifest.files.length} files, ${total} bytes, exact manifest match for ${manifest.package.name}@${manifest.package.version}.`);
          NODE

      - name: Mark staging deployment success
        if: success()
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"deploy/staging\",\"description\":\"Validated main commit and OSS review lab deployed and verified on staging\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d "$payload" >/dev/null

      - name: Mark staging deployment failure
        if: failure()
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"failure\",\"context\":\"deploy/staging\",\"description\":\"Staging deploy or live verification failed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d "$payload" >/dev/null || true
