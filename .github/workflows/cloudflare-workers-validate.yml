name: Cloudflare Workers Validate

on:
  push:
    branches: [main, cloudflare-workers-deploy]
  pull_request:
    branches: [main]

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://rawafid-platform-staging.khaledaltheeb.workers.dev
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark validation pending
        if: github.event_name == 'push'
        shell: bash
        run: |
          post_status() {
            local context="$1"
            local description="$2"
            local payload
            payload="$(printf '{\"state\":\"pending\",\"context\":\"%s\",\"description\":\"%s\",\"target_url\":\"%s\"}' "$context" "$description" "$RUN_URL")"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          post_status 'validate/cloudflare' 'Validating Rawafid for Cloudflare Workers'
          post_status 'validate/cloudflare/code-quality' 'Waiting for code quality and live no-loss preservation gates'
          post_status 'validate/cloudflare/build' 'Waiting for OpenNext Cloudflare Worker build'
          post_status 'validate/cloudflare/dry-run' 'Waiting for Wrangler dry-run packaging'

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize release-pinned OSS Public Review Lab
        env:
          RAWAFID_OSS_REVIEW_SHA: d55426327df49f6c7753083e3692a343d7a4d75c
        run: bash scripts/materialize-oss-review-lab.sh

      - name: Materialize Daily Tools route and content assets
        run: node scripts/build-daily-tools-route-manifest.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture contracts
        run: npm run architecture-check

      - name: Live public and sitemap preservation gate
        run: npm run live-preservation:validate

      - name: Mark code quality passed
        if: github.event_name == 'push'
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"validate/cloudflare/code-quality\",\"description\":\"Code quality, architecture and live no-loss gates passed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Build Cloudflare Worker with OpenNext
        run: npx opennextjs-cloudflare build

      - name: Mark Worker build passed
        if: github.event_name == 'push'
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"validate/cloudflare/build\",\"description\":\"OpenNext Cloudflare Worker build passed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Validate Wrangler package
        run: npx wrangler deploy --dry-run

      - name: Mark Wrangler dry-run passed
        if: github.event_name == 'push'
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"validate/cloudflare/dry-run\",\"description\":\"Wrangler dry-run packaging passed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Mark validation success
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"success\",\"context\":\"validate/cloudflare\",\"description\":\"Rawafid Cloudflare validation passed\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Mark validation failure
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          payload="$(printf '{\"state\":\"failure\",\"context\":\"validate/cloudflare\",\"description\":\"Cloudflare validation failed; inspect the linked Actions run\",\"target_url\":\"%s\"}' "$RUN_URL")"
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null || true
