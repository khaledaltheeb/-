name: Wire Rawafid Privacy Center V2 Once
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths:
      - ".github/workflows/android-wire-privacy-v2-once.yml"
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/rawafid-app-v1
          fetch-depth: 0
      - name: Patch privacy center
        run: python3 scripts/patch_android_privacy_center_v2.py
      - name: Commit privacy center
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/org/healthrenewal/rawafid/MainActivity.java
          git commit -m "feat(android): disclose all local personal data in privacy center"
          git push origin HEAD:android/rawafid-app-v1
