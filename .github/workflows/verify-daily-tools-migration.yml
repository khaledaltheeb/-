name: Verify Daily Tools Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-daily-tools-migration.yml'
      - 'app/daily-tools/**'
      - 'app/sitemaps/daily-tools.xml/**'
      - 'app/sitemaps/static.xml/route.ts'
      - 'app/sitemap.xml/route.ts'
      - 'components/daily-tool-*.tsx'
      - 'components/daily-tools-directory.tsx'
      - 'components/site-header.tsx'
      - 'lib/daily-tools-*.ts'
      - 'lib/seo.ts'
      - 'scripts/daily-tools-contract.mjs'
      - 'scripts/metadata-coverage-contract.mjs'
      - 'scripts/search-appearance-contract.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-production.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
      GH_TOKEN: ${{ github.token }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark Daily Tools verification pending
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'verify/daily-tools-migration' --arg description 'Validating migrated Daily Tools on Cloudflare build' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "${payload}" >/dev/null

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install production graphics dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-core fonts-noto-extra
          command -v rsvg-convert

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify deterministic Daily Tools migration contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run daily-tools:validate
          npm run search-appearance:validate
          npm run no-migration-routing:validate

      - name: Build production Cloudflare Worker
        run: npx opennextjs-cloudflare build --env production

      - name: Wrangler production dry-run
        run: npx wrangler deploy --env production --dry-run --outdir .wrangler-daily-tools-dry-run

      - name: Mark Daily Tools verification success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state success --arg context 'verify/daily-tools-migration' --arg description 'Daily Tools migration passed code, SEO, OpenNext and Wrangler validation' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "${payload}" >/dev/null

      - name: Mark Daily Tools verification failure
        if: failure()
        shell: bash
        run: |
          payload="$(jq -n --arg state failure --arg context 'verify/daily-tools-migration' --arg description 'Daily Tools migration verification failed; inspect this Actions run' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "${payload}" >/dev/null || true
