name: Social Work Contracts Fast

on:
  pull_request:
    paths:
      - 'app/evidence-guides/social-work/**'
      - 'app/sitemaps/social-work.xml/**'
      - 'app/sitemap.xml/**'
      - 'lib/social-work-*.ts'
      - 'lib/social-work-curated/**'
      - 'data/social-work-recovery/**'
      - 'scripts/social-work-*.mjs'
      - 'scripts/recover-social-work-sector.mjs'
      - '.github/workflows/validate-social-work-curated-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-work-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Social Work domain contracts
        run: |
          node scripts/social-work-curated-foundation-contract.mjs
          node scripts/social-work-curated-rights-contract.mjs
          node scripts/social-work-curated-family-contract.mjs
          node scripts/social-work-curated-community-contract.mjs
          node scripts/social-work-curated-life-course-contract.mjs
          node scripts/social-work-curated-structural-contract.mjs
          node scripts/social-work-curated-10of10-contract.mjs
          node scripts/social-work-email-source-coverage-contract.mjs
          node scripts/social-work-institutional-contract.mjs
          node scripts/social-work-recovery-contract.mjs
          node scripts/social-work-talentia-contract.mjs
          node scripts/social-work-research-depth-contract.mjs
      - name: Build and TypeScript coverage
        run: echo 'Covered once by Rawafid Fast Quality Gate for every pull request; intentionally not duplicated here.'
