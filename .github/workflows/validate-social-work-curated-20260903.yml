name: Validate Social Work Curated 2026-09-03

on:
  pull_request:
    paths:
      - 'app/evidence-guides/social-work/**'
      - 'lib/social-work-curated/**'
      - 'lib/social-work-curated-*.ts'
      - 'lib/social-work-provenance-repair.ts'
      - 'data/social-work-recovery/**'
      - 'scripts/social-work-curated-*.mjs'
      - 'scripts/social-work-email-source-coverage-contract.mjs'
      - 'scripts/social-work-institutional-contract.mjs'
      - 'scripts/social-work-recovery-contract.mjs'
      - 'scripts/recover-social-work-sector.mjs'
      - '.github/workflows/validate-social-work-curated-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-social-work-curated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  curated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Foundation curated contract
        run: node scripts/social-work-curated-foundation-contract.mjs
      - name: Rights curated contract
        run: node scripts/social-work-curated-rights-contract.mjs
      - name: Advanced family curated contract
        run: node scripts/social-work-curated-family-contract.mjs
      - name: Community curated contract
        run: node scripts/social-work-curated-community-contract.mjs
      - name: Life-course curated contract
        run: node scripts/social-work-curated-life-course-contract.mjs
      - name: Structural curated contract
        run: node scripts/social-work-curated-structural-contract.mjs
      - name: Cross-wave 10-of-10 contract
        run: node scripts/social-work-curated-10of10-contract.mjs
      - name: Direct-email source coverage contract
        run: node scripts/social-work-email-source-coverage-contract.mjs
      - name: Institutional source contract
        run: node scripts/social-work-institutional-contract.mjs
      - name: Recovery provenance migration contract
        run: node scripts/social-work-recovery-contract.mjs
      - name: Type check
        run: npm run typecheck
