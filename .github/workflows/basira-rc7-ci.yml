name: Basira RC7 Voice and Route CI

on:
  push:
    branches:
      - agent/basira-rc7-voice-route-editor-20260910
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore proven RC6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf basira-rc7
          mkdir -p basira-rc7
          cat \
            basira_rc6_ci/parts/part00.b64 \
            basira_rc6_ci/parts/part01.b64 \
            basira_rc6_ci/parts/part02.b64 \
            basira_rc6_ci/parts/part03.b64 \
            basira_rc6_ci/parts/part04.b64 \
            basira_rc6_ci/parts/part05.b64 \
            basira_rc6_ci/parts/part06.b64 \
            | tr -d '\n\r' | base64 --decode > /tmp/basira-rc6-source.tar.gz
          echo "48757025fa6f0710c7257302287ce17e852b2539348462ead8498083cf0a0d64  /tmp/basira-rc6-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/basira-rc6-source.tar.gz -C basira-rc7
          test -f basira-rc7/build.gradle.kts
          test -f basira-rc7/app/build.gradle.kts

      - name: Apply proven RC6 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('basira-rc7/app/src/main/java/org/healthrenewal/basira/ui/Screens.kt')
          s = p.read_text()
          old = 'if (requested?.id == destination?.id) audio.speak("أنت تتجه بالفعل إلى ${requested.label}")'
          new = 'if (requested != null && requested.id == destination?.id) audio.speak("أنت تتجه بالفعل إلى ${requested.label}")'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('basira-rc7/app/src/main/java/org/healthrenewal/basira/voice/VoiceCommands.kt')
          s = p.read_text()
          old = '"خذني الى ", "وديني الى ", "روح بي الى ", "اذهب الى ", "اذهب الي ",\n            "اريد الذهاب الى ", "اريد الذهاب الي ", "وجهني الى ", "وجهني الي ",\n            "المسار الى ", "المسار الي "'
          new = '"خذني الى ", "خذني الي ", "وديني الى ", "وديني الي ", "روح بي الى ", "روح بي الي ", "اذهب الى ", "اذهب الي ",\n            "اريد الذهاب الى ", "اريد الذهاب الي ", "وجهني الى ", "وجهني الي ",\n            "المسار الى ", "المسار الي "'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('private val REMAINING_COMMANDS = setOf("كم باقي", "كم تبقى", "المتبقي", "المسافه المتبقيه", "باقي كام")', 'private val REMAINING_COMMANDS = setOf("كم باقي", "كم تبقي", "المتبقي", "المسافه المتبقيه", "باقي كام")')
          p.write_text(s)

          p = Path('basira-rc7/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('        baseline = file("lint-baseline.xml")\n', '')
          s = s.replace('disable += setOf("UnusedResources")', 'disable += setOf("UnusedResources", "OldTargetApi", "GradleDependency")')
          p.write_text(s)

          icon = Path('basira-rc7/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')
          s = icon.read_text()
          if '<monochrome ' not in s:
              s = s.replace('    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n', '    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n    <monochrome android:drawable="@drawable/ic_launcher_monochrome" />\n', 1)
          icon.write_text(s)

          mono = Path('basira-rc7/app/src/main/res/drawable/ic_launcher_monochrome.xml')
          mono.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M54,20C34,20 19,34 12,54C19,74 34,88 54,88C74,88 89,74 96,54C89,34 74,20 54,20ZM54,30C68,30 80,39 86,54C80,69 68,78 54,78C40,78 28,69 22,54C28,39 40,30 54,30Z" />
              <path android:fillColor="#000000" android:pathData="M54,38A16,16 0,1 0,54 70A16,16 0,1 0,54 38" />
              <path android:fillColor="#000000" android:pathData="M54,44L61,58L54,55L47,58Z" />
          </vector>
          ''')
          PY

      - name: Apply RC7 voice and mapping upgrade
        shell: bash
        run: |
          set -euo pipefail
          cp basira_rc7_overlay/VoiceCommands.kt basira-rc7/app/src/main/java/org/healthrenewal/basira/voice/VoiceCommands.kt
          cp basira_rc7_overlay/VoiceCommandsTest.kt basira-rc7/app/src/test/java/org/healthrenewal/basira/voice/VoiceCommandsTest.kt
          cp basira_rc7_overlay/RouteEditor.kt basira-rc7/app/src/main/java/org/healthrenewal/basira/ui/RouteEditor.kt
          cp basira_rc7_overlay/ScanScreenV2.kt basira-rc7/app/src/main/java/org/healthrenewal/basira/ui/ScanScreenV2.kt

          python3 - <<'PY'
          from pathlib import Path

          screens = Path('basira-rc7/app/src/main/java/org/healthrenewal/basira/ui/Screens.kt')
          s = screens.read_text()
          marker = 'fun ScanScreen(store: JsonStore, onSaved: (PlaceMap) -> Unit, onBack: () -> Unit) {'
          if marker not in s:
              raise SystemExit('Legacy ScanScreen marker missing')
          s = s.replace(marker, 'fun LegacyScanScreen(store: JsonStore, onSaved: (PlaceMap) -> Unit, onBack: () -> Unit) {', 1)
          s = s.replace('private fun QualityReportCard(report: MapQualityReport)', 'internal fun QualityReportCard(report: MapQualityReport)', 1)
          s = s.replace('private fun scanInstruction(points: Int, recording: Boolean)', 'internal fun scanInstruction(points: Int, recording: Boolean)', 1)
          s = s.replace('if (voiceStatus.isNotBlank()) Text(voiceStatus, fontSize = 12.sp)', 'if (voiceStatus.isNotBlank()) Text(voiceStatus, fontSize = 12.sp)\n                            OutlinedButton(onClick = onEnableVoice, modifier = Modifier.fillMaxWidth()) { Text("أعد تشغيل الاستماع") }', 1)
          s = s.replace('OutlinedButton(onClick = onRepair, modifier = Modifier.fillMaxWidth()) { Text("إصلاح جزء فقط من الخريطة") }', 'OutlinedButton(onClick = onRepair, enabled = map.route.size >= 3, modifier = Modifier.fillMaxWidth()) { Text("إصلاح جزء فقط من الخريطة") }', 1)
          screens.write_text(s)

          main = Path('basira-rc7/app/src/main/java/org/healthrenewal/basira/MainActivity.kt')
          s = main.read_text()
          s = s.replace('    var globalVoiceStatus by remember { mutableStateOf("") }\n', '    var globalVoiceStatus by remember { mutableStateOf("") }\n    var voiceRestartNonce by remember { mutableIntStateOf(0) }\n', 1)
          s = s.replace('        permissionMessage = if (granted) {\n            globalVoiceStatus = "التحكم الصوتي جاهز على الشاشة الرئيسية"', '        permissionMessage = if (granted) {\n            voiceRestartNonce += 1\n            globalVoiceStatus = "التحكم الصوتي جاهز على الشاشة الرئيسية"', 1)
          s = s.replace('        val homeVoice = remember(maps, gait) {', '        val homeVoice = remember(maps, gait, voiceRestartNonce) {', 1)
          main.write_text(s)

          gradle = Path('basira-rc7/app/build.gradle.kts')
          s = gradle.read_text().replace('versionCode = 10005', 'versionCode = 10006').replace('versionName = "1.0.0-rc6"', 'versionName = "1.0.0-rc7"')
          gradle.write_text(s)
          PY

      - name: Fetch verified EfficientDet Lite0 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p basira-rc7/app/src/main/assets
          curl -fL --retry 3 --retry-all-errors \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite" \
            -o basira-rc7/app/src/main/assets/efficientdet_lite0.tflite
          echo "0720bf247bd76e6594ea28fa9c6f7c5242be774818997dbbeffc4da460c723bb  basira-rc7/app/src/main/assets/efficientdet_lite0.tflite" | sha256sum -c -

      - name: Core smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd basira-rc7
          bash tools/run-core-smoke.sh

      - name: Android unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc7 :app:testDebugUnitTest --stacktrace 2>&1 | tee basira-rc7/unit-test.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc7 :app:lintDebug :app:lintRelease --stacktrace 2>&1 | tee basira-rc7/lint.log

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          gradle -p basira-rc7 :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee basira-rc7/build.log

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find basira-rc7/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee basira-rc7/debug-apk.sha256

      - name: Package exact RC7 source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf basira-rc7/app/build
          (cd basira-rc7 && zip -qr ../Basira-v1.0.0-rc7-source.zip .)
          sha256sum Basira-v1.0.0-rc7-source.zip > Basira-v1.0.0-rc7-source.zip.sha256

      - name: Upload Basira RC7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basira-rc7-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            basira-rc7/app/build/outputs/apk/**/*.apk
            basira-rc7/app/build/reports/**
            basira-rc7/app/build/test-results/**
            basira-rc7/unit-test.log
            basira-rc7/lint.log
            basira-rc7/build.log
            basira-rc7/debug-apk.sha256
            Basira-v1.0.0-rc7-source.zip
            Basira-v1.0.0-rc7-source.zip.sha256
