name: Agent Recovery Narrow Fix
on:
  push:
    branches:
      - agent/complete-recovery-program-20260826
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-recovery-program-20260826
      - name: Normalize table helper signature
        shell: python
        run: |
          from pathlib import Path
          path=Path('lib/editorial-evidence-guides.ts')
          text=path.read_text(encoding='utf-8')
          old="const table=(caption:string,headers:string[],rows:string[][])=>({type:'table',caption,headers,rows});"
          new="const table=(caption:string,headers:string[]|string,rows:string[][])=>({type:'table',caption,headers:Array.isArray(headers)?headers:[caption,headers],rows});"
          if old not in text:
              raise SystemExit('Expected helper signature not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/editorial-evidence-guides.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(evidence): normalize table helper input [skip ci]'
          git push origin HEAD:agent/complete-recovery-program-20260826
