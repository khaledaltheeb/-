name: Publish Addiction Atlas Wave 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-addiction-atlas-wave6.yml'

concurrency:
  group: rawafid-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
      NEXT_PUBLIC_SITE_URL: https://healthrenewal.org
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
      NEXT_PUBLIC_GTM_ID: GTM-WBLQVBG4
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-VLZMV8Y4JP
      NEXT_PUBLIC_ENABLE_DIRECT_GA: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1910e1ad3c793fd568ba1caafe34f964
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate release
        run: |
          npm run typecheck
          npm run lint
          npm run addiction-atlas:validate
          node scripts/addiction-atlas-product-contract.mjs
      - name: Verify Cloudflare credentials
        run: npx wrangler whoami
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build --env production
      - name: Deploy Cloudflare Worker
        run: npx opennextjs-cloudflare deploy --env production
      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_SHA}-$(date +%s)"
          fetch() { curl -fsSL --compressed --retry 12 --retry-delay 3 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' "$1"; }
          hub="$(fetch "${base}/addiction/?release=${stamp}")"
          atlas="$(fetch "${base}/addiction/substances/?release=${stamp}")"
          interactions="$(fetch "${base}/addiction/interactions/?release=${stamp}")"
          mortality="$(fetch "${base}/addiction/mortality/?release=${stamp}")"
          tianeptine="$(fetch "${base}/addiction/substances/tianeptine/?release=${stamp}")"
          carfentanil="$(fetch "${base}/addiction/substances/carfentanil/?release=${stamp}")"
          medetomidine="$(fetch "${base}/addiction/substances/medetomidine/?release=${stamp}")"
          atlasmap="$(fetch "${base}/sitemaps/addiction-atlas.xml?release=${stamp}")"
          grep -q 'موسوعة روافد التفاعلية' <<< "$hub"
          grep -q '57' <<< "$atlas"
          grep -q 'Tianeptine' <<< "$atlas"
          grep -q 'Carfentanil' <<< "$atlas"
          grep -q 'Medetomidine' <<< "$atlas"
          grep -q 'غير مراجع بعد' <<< "$interactions"
          grep -q '238' <<< "$mortality"
          grep -q 'كارفنتانيل' <<< "$mortality"
          grep -q 'MedicalWebPage' <<< "$tianeptine"
          grep -q 'MedicalWebPage' <<< "$carfentanil"
          grep -q 'MedicalWebPage' <<< "$medetomidine"
          grep -q '/addiction/substances/tianeptine/' <<< "$atlasmap"
          grep -q '/addiction/substances/carfentanil/' <<< "$atlasmap"
          grep -q '/addiction/substances/medetomidine/' <<< "$atlasmap"
          if grep -q 'workers.dev' <<< "$atlasmap"; then exit 1; fi
          for html in "$hub" "$atlas" "$interactions" "$mortality" "$tianeptine" "$carfentanil" "$medetomidine"; do
            lower="${html,,}"
            if [[ "$lower" =~ \<meta[^\>]*name=[\"\']robots[\"\'][^\>]*content=[\"\'][^\"\']*noindex ]] || [[ "$lower" =~ \<meta[^\>]*content=[\"\'][^\"\']*noindex[^\"\']*[\"\'][^\>]*name=[\"\']robots[\"\'] ]]; then
              exit 1
            fi
          done
          echo 'Production addiction atlas wave 6 verified successfully.'
