name: Bootstrap special-needs editorial control plane

on:
  push:
    branches:
      - agent/special-needs-demand-coverage-v1
    paths:
      - '.github/workflows/bootstrap-special-needs-control-plane.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-special-needs-control-plane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_ARCHIVE_SHA256: a73091e578a813df5b5964a544fa093b33920d6d4bb60bd49d4883d8b28016db
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconstruct deterministic archive from verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import tarfile
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_ARCHIVE_SHA256']
          blob_shas = [
              '6ca340c7a210c5d174892d56f14c983e99c160f3',
              '3db996672bd69bba674f8744406acb64f2ecc6a2',
              '6ccadb205d8654f786e98302d2ad3450ee4c9c0c',
              '621488518bcec9b7f59f6d733fb7c2caf2ce0e09',
              '097f6afef64c31f614936720b867a697db7c1465',
              'a57639a4e4140bb89fe3651b6e860368a2dd1c31',
              '664981cd99b035ef777ff46257e7421ab077e4a7',
              'e999df65b8cf32e0bdac051c04ef5c37ee972101',
              '4e696dc5ab1f210472ba454389043ed4d12da93b',
              '66ce25b08667341e2e1c4cd4a178a84d8ad592f2',
              '6b73e8afad8c19754193c2269094444cbfd64b81',
              '68e0b339024a1b98b114882c6f7f031aca54ede7',
              '289ad6126ef2e12e898ea75d4bb4aec6fc61543b',
              'c77ca2bcc95a5f9b314520abeee43364786505a3',
              '1c122e916ee409fc7487df2d57c031942191a14c',
              '7ded15de58e975e8f1f3a42022f496dc47341800',
              'ddb6ab3e6634288f27aa4a86201f1798bc04f4f9',
              '63c998ddca5176cc5b76f50d85b0577356af1227',
              'c2a670add3624879e2d351885a23c1a3f1dad016',
              '0066337f5addca234ebaa58d99dc5a14908eea89',
          ]

          chunks: list[bytes] = []
          for sha in blob_shas:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Rawafid-Control-Plane-Bootstrap/1.0',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('sha') != sha or payload.get('encoding') != 'base64':
                  raise RuntimeError(f'Unexpected Git blob response for {sha}')
              chunk = base64.b64decode(payload['content'])
              git_object = b'blob ' + str(len(chunk)).encode() + b'\0' + chunk
              actual_git_sha = hashlib.sha1(git_object).hexdigest()
              if actual_git_sha != sha:
                  raise RuntimeError(f'Git blob digest mismatch for {sha}: {actual_git_sha}')
              chunks.append(chunk)

          encoded = b''.join(chunks)
          archive = base64.b64decode(encoded, validate=True)
          actual_archive_sha = hashlib.sha256(archive).hexdigest()
          if actual_archive_sha != expected:
              raise RuntimeError(
                  f'Archive SHA-256 mismatch: expected {expected}, got {actual_archive_sha}'
              )

          archive_path = pathlib.Path('/tmp/rawafid-control-plane.tar.xz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, mode='r:xz') as package:
              package.extractall(path='.', filter='data')

          print(json.dumps({
              'blob_count': len(blob_shas),
              'encoded_bytes': len(encoded),
              'archive_bytes': len(archive),
              'archive_sha256': actual_archive_sha,
          }, ensure_ascii=False))
          PY
      - name: Validate extracted control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_editorial_demand_control_plane.py \
            scripts/validate_editorial_demand_control_plane.py \
            scripts/create_editorial_demand_audit_workbook.py
          python scripts/validate_editorial_demand_control_plane.py \
            --payload data/editorial-demand/editorial-demand.v1.json.xz \
            --summary data/editorial-demand/editorial-demand.v1.summary.json \
            --crosswalk-json data/editorial-demand/editorial-topic-crosswalk.v1.json.xz \
            --crosswalk-csv data/editorial-demand/editorial-topic-crosswalk.v1.csv \
            --batch-plan data/editorial-demand/special-needs-inclusive-batch-001.plan.json \
            --reconciliation data/editorial-demand/legacy-inventory-reconciliation.v1.json
      - name: Commit materialized control plane
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-special-needs-control-plane.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Add special-needs editorial demand control plane'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
