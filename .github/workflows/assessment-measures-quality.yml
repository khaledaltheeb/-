name: Assessment Measures Quality

on:
  pull_request:
    paths:
      - 'app/assessment-lab/**'
      - 'app/core-outcome-sets/**'
      - 'app/assessment-measures/**'
      - 'app/search/page.tsx'
      - 'lib/assessment-measures*.ts'
      - 'lib/assessment-measure-operational*.ts'
      - 'lib/core-outcome-sets/**'
      - 'components/assessment-measures.module.css'
      - 'components/assessment-measure-operational-form.tsx'
      - 'components/measure-print-button.tsx'
      - 'components/site-header.tsx'
      - 'app/sitemaps/static.xml/route.ts'
      - 'scripts/assessment-measures-contract.mjs'
      - 'scripts/assessment-measures-operational-contract.mjs'
      - 'scripts/assessment-measures-operational-wave3-contract.mjs'
      - 'scripts/assessment-measures-operational-wave4-contract.mjs'
      - 'scripts/assessment-measures-operational-wave5-contract.mjs'
      - 'scripts/assessment-measures-operational-wave6-contract.mjs'
      - 'scripts/assessment-measures-operational-wave7-contract.mjs'
      - 'scripts/assessment-measures-operational-wave8-contract.mjs'
      - 'scripts/assessment-measures-operational-wave9-contract.mjs'
      - 'scripts/assessment-measures-operational-wave10-contract.mjs'
      - 'scripts/assessment-measures-operational-coverage.mjs'
      - 'scripts/outcome-measurement-separation-contract.mjs'
      - 'scripts/cos-instrument-mapping-wave2-contract.mjs'
      - 'scripts/cos-instrument-rights-audit-contract.mjs'
      - 'scripts/cos-instrument-rights-audit-wave4-contract.mjs'
      - 'scripts/cos-instrument-rights-audit-wave6-contract.mjs'
      - '.assessment-measures-plan.md'
      - '.github/workflows/assessment-measures-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate assessment-measures contract
        run: node scripts/assessment-measures-contract.mjs
      - name: Validate operational assessment library
        run: node scripts/assessment-measures-operational-contract.mjs
      - name: Validate operational assessment Wave 3
        run: node scripts/assessment-measures-operational-wave3-contract.mjs
      - name: Validate operational assessment Wave 4
        run: node scripts/assessment-measures-operational-wave4-contract.mjs
      - name: Validate operational assessment Wave 5
        run: node scripts/assessment-measures-operational-wave5-contract.mjs
      - name: Validate operational assessment Wave 6
        run: node scripts/assessment-measures-operational-wave6-contract.mjs
      - name: Validate operational assessment Wave 7
        run: node scripts/assessment-measures-operational-wave7-contract.mjs
      - name: Validate operational assessment Wave 8
        run: node scripts/assessment-measures-operational-wave8-contract.mjs
      - name: Validate operational assessment Wave 9
        run: node scripts/assessment-measures-operational-wave9-contract.mjs
      - name: Validate operational assessment Wave 10
        run: node scripts/assessment-measures-operational-wave10-contract.mjs
      - name: Audit operational coverage
        run: node scripts/assessment-measures-operational-coverage.mjs
      - name: Validate COS and measurement separation
        run: node scripts/outcome-measurement-separation-contract.mjs
      - name: Validate COS instrument mapping Wave 2
        run: node scripts/cos-instrument-mapping-wave2-contract.mjs
      - name: Validate COS instrument rights audit
        run: node scripts/cos-instrument-rights-audit-contract.mjs
      - name: Validate COS instrument rights audit Wave 4
        run: node scripts/cos-instrument-rights-audit-wave4-contract.mjs
      - name: Validate COS instrument rights audit Wave 6
        run: node scripts/cos-instrument-rights-audit-wave6-contract.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint