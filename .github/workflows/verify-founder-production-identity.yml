name: Verify Founder Production Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-founder-production-identity.yml'
      - 'app/layout.tsx'
      - 'app/press/page.tsx'
      - 'app/citation/page.tsx'
      - 'app/sitemaps/static.xml/route.ts'
      - 'lib/founder.ts'
  workflow_run:
    workflows: ['Deploy Analytics Production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify founder identity is live
        shell: bash
        run: |
          set -euo pipefail
          base='https://healthrenewal.org'
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          headers=(-H 'Cache-Control: no-cache, no-store, max-age=0')

          home="$(curl -fsSL --compressed --retry 6 --retry-delay 2 --retry-all-errors --max-time 25 "${headers[@]}" "${base}/?identity-check=${stamp}")"
          press="$(curl -fsSL --compressed --retry 6 --retry-delay 2 --retry-all-errors --max-time 25 "${headers[@]}" "${base}/press?identity-check=${stamp}")"
          citation="$(curl -fsSL --compressed --retry 6 --retry-delay 2 --retry-all-errors --max-time 25 "${headers[@]}" "${base}/citation?identity-check=${stamp}")"
          sitemap="$(curl -fsSL --compressed --retry 6 --retry-delay 2 --retry-all-errors --max-time 25 "${headers[@]}" "${base}/sitemaps/static.xml?identity-check=${stamp}")"

          printf '%s' "${home}" | grep -Fq 'خالد الذيب'
          printf '%s' "${home}" | grep -Fq 'Khaled altheeb'
          printf '%s' "${home}" | grep -Fq '"@type":"Person"'
          printf '%s' "${home}" | grep -Fq 'https://healthrenewal.org/#founder'

          printf '%s' "${press}" | grep -Fq 'المركز الإعلامي والهوية المؤسسية'
          printf '%s' "${press}" | grep -Fq 'خالد الذيب'
          printf '%s' "${press}" | grep -Fq 'Khaled altheeb'

          printf '%s' "${citation}" | grep -Fq 'خالد الذيب'
          printf '%s' "${citation}" | grep -Fq 'Khaled altheeb'

          printf '%s' "${sitemap}" | grep -Fq 'https://healthrenewal.org/press'

          echo 'Founder production identity verified: homepage JSON-LD, press page, citation page, and static sitemap are live.'
