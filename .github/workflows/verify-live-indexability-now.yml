name: Verify Live Production Indexability Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-indexability-now.yml'
      - 'scripts/live-production-indexability-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-live-production-indexability
  cancel-in-progress: true

env:
  PRODUCTION_ORIGIN: 'https://healthrenewal.org'
  MIN_LIVE_INDEXABLE_URLS: '3806'
  INDEXABILITY_CONCURRENCY: '16'
  INDEXABILITY_TIMEOUT_MS: '20000'

jobs:
  verify-live-indexability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context 'indexability/live' --arg description 'Auditing live homepage and every production sitemap URL' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit live production as Googlebot
        run: node scripts/live-production-indexability-contract.mjs

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live production homepage and sitemap URLs are indexable'; else state=failure; description='Live production indexability audit found failures'; fi
          payload="$(jq -n --arg state "$state" --arg context 'indexability/live' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
