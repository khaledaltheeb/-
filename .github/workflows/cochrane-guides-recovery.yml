name: Cochrane Guides Recovery

on:
  pull_request:
    paths:
      - 'data/cochrane/**'
      - 'app/cochrane/guides/**'
      - 'app/sitemap.xml/route.ts'
      - 'scripts/cochrane-guides-recovery-contract.mjs'
      - '.github/workflows/cochrane-guides-recovery.yml'
  workflow_dispatch:

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cochrane guide corpus recovery
        run: node scripts/cochrane-guides-recovery-contract.mjs
