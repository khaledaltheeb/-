name: Validate Talentia Social Work expansion

on:
  pull_request:
    paths:
      - 'lib/social-work-talentia-pages.ts'
      - 'app/evidence-guides/social-work/**'
      - 'app/sitemaps/social-work.xml/**'
      - 'app/sitemap.xml/**'
      - 'scripts/social-work-talentia-contract.mjs'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/social-work-talentia-contract.mjs
      - run: npm run typecheck
