name: Validate Encyclopedia Drafts

on:
  push:
    branches:
      - 'agent/encyclopedia-disability-inclusion-foundation'
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/research/*.json'
      - 'scripts/resolve_encyclopedia_research_plan.py'
      - 'scripts/validate_encyclopedia_draft.py'
      - '.github/workflows/validate-encyclopedia-drafts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/encyclopedia/drafts/**'
      - 'data/encyclopedia/research/*.json'
      - 'scripts/resolve_encyclopedia_research_plan.py'
      - 'scripts/validate_encyclopedia_draft.py'
      - '.github/workflows/validate-encyclopedia-drafts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile draft validation tools
        run: |
          python -m py_compile \
            scripts/resolve_encyclopedia_research_plan.py \
            scripts/validate_encyclopedia_draft.py
      - name: Validate every encyclopedia scientific-review draft
        run: |
          set -euo pipefail
          count=0
          for draft in data/encyclopedia/drafts/*-v1.json; do
            test -f "$draft"
            plan="$(python scripts/resolve_encyclopedia_research_plan.py "$draft")"
            echo "Validating $draft against $plan"
            python scripts/validate_encyclopedia_draft.py "$draft" --plan "$plan"
            count=$((count+1))
          done
          test "$count" -gt 0
          echo "Validated $count encyclopedia draft(s)."
