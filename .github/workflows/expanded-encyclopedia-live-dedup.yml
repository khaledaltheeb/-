name: Expanded Encyclopedia Live Duplicate Guard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expanded-encyclopedia-live-dedup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ghljwfwqsyfnthvlzxjy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__GMG8aQnofuk_6RLm3UfUg_fIzuSzSs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check expanded encyclopedia against published canonical content
        run: node scripts/expanded-encyclopedia-live-duplicate-contract.mjs
