name: Wire Rawafid V2 Tools Once
on:
  push:
    branches: ["android/rawafid-app-v1"]
    paths:
      - ".github/workflows/android-wire-v2-tools-once.yml"
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/rawafid-app-v1
          fetch-depth: 0
      - name: Patch v2 tools
        run: python3 scripts/patch_android_v2_tools.py
      - name: Commit v2 tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/org/healthrenewal/rawafid/MainActivity.java
          git commit -m "feat(android): expose library and symptom journal tools"
          git push origin HEAD:android/rawafid-app-v1
