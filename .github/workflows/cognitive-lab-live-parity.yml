name: Cognitive Lab Live Parity

on:
  push:
    branches: [agent/production-domain-smoke]
    paths:
      - '.github/workflows/cognitive-lab-live-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare legacy production lab with staging lab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.request
          from urllib.parse import urljoin, urlparse

          old='https://healthrenewal.org/cognitive-lab/'
          new='https://rawafid-platform-staging.khaledaltheeb.workers.dev/cognitive-lab'

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Rawafid-Parity-Audit/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode('utf-8','replace')
                  return r.status,body,r.geturl()

          def slugs_from_index(base):
              status,body,effective=fetch(base)
              assert status==200,(base,status,effective)
              found=set()
              for href in re.findall(r'href=["\']([^"\']+)["\']',body,re.I):
                  absolute=urljoin(base,html.unescape(href))
                  p=urlparse(absolute).path.rstrip('/')
                  m=re.fullmatch(r'/cognitive-lab/([^/]+)',p)
                  if m: found.add(m.group(1))
              return found,body

          old_slugs,old_index=slugs_from_index(old)
          new_slugs,new_index=slugs_from_index(new)

          missing=sorted(old_slugs-new_slugs)
          added=sorted(new_slugs-old_slugs)
          common=sorted(old_slugs & new_slugs)
          print(f'OLD_LIVE_TOOL_LINKS={len(old_slugs)}')
          print(f'NEW_STAGING_TOOL_LINKS={len(new_slugs)}')
          print(f'COMMON_SLUGS={len(common)}')
          print('MISSING_OLD_SLUGS=' + ','.join(missing))
          print('NEW_ONLY_SLUGS=' + ','.join(added))

          # Verify every staging slug resolves and includes core interactive/privacy markers.
          bad=[]
          for slug in sorted(new_slugs):
              status,body,effective=fetch(f'{new}/{slug}')
              markers=['تعليمي غير تشخيصي','جلسة','المستوى']
              if status!=200 or not all(m in body for m in markers):
                  bad.append((slug,status,[m for m in markers if m not in body]))
          print(f'NEW_STAGING_RESOLVED={len(new_slugs)-len(bad)}')
          print('NEW_STAGING_BAD=' + repr(bad))

          # Probe representative legacy routes directly on staging even when the old index omits some generated links.
          probes=['working-memory-updating','prospective-memory','associative-binding','temporal-order-memory','visual-change-detection','sustained-attention','visual-search']
          probe_results=[]
          for slug in probes:
              try:
                  status,body,effective=fetch(f'{new}/{slug}')
                  probe_results.append((slug,status,'تعليمي غير تشخيصي' in body))
              except Exception as exc:
                  probe_results.append((slug,'ERR',type(exc).__name__))
          print('LEGACY_ROUTE_PROBES=' + repr(probe_results))

          assert len(new_slugs) >= 49, len(new_slugs)
          assert not bad, bad
          assert len(missing) <= 10, missing
          print('COGNITIVE_LAB_LIVE_PARITY_AUDIT=PASS')
          PY
